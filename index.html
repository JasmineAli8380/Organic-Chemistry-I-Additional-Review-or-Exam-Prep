<div class="example"><b>Worked example — Br₂ addition to cyclohexene:</b> The Br₂ approaches one face. The two electrons of the alkene attack one Br, kicking out the other Br⁻ and forming a 3-membered cyclic <b>bromonium ion</b>. This bromonium blocks the top face. Br⁻ then attacks the bottom face (backside) at one of the two carbons, opening the ring. Result: the two Br's end up on OPPOSITE faces of the ring → trans-1,2-dibromocyclohexane.</div>
<h3>5. Carbocation rearrangements</h3><p>When a reaction goes through a carbocation (like HX or H₃O⁺ addition), the cation can rearrange to a MORE STABLE one via a hydride shift (H moves with its electrons) or methyl shift. This gives unexpected products.</p>
<div class="example"><b>Example:</b> 3,3-dimethyl-1-butene + HCl. Markovnikov says H to C1, cation on C2 (secondary). But the adjacent C3 is quaternary with three methyls — a methyl shifts from C3 to C2, generating a more stable 3° cation on C3. Cl⁻ attacks C3. Product: 2-chloro-2,3-dimethylbutane (rearranged), not 2-chloro-3,3-dimethylbutane (expected).<br><br>This is why Hg(OAc)₂ hydration is preferred when you want NO rearrangement — its mercurinium intermediate doesn't allow shifts.</div>`,
quiz:[
{q:"2-methylpropene + HBr gives:",opts:["1-bromo-2-methylpropane","2-bromo-2-methylpropane","2-bromopropane","2-methylpropan-1-ol"],correct:1,explain:"Step 1: Identify alkene carbons. (CH₃)₂C=CH₂ — tertiary C and primary C. Step 2: Markovnikov: H goes to the C with more H's (the CH₂ end). Step 3: Br ends up on the more substituted C (the C with two methyls). Product: (CH₃)₂CBr-CH₃ = 2-bromo-2-methylpropane (tert-butyl bromide)."},
{q:"Which reagent gives anti-Markovnikov hydration of an alkene?",opts:["H₂O/H₂SO₄","Hg(OAc)₂/H₂O then NaBH₄","BH₃·THF then H₂O₂/NaOH","HBr"],correct:2,explain:"Hydroboration-oxidation (BH₃ then H₂O₂/OH⁻) is the standard anti-Markovnikov hydration. The boron adds to the LESS substituted carbon (steric reasons), then oxidation replaces B with OH while keeping the same position. Result: OH on the less substituted C, H on the more substituted C. Stereochemistry is also syn."},
{q:"Cyclohexene + Br₂ in CH₂Cl₂ produces:",opts:["1,1-dibromocyclohexane","cis-1,2-dibromocyclohexane","trans-1,2-dibromocyclohexane","bromocyclohexane"],correct:2,explain:"Step 1: Mechanism — Br₂ forms a 3-membered bromonium ion across one face of the C=C. Step 2: Br⁻ then attacks the OPPOSITE face (backside attack) at one of the ring carbons. Step 3: The two Br atoms end up on opposite faces of the ring → trans-1,2-dibromocyclohexane. This anti-addition is a hallmark of halogenation."},
{q:"What is the major product when 1-methylcyclohexene is treated with Hg(OAc)₂/H₂O then NaBH₄?",opts:["1-methylcyclohexanol","2-methylcyclohexanol","cyclohexanol","methylenecyclohexane"],correct:0,explain:"Step 1: Oxymercuration follows Markovnikov, no rearrangement. Step 2: 1-methylcyclohexene has a tertiary alkene C (the one with the methyl) and a secondary alkene C. Markovnikov puts OH on the more substituted C. Step 3: OH ends up on C1 (the carbon also bearing the methyl) → 1-methylcyclohexanol."},
{q:"H₂ with Lindlar catalyst converts an alkyne to:",opts:["alkane","cis-alkene","trans-alkene","aldehyde"],correct:1,explain:"Lindlar catalyst is poisoned palladium (Pd/CaCO₃ with Pb). It's a 'partial reduction' catalyst: it reduces alkynes to alkenes (syn addition of H₂) but then stops — it can't reduce alkenes further. Syn addition of H₂ to an alkyne gives the cis (Z) alkene. To get the trans alkene from an alkyne, use Li/NH₃ instead."},
{q:"Ozonolysis (O₃ then Zn/H₃O⁺) of 2-methylbut-2-ene gives:",opts:["acetone + acetaldehyde","2 acetones","2 acetaldehydes","propanone + propanal"],correct:0,explain:"Step 1: Identify the alkene. 2-methylbut-2-ene = (CH₃)₂C=CHCH₃. Step 2: Ozonolysis cleaves the C=C and replaces it with two C=O groups, one on each former alkene carbon. Step 3: The (CH₃)₂C= side becomes (CH₃)₂C=O = acetone (no H, so ketone). The =CHCH₃ side becomes O=CHCH₃ = acetaldehyde (H present, so aldehyde). Products: acetone + acetaldehyde."},
{q:"Why does 3,3-dimethyl-1-butene give a rearranged product with HCl?",opts:["the alkene isomerizes first","the initial 2° carbocation rearranges to a more stable 3° cation via methyl shift","HCl decomposes","the rearrangement is a coincidence"],correct:1,explain:"Step 1: H⁺ adds to C1 (Markovnikov), generating a 2° cation at C2. Step 2: C3 is quaternary with three methyls. A methyl group migrates from C3 to C2 with its bonding electrons, generating a 3° cation now on C3. Step 3: Cl⁻ attacks C3. The migration happens because the new cation is significantly more stable. This is why oxymercuration is preferred when rearrangement must be avoided."},
{q:"OsO₄ followed by NaHSO₃ converts an alkene to:",opts:["a cis-1,2-diol","a trans-1,2-diol","a ketone","an epoxide"],correct:0,explain:"OsO₄ adds to the C=C in a concerted SYN fashion across one face, forming a cyclic osmate ester. NaHSO₃ then hydrolyzes the ester, releasing the diol. Because both new C–O bonds formed on the SAME face of the original alkene, the two OH groups end up cis to each other → cis-1,2-diol (also called a syn-diol)."},
{q:"What's the product of 2-methylpropene + HBr in the presence of peroxides (ROOR)?",opts:["2-bromo-2-methylpropane (Markovnikov)","1-bromo-2-methylpropane (anti-Markovnikov)","2-methylpropan-1-ol","no reaction"],correct:1,explain:"Peroxides switch the mechanism from ionic to RADICAL. The radical mechanism gives the OPPOSITE regiochemistry from normal HBr addition. In radical addition, Br• adds first (to the less substituted C, generating the more stable radical on the more substituted C), then H• transfers. Result: Br on the less substituted C, H on the more substituted C — anti-Markovnikov. Note: this peroxide effect ONLY works with HBr, not HCl or HI."},
{q:"Which reagent would convert 1-butene to butane?",opts:["O₃ then Zn","Br₂","H₂ / Pd-C","mCPBA"],correct:2,explain:"Catalytic hydrogenation (H₂ with Pd, Pt, or Ni catalyst) reduces an alkene to an alkane by adding two H atoms across the double bond. It's a syn addition. 1-butene (CH₃CH₂CH=CH₂) + H₂/Pd gives butane (CH₃CH₂CH₂CH₃). The other reagents give different products: O₃ cleaves, Br₂ adds Br's, mCPBA gives an epoxide."}
]},

m7:{title:"Alkynes",lead:"Triple bonds, acidic terminal H's, and how to use acetylides as carbon nucleophiles to build bigger molecules.",
body:`<h3>Why alkynes are special</h3><p>An alkyne has a C≡C triple bond: 1 σ + 2 π bonds. The two π bonds give it electron density on all sides (cylindrical, not planar), and the sp hybridization makes the carbons very electronegative — they hold electrons tightly. This has two huge consequences: (1) terminal alkynes are unusually acidic, and (2) the resulting acetylide ion is a powerful carbon nucleophile that can build new C–C bonds.</p>
<h3>1. The acidity of terminal alkynes</h3><div class="concept"><b>Terminal alkyne</b> = C≡C–H (the H sits on a triple-bonded carbon).<br><b>pKa ≈ 25</b> for terminal alkynes — much more acidic than alkenes (pKa ≈ 44) or alkanes (pKa ≈ 50).<br>Why? The conjugate base (acetylide ion, RC≡C⁻) holds the negative charge on an sp carbon. sp carbons are 50% s-character, vs 33% for sp² and 25% for sp³. More s-character means electrons are held closer to the nucleus, stabilizing negative charge.</div>
<div class="example"><b>Acidity ranking:</b> H₂O (pKa 16) > terminal alkyne (25) > NH₃ (35) > alkene (44) > alkane (50). This means strong bases like NaNH₂ (conjugate base of NH₃, pKa 35) can fully deprotonate a terminal alkyne. NaOH (conjugate base of water) is NOT strong enough — water is more acidic than the alkyne, so the equilibrium would go the wrong way.</div>
<h3>2. Acetylide alkylation — the C–C bond builder</h3><div class="concept"><b>Two-step synthesis:</b><br>Step 1: R–C≡C–H + NaNH₂ → R–C≡C⁻ Na⁺ + NH₃ (deprotonation)<br>Step 2: R–C≡C⁻ + R'–CH₂–X → R–C≡C–CH₂–R' + X⁻ (SN2 alkylation)<br><br><b>Critical limitation:</b> The alkyl halide R'–X must be PRIMARY (or methyl). Secondary or tertiary halides give E2 elimination instead — the strong acetylide acts as a base and just removes a proton, regenerating the alkene starting material. Frustrating but unavoidable.</div>
<div class="example"><b>Worked example — synthesizing 2-pentyne from acetylene:</b><br>Goal: HC≡C–H → CH₃–C≡C–CH₂CH₃<br>Step 1: HC≡CH + NaNH₂ → HC≡C⁻Na⁺<br>Step 2: HC≡C⁻ + CH₃Br → HC≡C–CH₃ (propyne)<br>Step 3: HC≡C–CH₃ + NaNH₂ → ⁻C≡C–CH₃<br>Step 4: ⁻C≡C–CH₃ + CH₃CH₂Br → CH₃CH₂–C≡C–CH₃ (2-pentyne) ✓<br>Notice you can alkylate twice if the starting material is acetylene (HC≡CH) — both ends have an acidic H.</div>
<h3>3. Reduction of alkynes — three options for three products</h3><table><tr><th>Reagent</th><th>Product</th><th>Stereochemistry</th></tr>
<tr><td>H₂ / Pt or Pd-C (excess)</td><td>alkane</td><td>fully reduced</td></tr>
<tr><td>H₂ / Lindlar catalyst</td><td>cis (Z) alkene</td><td>syn addition, stops at alkene</td></tr>
<tr><td>Na or Li in NH₃(l)</td><td>trans (E) alkene</td><td>dissolving metal, anti addition</td></tr></table>
<div class="tip">⭐ <b>The Lindlar/Li trick:</b> When a synthesis problem says "give me only the cis alkene" or "give me only the trans alkene", you can ALWAYS get there by going through an alkyne and choosing the right reduction. Alkyne → cis means Lindlar; alkyne → trans means Li/NH₃.</div>
<h3>4. Addition reactions of alkynes</h3><p>Most alkene addition reactions (HX, X₂, hydration) also work on alkynes — just twice if you use excess reagent. Markovnikov rules still apply.</p>
<div class="example"><b>Hydration of a terminal alkyne — the keto-enol surprise:</b><br>HC≡C–R + H₂O / H₂SO₄ / HgSO₄ → enol intermediate (CH₂=C(OH)–R) → tautomerizes to KETONE (CH₃–CO–R). The "alcohol on a double bond" (enol) is unstable; it rearranges to the carbonyl (keto form). Markovnikov places the OH on the more substituted carbon, so terminal alkynes give methyl ketones, not aldehydes. To get the aldehyde, use hydroboration (anti-Markovnikov) instead.</div>
<h3>5. Oxidative cleavage</h3><p>Strong oxidants (KMnO₄/H₃O⁺ or O₃) cleave the C≡C completely, giving two carboxylic acids (or CO₂ from a terminal CH).</p>`,
quiz:[
{q:"Which has the highest pKa (least acidic)?",opts:["H₂O","HC≡CH (acetylene)","CH₃CH₃ (ethane)","NH₃"],correct:2,explain:"Step 1: Recall the acidity ladder. Lower pKa = more acidic. Step 2: pKa values: H₂O ≈ 16, terminal alkyne ≈ 25, NH₃ ≈ 35, alkane ≈ 50. Step 3: Highest pKa = least acidic = ethane (≈50). The alkyl C–H bond holds its electrons in sp³ orbitals (only 25% s character) — terrible at stabilizing negative charge."},
{q:"What base is needed to fully deprotonate a terminal alkyne?",opts:["NaOH","NaHCO₃","NaNH₂","H₂O"],correct:2,explain:"Step 1: For full deprotonation, the base must be stronger than the conjugate base of the acid being deprotonated. Step 2: Terminal alkyne pKa ≈ 25; we need a base whose conjugate acid has pKa > 25. Step 3: NH₂⁻ (from NaNH₂) has conjugate acid NH₃ (pKa 35). 35 > 25 → strong enough. NaOH's conjugate acid is H₂O (pKa 16) — way too weak."},
{q:"You want to synthesize hex-3-yne from but-1-yne. Which reagents?",opts:["NaNH₂ then 2-bromopropane","NaNH₂ then bromoethane","NaOH then bromoethane","Li/NH₃ then bromoethane"],correct:1,explain:"Step 1: Goal is CH₃CH₂C≡CCH₂CH₃ from CH₃CH₂C≡CH. Step 2: Deprotonate but-1-yne with NaNH₂ to form the acetylide. Step 3: Alkylate with PRIMARY alkyl halide. Bromoethane (CH₃CH₂Br) is primary and adds an ethyl → product is hex-3-yne. ✓ 2-Bromopropane is secondary — it would give E2 elimination instead, regenerating an alkene. Always use primary halides with acetylides."},
{q:"To convert 2-butyne to trans-2-butene, use:",opts:["H₂ / Pd-C","H₂ / Lindlar","Na / NH₃ (liquid)","HBr"],correct:2,explain:"Step 1: Identify the goal: alkyne → trans alkene. Step 2: Lindlar gives syn addition → cis alkene (wrong). Pd-C goes all the way to alkane (over-reduction). Step 3: Dissolving metal reduction (Na or Li in liquid NH₃) gives anti addition through a vinyl radical/anion intermediate → trans (E) alkene. This is the only way to make a trans alkene from an alkyne."},
{q:"Hydration of 1-butyne (HC≡C–CH₂CH₃) with H₂SO₄/HgSO₄/H₂O gives:",opts:["butanal (CH₃CH₂CH₂CHO)","butan-2-one (CH₃COCH₂CH₃)","butan-1-ol","but-2-en-1-ol"],correct:1,explain:"Step 1: Markovnikov hydration of an alkyne → enol → tautomerizes to ketone. Step 2: Markovnikov puts OH on the more substituted carbon. The terminal alkyne CH end is the LESS substituted (only 1 R group). The internal C is more substituted. Step 3: OH ends up on the internal C → enol CH₂=C(OH)CH₂CH₃ → tautomerizes to CH₃COCH₂CH₃ = butan-2-one (a methyl ketone). Terminal alkynes always give methyl ketones, not aldehydes, with Markovnikov hydration."},
{q:"To make an aldehyde from a terminal alkyne, use:",opts:["H₂SO₄/H₂O/HgSO₄","BH₃ then H₂O₂/NaOH","HBr","KMnO₄"],correct:1,explain:"Step 1: Markovnikov hydration gives a ketone (OH ends up on the internal C). Step 2: Hydroboration is anti-Markovnikov, placing the boron (and ultimately OH) on the LESS substituted carbon — the terminal CH. Step 3: That gives an enol with OH on the terminal C, which tautomerizes to an ALDEHYDE. So: terminal alkyne + BH₃ then H₂O₂/NaOH → aldehyde."},
{q:"How many π bonds are in but-2-yne?",opts:["1","2","3","4"],correct:1,explain:"But-2-yne is CH₃-C≡C-CH₃. It contains one C≡C triple bond. A triple bond is 1 σ + 2 π. Plus all the single bonds in the rest of the molecule are σ bonds. So there are exactly 2 π bonds (both in the triple bond)."},
{q:"What's the product of acetylene (HC≡CH) + 2 equivalents of HBr?",opts:["1,1-dibromoethane","1,2-dibromoethane","vinyl bromide","trans-1,2-dibromoethene"],correct:0,explain:"Step 1: First HBr adds Markovnikov: H to one CH, Br to the other → CH₂=CHBr (vinyl bromide). Step 2: Second HBr adds to the new alkene, also Markovnikov. The Br already on C1 stabilizes a cation on the SAME carbon (resonance), so the second H goes to C2 and the second Br to C1. Step 3: Final product = CHBr₂-CH₃ = 1,1-dibromoethane (geminal dibromide). Both Br's end up on the same carbon."},
{q:"Why don't acetylide ions work well with secondary or tertiary alkyl halides?",opts:["the reaction is too slow","the acetylide acts as a base and causes E2 elimination instead","carbocations form","the products are unstable"],correct:1,explain:"Step 1: Acetylides are strong bases AND nucleophiles. Step 2: With primary halides, SN2 substitution is fast and dominant — backside attack works easily on uncrowded primary carbons. Step 3: With 2° or 3° halides, the acetylide can't get to the carbon (steric hindrance), so it goes for the most accessible β-hydrogen instead and rips it off → E2 elimination. The product is the alkene, with the acetylide having merely served as a base. Lesson: only use primary alkyl halides with acetylides."},
{q:"Oxidative cleavage of CH₃-C≡C-CH₂CH₃ with KMnO₄/H₃O⁺ gives:",opts:["acetone + propanal","acetic acid + propanoic acid","pentanedioic acid","2-butanone"],correct:1,explain:"Step 1: Strong oxidative cleavage of an alkyne breaks the C≡C and oxidizes both former alkyne carbons to carboxylic acids (–COOH). Step 2: The CH₃-C≡ side becomes CH₃-COOH = acetic acid. Step 3: The ≡C-CH₂CH₃ side becomes HOOC-CH₂CH₃ = propanoic acid. Note: if either alkyne carbon were terminal (≡C-H), it would be cleaved all the way to CO₂ instead."}
]},

m8:{title:"Alkyl Halides: SN1, SN2, E1, E2",lead:"The four-way decision tree every orgo student must master. Pick the right mechanism, predict the right product.",
body:`<h3>The big picture</h3><p>An alkyl halide (R–X where X = Cl, Br, I) has a polarized C–X bond — the carbon is δ+ (electrophilic), the halogen is δ− and a decent leaving group. When a nucleophile or base shows up, four possible reactions can happen:</p><ul><li><b>SN2:</b> nucleophile attacks the carbon, kicks out the leaving group in one step</li><li><b>SN1:</b> leaving group leaves first (forms cation), then nucleophile attacks</li><li><b>E2:</b> base removes a β-H, the C–X breaks, double bond forms — all in one step</li><li><b>E1:</b> leaving group leaves first (cation), then base removes β-H</li></ul>
<p>Knowing which one happens depends on FOUR factors: substrate, nucleophile/base, solvent, and temperature.</p>
<h3>1. Substrate effects</h3><table><tr><th>Substrate</th><th>SN2</th><th>SN1</th><th>E2</th><th>E1</th></tr>
<tr><td>Methyl (CH₃X)</td><td>✅ great</td><td>❌ never</td><td>❌ no β-H</td><td>❌ never</td></tr>
<tr><td>Primary (1°)</td><td>✅ great</td><td>❌ poor</td><td>⚠️ with bulky base</td><td>❌ poor</td></tr>
<tr><td>Secondary (2°)</td><td>✅ ok</td><td>⚠️ ok</td><td>✅ ok</td><td>⚠️ ok</td></tr>
<tr><td>Tertiary (3°)</td><td>❌ never (steric)</td><td>✅ great</td><td>✅ great</td><td>✅ great</td></tr></table>
<div class="tip">⭐ <b>Quick rule:</b> Methyl and 1° → only SN2 or E2 are possible (no carbocation can form). 3° → only SN1 or E2/E1 (too crowded for SN2). 2° is the swing case — depends entirely on conditions.</div>
<h3>2. Nucleophile / base strength</h3><div class="concept"><b>Strong nucleophile, weak base:</b> favors SN2 (e.g., I⁻, Br⁻, RS⁻, CN⁻, N₃⁻).<br><b>Strong base:</b> favors E2 (e.g., RO⁻, HO⁻, H₂N⁻).<br><b>Strong AND bulky base:</b> almost always E2, often gives the LESS substituted (Hofmann) alkene (e.g., KOtBu, LDA).<br><b>Weak nucleophile / weak base:</b> favors SN1/E1 (e.g., neutral H₂O, ROH, RCOOH).</div>
<h3>3. Solvent effects</h3><div class="concept"><b>Polar protic</b> (water, alcohols): hydrogen-bonds with anions, slowing nucleophiles. Good at solvating cations → favors SN1/E1.<br><b>Polar aprotic</b> (DMSO, DMF, acetone, acetonitrile): solvates cations but NOT anions, leaving anionic nucleophiles 'naked' and reactive → favors SN2.</div>
<h3>4. Stereochemistry — the killer detail</h3><div class="concept"><b>SN2:</b> backside attack → complete <b>inversion</b> of configuration (Walden inversion). (R) → (S) cleanly.<br><b>SN1:</b> goes through flat carbocation → nucleophile attacks either face equally → <b>racemization</b> (50:50 mix).<br><b>E2:</b> requires <b>anti-periplanar</b> H and leaving group (180° apart). On cyclohexanes, this means both must be axial in the same chair.<br><b>E1:</b> mixture of E and Z, usually favors more substituted (Zaitsev) alkene.</div>
<h3>5. Zaitsev vs Hofmann — which alkene forms?</h3><div class="concept"><b>Zaitsev's rule (default):</b> the more substituted alkene is more stable and forms preferentially. Most E2 reactions with normal bases give Zaitsev.<br><b>Hofmann (exception):</b> when the base is BULKY (KOtBu, LDA), it can't reach the more hindered β-H, so it grabs the more accessible one — giving the LESS substituted alkene.</div>
<div class="example"><b>Worked example:</b> 2-bromo-2-methylbutane + KOtBu.<br>Substrate: 3° → no SN2. KOtBu = strong, BULKY base → E2 dominates. Two β-carbons available: one CH₃ (3 H's, less hindered) and one CH₂CH₃ (2 H's, more hindered).<br>Bulky base prefers the less hindered CH₃. Result: 2-methyl-but-1-ene (Hofmann product, terminal alkene), NOT 2-methyl-but-2-ene (Zaitsev).</div>
<h3>6. The decision tree</h3><div class="concept"><ol><li><b>Substrate?</b> Methyl/1° → SN2 or E2 only. 3° → SN1/E1 or E2 only. 2° → keep reading.</li><li><b>Nucleophile/base?</b> Strong Nu, weak base → SN2. Strong base (small) → E2 (Zaitsev). Strong base (bulky) → E2 (Hofmann). Weak/neutral → SN1 + E1.</li><li><b>Solvent?</b> Polar aprotic → boosts SN2. Polar protic → boosts SN1/E1.</li><li><b>Heat?</b> Pushes any reaction toward elimination over substitution.</li></ol></div>`,
quiz:[
{q:"(R)-2-bromobutane reacts with NaI in acetone. The product is:",opts:["(R)-2-iodobutane","(S)-2-iodobutane","racemic 2-iodobutane","2-butene"],correct:1,explain:"Step 1: Substrate is 2°. Nucleophile is I⁻ (strong, weak base). Solvent is acetone (polar aprotic — boosts SN2). Step 2: All conditions point to SN2. Step 3: SN2 = backside attack = complete inversion of configuration. Starting material is (R) → product is (S). The Finkelstein reaction (NaI in acetone) is the textbook SN2 example."},
{q:"Tert-butyl bromide (CH₃)₃CBr is heated in water. What happens?",opts:["SN2 substitution","SN1 substitution","E2 elimination","no reaction"],correct:1,explain:"Step 1: Substrate is 3° — too crowded for SN2 (would never happen). Step 2: Water is the nucleophile and solvent — neutral, weak nucleophile, polar protic. Step 3: 3° + weak Nu + polar protic = textbook SN1. The C–Br ionizes to form a stable 3° cation, then water attacks, then a proton is lost → product is tert-butyl alcohol. Some E1 may also occur (giving isobutylene), but SN1 typically dominates with neutral water."},
{q:"What conditions favor E2 with the Hofmann (less substituted) product?",opts:["small strong base like NaOEt","weak base like H₂O","large bulky base like KOtBu","no base at all"],correct:2,explain:"Step 1: Strong base = elimination over substitution. Step 2: BULKY base = can't reach the more hindered β-H near the more substituted side. Step 3: Bulky base grabs the more accessible (less hindered) β-H, leading to the LESS substituted alkene. KOtBu (potassium tert-butoxide) and LDA are the classic bulky bases. Small strong bases like NaOEt give Zaitsev (more substituted) instead."},
{q:"Why does (CH₃)₃CCl react fast in water but (CH₃)₃CCH₂Cl reacts very slowly?",opts:["the second molecule is heavier","the first is 3° (forms stable cation, fast SN1); the second is 1° (would need SN2, but neopentyl is too hindered)","they have different leaving groups","water is too cold"],correct:1,explain:"Step 1: (CH₃)₃CCl is tert-butyl chloride — 3° carbon. Ionizes easily to a stable 3° cation → fast SN1. Step 2: (CH₃)₃CCH₂Cl is neopentyl chloride — the C–Cl carbon is PRIMARY (only one R group attached), but the adjacent quaternary carbon blocks backside attack completely. Step 3: Primary substrate + no SN1 possible (1° cation too unstable) + SN2 blocked by steric crowding = essentially no reaction. Neopentyl halides are famously unreactive."},
{q:"E2 elimination on a cyclohexane requires:",opts:["the leaving group axial AND a β-H axial (anti-periplanar)","both substituents equatorial","cis arrangement","heating to 200°C"],correct:0,explain:"Step 1: E2 demands anti-periplanar geometry (the H and leaving group must be 180° apart, in the same plane). Step 2: On a cyclohexane chair, the only way to have two substituents at 180° on adjacent carbons is BOTH AXIAL. Step 3: So you need the leaving group axial AND a β-H on the adjacent carbon also axial. If the leaving group is locked equatorial (e.g., by a t-Bu anchor), E2 can't happen and the molecule has to wait for a ring flip. This is the basis of many stereochemistry problems."},
{q:"Which solvent best promotes SN2?",opts:["water","ethanol","DMSO","hexane"],correct:2,explain:"Step 1: SN2 needs a 'naked', reactive nucleophile. Step 2: Polar aprotic solvents (DMSO, DMF, acetone, acetonitrile) dissolve ionic nucleophiles by solvating the cation but leave the anionic nucleophile relatively unsolvated and reactive. Step 3: Water and ethanol are polar protic — they H-bond to anions, surrounding and 'caging' them, slowing SN2. Hexane is nonpolar and won't dissolve ionic nucleophiles at all. DMSO is the best choice."},
{q:"2-bromo-2-methylbutane + NaOEt (small strong base) gives mainly:",opts:["2-methylbut-1-ene (Hofmann)","2-methylbut-2-ene (Zaitsev)","2-ethoxy-2-methylbutane","racemic substitution product"],correct:1,explain:"Step 1: Substrate is 3°. NaOEt is strong base (favors E2) but NOT bulky. Step 2: E2 with a small base follows Zaitsev → forms the more substituted alkene. Step 3: Two β-positions: removing H from CH₃ gives 2-methylbut-1-ene (less subst.). Removing H from CH₂CH₃ gives 2-methylbut-2-ene (trisubstituted, more stable). Zaitsev wins → 2-methylbut-2-ene."},
{q:"In SN2, the rate depends on:",opts:["only [substrate]","only [nucleophile]","both [substrate] AND [nucleophile]","neither (zero order)"],correct:2,explain:"Step 1: SN2 stands for 'substitution, nucleophilic, BIMOLECULAR'. Step 2: Bimolecular means TWO species are involved in the rate-limiting step (the only step, since it's concerted). Step 3: Rate = k[R-X][Nu⁻]. Doubling either one doubles the rate. Compare to SN1, which is unimolecular: rate = k[R-X] only, because the slow step is just the ionization of the substrate."},
{q:"What's the major product of (S)-3-bromo-3-methylhexane in ethanol at room temperature (no added base)?",opts:["only (R)-3-ethoxy-3-methylhexane","only (S)-3-ethoxy-3-methylhexane","racemic 3-ethoxy-3-methylhexane","an alkene"],correct:2,explain:"Step 1: Substrate is 3° → no SN2 possible. Step 2: Ethanol is the nucleophile/solvent — neutral, weak, polar protic. Step 3: 3° + neutral weak Nu + polar protic = SN1. The C–Br ionizes to a flat 3° cation, destroying the stereocenter. Ethanol then attacks from either face equally → racemic mixture (50:50 R and S). Some E1 product may form too, but the substitution is fully racemized."},
{q:"You have a 1° alkyl halide and you want substitution, NOT elimination. What conditions?",opts:["KOtBu, heat","NaI in acetone, room temperature","NaOH in ethanol, reflux","NaNH₂"],correct:1,explain:"Step 1: 1° substrate already favors substitution over elimination naturally. Step 2: Use a strong nucleophile that is a WEAK base — I⁻ qualifies (great Nu, terrible base). Step 3: Use polar aprotic solvent (acetone). Step 4: Mild temperature — heat would push toward elimination. NaI/acetone/RT is the gold standard for clean SN2 on a primary halide. The other options use either bulky bases (KOtBu) or strong heated bases (NaOH reflux, NaNH₂) — all of which would give elimination."}
]},

m9:{title:"Conjugation & Diels-Alder",lead:"Why alternating double bonds are special, and how to use them to build six-membered rings in one step.",
body:`<h3>Why conjugation matters</h3><p>A <b>conjugated</b> system has alternating double-single-double bonds (or any pattern with overlapping p-orbitals all in a row). The p-orbitals merge into one continuous π system, delocalizing the electrons over multiple atoms. This delocalization LOWERS the molecule's energy — conjugated systems are more stable than isolated double bonds.</p>
<div class="example"><b>Compare:</b> 1,3-pentadiene (CH₂=CH-CH=CH-CH₃, conjugated) is about 4 kcal/mol more stable than 1,4-pentadiene (CH₂=CH-CH₂-CH=CH₂, isolated). Same atoms, same number of double bonds — the difference is purely from delocalization.</div>
<h3>1. Stability ranking of dienes</h3><p>From most to least stable:</p><ol><li><b>Conjugated</b> (e.g., 1,3-butadiene) — p-orbitals overlap, electrons delocalize</li><li><b>Isolated</b> (e.g., 1,4-pentadiene) — double bonds act independently</li><li><b>Cumulated</b> (allenes, C=C=C) — strained, unusual geometry</li></ol>
<p>And among conjugated dienes themselves, more substitution = more stable, and trans (E) > cis (Z) due to steric reasons.</p>
<h3>2. s-cis vs s-trans conformation</h3><div class="concept">A conjugated diene can rotate around the central single bond. Two key shapes:<br><b>s-cis:</b> the two double bonds point the same way (U-shape). Required for Diels-Alder.<br><b>s-trans:</b> the two double bonds point opposite directions (zigzag). More stable but unreactive in Diels-Alder.<br>Most dienes interconvert freely between s-cis and s-trans, but some (e.g., locked in rings) are stuck in one shape.</div>
<h3>3. The Diels-Alder reaction</h3><div class="concept"><b>Diene + dienophile → cyclohexene ring</b><br>This is a [4+2] cycloaddition: 4 π electrons from the diene + 2 π electrons from the dienophile combine in a single concerted step to form 2 new σ bonds and 1 new ring.</div>
<div class="example"><b>Worked example — the simplest Diels-Alder:</b><br>Diene: 1,3-butadiene (CH₂=CH-CH=CH₂)<br>Dienophile: ethylene (CH₂=CH₂)<br>Product: cyclohexene<br>The diene must be in the s-cis shape. Its two terminal carbons reach down and bond to the two carbons of the dienophile. The middle single bond of the diene becomes a double bond. Net result: a six-membered ring with one C=C remaining.</div>
<h3>4. What makes a good dienophile?</h3><p>The dienophile reacts faster when it has <b>electron-withdrawing groups</b> (EWGs) attached: –CHO, –COR, –COOR, –CN, –NO₂. These pull electron density away from the C=C, making it more electrophilic and a better partner for the electron-rich diene.</p>
<div class="example"><b>Reactivity:</b> ethylene is sluggish, but acrolein (CH₂=CH-CHO), maleic anhydride, and methyl acrylate are fast. Maleic anhydride is the textbook 'standard dienophile' because it's symmetric, highly electron-poor, and gives clean reactions.</div>
<h3>5. Stereochemistry of Diels-Alder</h3><div class="concept"><b>Concerted = stereospecific.</b> Whatever stereochemistry the starting materials had is preserved in the product:<br>• cis substituents on the dienophile end up cis on the new ring<br>• trans substituents stay trans<br>• The diene geometry (E/Z of each double bond) is also preserved<br><br><b>Endo rule:</b> when there's a choice, the EWG of the dienophile prefers to point UNDER the diene (endo), not away from it (exo). This gives one specific diastereomer as the major product.</div>
<h3>6. Diels-Alder with substituted dienes — orientation</h3><p>When both diene and dienophile are unsymmetric, you get a single major regiochemistry. The rule of thumb: the product has the donor and acceptor groups in a 1,2 ('ortho') or 1,4 ('para') relationship, NOT 1,3 ('meta'). Memorize: <b>'ortho/para wins.'</b></p>`,
quiz:[
{q:"Which diene is most stable?",opts:["1,4-pentadiene","1,3-pentadiene (E)","1,3-pentadiene (Z)","1,2-pentadiene (allene)"],correct:1,explain:"Step 1: Among the choices, identify which are conjugated. 1,4-pentadiene has an isolated CH₂ between the double bonds — NOT conjugated. 1,3-pentadiene has alternating double-single-double — conjugated. 1,2-pentadiene is an allene (cumulated, strained). Step 2: Conjugated > isolated > cumulated. Step 3: Between (E) and (Z) of 1,3-pentadiene, (E) is less sterically strained → most stable. Answer: (E)-1,3-pentadiene."},
{q:"For a Diels-Alder reaction to occur, the diene must be in which conformation?",opts:["s-cis","s-trans","fully eclipsed","gauche"],correct:0,explain:"Step 1: Diels-Alder forms a 6-membered ring by joining the diene's terminal carbons with the dienophile's carbons. Step 2: The terminal carbons can only reach the dienophile when they point the same way — that's the s-cis conformation (U-shape). Step 3: s-trans points the terminals in opposite directions, so they're too far apart to reach the dienophile. A diene locked in s-trans (like 1,3-butadiene in a strained ring) cannot do Diels-Alder."},
{q:"Which dienophile reacts FASTEST in a Diels-Alder?",opts:["ethylene (CH₂=CH₂)","propene","maleic anhydride","cyclohexene"],correct:2,explain:"Step 1: Diels-Alder rate depends on how electron-poor the dienophile is. Step 2: Ethylene and propene have no electron-withdrawing groups → slow. Cyclohexene is similar. Step 3: Maleic anhydride has TWO carbonyl groups attached to its C=C, making it extremely electron-poor → very fast. It's the gold standard dienophile in textbook problems."},
{q:"Diels-Alder of 1,3-butadiene and methyl acrylate (CH₂=CH-CO₂Me) gives a cyclohexene with the ester group:",opts:["on the new C=C","on a saturated ring carbon","outside the ring","cleaved off"],correct:1,explain:"Step 1: Visualize the new bonds. The dienophile's C=C becomes a single bond in the product. Step 2: The two carbons of the dienophile become two adjacent saturated ring carbons. The –CO₂Me group is attached to one of those saturated carbons. Step 3: The new C=C of the cyclohexene is between what used to be the middle carbons of the diene, NOT where the ester is. So the ester ends up on a saturated (sp³) ring carbon."},
{q:"In Diels-Alder, cis substituents on the dienophile end up:",opts:["trans on the product","cis on the product","randomly arranged","separated to opposite ends of the ring"],correct:1,explain:"Step 1: Diels-Alder is concerted — both new σ bonds form simultaneously in a single step. Step 2: A concerted reaction is stereospecific: it CANNOT scramble stereochemistry because there's no intermediate to rearrange. Step 3: Whatever cis/trans relationship the substituents had on the dienophile, they keep in the product. cis stays cis. This is one of the most useful features of Diels-Alder for synthesis — you can predict and control stereochemistry exactly."},
{q:"Which of these dienes CANNOT do Diels-Alder?",opts:["1,3-butadiene","2,3-dimethyl-1,3-butadiene","cyclopentadiene","a diene locked in the s-trans conformation"],correct:3,explain:"Step 1: Most acyclic dienes can rotate freely between s-cis and s-trans, so even though s-trans is more stable, they can access s-cis for the reaction. Step 2: Cyclopentadiene is a textbook example — its ring locks it in s-cis, making it extremely reactive. Step 3: A diene locked in s-trans (e.g., one trapped in a rigid ring system that prevents rotation) cannot reach s-cis and therefore cannot react. Geometry is everything in Diels-Alder."},
{q:"Why is the Diels-Alder reaction described as 'pericyclic'?",opts:["it makes peri-substituted products","all bond changes happen at once around a cyclic transition state","it requires a peroxide initiator","peri is Greek for cycloaddition"],correct:1,explain:"Step 1: A pericyclic reaction is one where bond-making and bond-breaking happen simultaneously, with electrons moving in a cyclic loop in the transition state. Step 2: In Diels-Alder, six electrons (4 from diene + 2 from dienophile) flow around a 6-membered cyclic transition state. Step 3: No intermediates, no charges, no radicals — just a single concerted step. Other pericyclic reactions include electrocyclizations and sigmatropic rearrangements."},
{q:"How many new sigma bonds form in a Diels-Alder reaction?",opts:["1","2","3","4"],correct:1,explain:"Step 1: Count the new ring connections. The diene's two ends (C1 and C4) each form a new bond to one carbon of the dienophile. Step 2: That's 2 new σ bonds — they close the new 6-membered ring. Step 3: At the same time, 2 π bonds are broken (one from each starting alkene) and 1 new π bond forms (between the middle two carbons of the former diene). Net: −2 π, +2 σ, +1 π. Two σ bonds is the answer."},
{q:"The endo rule says that in a Diels-Alder reaction:",opts:["the diene goes inside the ring","the EWG of the dienophile prefers to point under the diene in the transition state","the product is always exo","oxygen ends up inside"],correct:1,explain:"Step 1: When a Diels-Alder produces a bicyclic product (like with cyclopentadiene), there are two possible orientations: endo (EWG under the diene) and exo (EWG away from the diene). Step 2: Even though exo is often more stable in the final product, the endo transition state is lower in energy due to favorable secondary orbital interactions between the EWG and the diene π system. Step 3: This is a kinetic preference — endo is the major product even though exo would be slightly more stable. The endo rule is reliable enough to predict the major diastereomer in most cases."},
{q:"Which combination would give a substituted cyclohexene with substituents in a 1,4 ('para') relationship?",opts:["1-methoxy-1,3-butadiene + acrolein","2-methoxy-1,3-butadiene + acrolein","unsubstituted butadiene + ethylene","cyclopentadiene + ethylene"],correct:0,explain:"Step 1: The 'ortho/para rule' for unsymmetric Diels-Alder: the donor (e.g., –OMe) and acceptor (e.g., –CHO) end up either 1,2 (ortho) or 1,4 (para) on the product, never 1,3 (meta). Step 2: When the donor is on C1 of the diene (1-methoxy), it directs the dienophile so that the EWG ends up para. Step 3: When the donor is on C2 of the diene (2-methoxy), it directs ortho. So 1-methoxy + acrolein → para-substituted cyclohexene. This regiochemical control is one reason Diels-Alder is so prized in synthesis."}
]},

m10:{title:"Aromaticity",lead:"Hückel's rule and the magic of 4n+2 π electrons. Why benzene is special and what makes a molecule 'aromatic.'",
body:`<h3>What is aromaticity?</h3><p>Aromaticity is a special kind of stability that some cyclic, conjugated molecules enjoy. Benzene is the classic example — it's about 36 kcal/mol more stable than you'd predict for 'cyclohexatriene.' Aromatic compounds resist reactions that would break their conjugation, which is why benzene undergoes substitution (replacing an H, keeping the ring intact) instead of addition (which would break the aromatic system).</p>
<h3>1. The four requirements for aromaticity</h3><div class="concept"><b>A molecule is aromatic if and only if ALL FOUR are true:</b><ol><li><b>Cyclic</b> — the conjugated system forms a closed ring.</li><li><b>Planar</b> — all ring atoms lie in one plane (allows continuous overlap).</li><li><b>Fully conjugated</b> — every atom in the ring has a p-orbital (sp² or sp hybridized), so p-orbitals overlap continuously around the ring.</li><li><b>4n+2 π electrons</b> in the ring (Hückel's rule). For n = 0, 1, 2, 3... that's 2, 6, 10, 14, 18 π electrons.</li></ol>If even ONE requirement fails, the molecule is NOT aromatic.</div>
<h3>2. Hückel's 4n+2 rule — how to count</h3><p>Count only the π electrons that are part of the cyclic conjugated system:</p><ul><li>Each C=C in the ring contributes 2 π electrons.</li><li>A lone pair on a heteroatom (N, O, S) in the ring counts ONLY IF that lone pair sits in a p-orbital perpendicular to the ring (i.e., it's part of the π system).</li><li>An empty p-orbital contributes 0 electrons but still completes the conjugation.</li><li>A C=O outside the ring doesn't count toward ring electrons.</li></ul>
<div class="example"><b>Benzene:</b> 3 C=C in the ring → 6 π electrons. 6 = 4(1)+2 → aromatic. ✓<br><br><b>Pyridine:</b> 6-membered ring with 1 N replacing CH. The N lone pair is in an sp² orbital IN the plane of the ring (not perpendicular), so it does NOT contribute to the π system. Three C=C and one C=N give 6 π electrons → aromatic. ✓<br><br><b>Pyrrole:</b> 5-membered ring with N–H. The N lone pair must go in the perpendicular p-orbital (the sp² orbitals are used by N–H, N–C, N–C). That lone pair (2 e⁻) plus two C=C (4 e⁻) = 6 π electrons → aromatic. ✓<br><br><b>Cyclopentadienyl anion:</b> 5-membered ring with one CH⁻. The CH⁻ carbon is sp² with a lone pair in its p-orbital. 2 C=C (4 e⁻) + 2 from the lone pair = 6 e⁻ → aromatic. ✓<br><br><b>Cyclopentadienyl cation:</b> Same ring but the C is now positive (empty p-orbital). 2 C=C (4 e⁻) + 0 from the empty p-orbital = 4 e⁻ → 4n with n=1 → ANTI-aromatic (4n electrons in a continuous cyclic π system is destabilizing).</div>
<h3>3. Three categories</h3><div class="concept"><b>Aromatic:</b> cyclic, planar, fully conjugated, 4n+2 π electrons. Extra stable.<br><b>Anti-aromatic:</b> cyclic, planar, fully conjugated, 4n π electrons. Extra UNSTABLE — molecules avoid this by puckering out of planarity if they can.<br><b>Non-aromatic:</b> fails one of the structural requirements (not cyclic, not planar, or has sp³ carbon breaking conjugation). Just an ordinary molecule, neither stabilized nor destabilized.</div>
<div class="example"><b>Cyclooctatetraene (COT):</b> 8-membered ring, 4 C=C, 8 π electrons. If planar: 8 = 4n with n=2 → would be anti-aromatic (very unstable). Solution: the molecule puckers into a tub shape, breaking planarity. Now it's non-aromatic and behaves like a normal alkene system. Nature finds a way to escape anti-aromaticity.</div>
<h3>4. Why aromatic compounds are stable</h3><p>The 6 π electrons of benzene fill three bonding molecular orbitals completely (the three lowest-energy π MOs). All electrons are paired in stable, low-energy orbitals. With 4n electrons, you'd be forced to put 2 unpaired electrons in non-bonding orbitals — much less stable. The 4n+2 rule comes from the math of how the molecular orbitals fill in cyclic π systems.</p>
<h3>5. Heterocyclic aromatics — common ones to memorize</h3><table><tr><th>Compound</th><th>Ring</th><th>π electrons</th></tr>
<tr><td>Benzene</td><td>6-C ring</td><td>6</td></tr>
<tr><td>Pyridine</td><td>5C + 1N (6-ring)</td><td>6 (N lone pair NOT in π)</td></tr>
<tr><td>Pyrrole</td><td>4C + 1N (5-ring)</td><td>6 (N lone pair IN π)</td></tr>
<tr><td>Furan</td><td>4C + 1O (5-ring)</td><td>6 (one O lone pair IN π)</td></tr>
<tr><td>Thiophene</td><td>4C + 1S (5-ring)</td><td>6 (one S lone pair IN π)</td></tr>
<tr><td>Imidazole</td><td>3C + 2N (5-ring)</td><td>6</td></tr></table>`,
quiz:[
{q:"How many π electrons does benzene have, and is it aromatic?",opts:["4 electrons, anti-aromatic","6 electrons, aromatic","6 electrons, non-aromatic","8 electrons, aromatic"],correct:1,explain:"Step 1: Count C=C in the ring. Benzene has 3 C=C bonds. Step 2: Each double bond contributes 2 π electrons → 3 × 2 = 6 π electrons. Step 3: Check Hückel: 6 = 4(1)+2 with n=1 → satisfies 4n+2. Step 4: It's cyclic, planar, fully conjugated, with 4n+2 → AROMATIC. The textbook example."},
{q:"In pyrrole (5-membered ring with N-H), the nitrogen lone pair:",opts:["is in an sp² orbital and not part of the π system","is in a p-orbital and part of the π system, contributing 2 electrons","is in an s orbital","doesn't exist"],correct:1,explain:"Step 1: Count what each N orbital is doing in pyrrole. The N is sp² hybridized: three sp² orbitals point to the two ring carbons and one to the H. Step 2: That uses 3 of N's 5 valence electrons (one in each bond). Step 3: The remaining 2 electrons (the lone pair) MUST go in the leftover p-orbital, perpendicular to the ring plane. Step 4: That p-orbital lines up with the C p-orbitals → the lone pair becomes part of the π system, contributing 2 electrons. With 2 C=C (4 e⁻) + 2 from N = 6 π electrons → aromatic."},
{q:"In pyridine (6-membered ring with one N replacing CH), the nitrogen lone pair:",opts:["is in a perpendicular p-orbital, part of the π system","is in an sp² orbital in the plane of the ring, NOT part of the π system","makes the molecule anti-aromatic","is on a different atom"],correct:1,explain:"Step 1: Pyridine's N is sp² and uses 2 sp² orbitals to bond to the two adjacent ring carbons, and 1 p-orbital (perpendicular) to participate in the π system via a C=N double bond (contributes 1 electron, like any sp² carbon's p-orbital). Step 2: That leaves N's lone pair in the THIRD sp² orbital — pointing OUTWARD from the ring, in the plane of the molecule. Step 3: That in-plane lone pair is NOT part of the π system. Pyridine's π electrons come from 3 ring double bonds (counting C=N) = 6 → still aromatic. The lone pair makes pyridine basic (it can grab a proton like an amine)."},
{q:"Cyclopentadienyl ANION (C₅H₅⁻) is:",opts:["aromatic","anti-aromatic","non-aromatic","cyclic but not planar"],correct:0,explain:"Step 1: Structure check — 5-membered ring, all 5 carbons sp², all in one plane, all with p-orbitals → cyclic, planar, conjugated. ✓ Step 2: Count π electrons. Two C=C double bonds = 4 e⁻. The 5th carbon carries a lone pair (the negative charge) in its p-orbital = 2 more e⁻. Total = 6 π electrons. Step 3: 6 = 4(1)+2 → satisfies Hückel. AROMATIC. Cyclopentadiene itself is unusually acidic (pKa ≈16) precisely because losing a proton gives this aromatic anion."},
{q:"Cyclooctatetraene (COT, 8-membered ring with 4 alternating C=C) is:",opts:["aromatic with 8 π electrons","anti-aromatic and unstable","non-aromatic because it puckers out of planarity to escape anti-aromaticity","planar and stable"],correct:2,explain:"Step 1: Count electrons assuming planarity: 4 C=C × 2 = 8 π electrons. Step 2: 8 = 4(2) with n=2 → matches the anti-aromatic count (4n). If the molecule were planar, it would be anti-aromatic and very unstable. Step 3: Nature's escape: COT puckers into a non-planar tub shape. Now the p-orbitals can't all overlap at once → it's no longer fully conjugated → not aromatic OR anti-aromatic, just an ordinary cyclic polyene (non-aromatic). Behaves chemically like four isolated alkenes."},
{q:"Which of these is NOT a requirement for aromaticity?",opts:["cyclic","planar","contains nitrogen","4n+2 π electrons"],correct:2,explain:"Step 1: The four requirements are: cyclic, planar, fully conjugated (every atom has a p-orbital), and 4n+2 π electrons. Step 2: Heteroatoms like N, O, S can be PART of an aromatic ring (pyridine, pyrrole, furan), but they're not REQUIRED. Step 3: Benzene contains only carbon and is the most famous aromatic compound. The element is irrelevant — what matters is the geometry and electron count."},
{q:"For Hückel's rule, which value of n gives 10 π electrons?",opts:["n = 0","n = 1","n = 2","n = 3"],correct:2,explain:"Step 1: Hückel's formula is 4n+2. Step 2: Solve for n: 4n+2 = 10 → 4n = 8 → n = 2. Step 3: So molecules with n=2 (10 π electrons) can be aromatic — examples include naphthalene and azulene. n=0 gives 2 electrons (cyclopropenyl cation), n=1 gives 6 (benzene), n=3 gives 14 (anthracene). Each value adds a 'tier' of aromatic ring sizes."},
{q:"Naphthalene (two fused benzene rings) has how many π electrons total, and is it aromatic?",opts:["6, aromatic","8, anti-aromatic","10, aromatic","12, non-aromatic"],correct:2,explain:"Step 1: Count C=C in naphthalene's structure. It has 5 C=C bonds drawn in its standard form. Step 2: 5 × 2 = 10 π electrons. Step 3: Check Hückel: 10 = 4(2)+2 with n=2 → ✓ aromatic. Naphthalene is planar, fully conjugated across both rings, and satisfies 4n+2. Note: for fused polycyclic aromatics, you can also apply 4n+2 to each individual ring, but the whole-molecule count works for naphthalene."},
{q:"What's the difference between 'anti-aromatic' and 'non-aromatic'?",opts:["they're synonyms","anti-aromatic is destabilized by 4n electrons in a planar conjugated ring; non-aromatic just means the molecule doesn't satisfy aromaticity requirements (and isn't destabilized either)","anti-aromatic compounds don't exist","non-aromatic molecules can't have rings"],correct:1,explain:"Step 1: Anti-aromatic = cyclic, planar, fully conjugated, but 4n electrons (not 4n+2). These molecules are LESS stable than the open-chain version — actively destabilized by the cyclic 4n π system. Step 2: Non-aromatic = fails one of the structural requirements (e.g., not planar, has an sp³ carbon breaking conjugation, or not cyclic). Just an ordinary molecule — no special stability or instability. Step 3: Importantly, most molecules that COULD be anti-aromatic actually escape the destabilization by puckering out of planarity (becoming non-aromatic instead). So 'anti-aromatic' is rare in practice; most non-Hückel-compliant rings end up just non-aromatic."},
{q:"Furan (5-ring with O) is aromatic. How many of oxygen's lone pairs are in the π system?",opts:["zero","one","two","all of them"],correct:1,explain:"Step 1: Oxygen in furan is sp² hybridized — it bonds to two ring carbons via sp² orbitals. Step 2: O has 6 valence electrons. 2 are used in the two σ bonds to ring C's. The remaining 4 are in two lone pairs. Step 3: One lone pair sits in the third sp² orbital (in the plane of the ring) — NOT in the π system. The other lone pair sits in the perpendicular p-orbital — this one IS part of the π system, contributing 2 electrons. Step 4: Total π electrons in furan: 2 C=C (4 e⁻) + 1 lone pair from O (2 e⁻) = 6 → aromatic. The other O lone pair just sits there as an in-plane lone pair, similar to N in pyridine."}
]},

m11:{title:"Electrophilic Aromatic Substitution",lead:"How to install groups onto a benzene ring — and how the existing groups dictate where the next one goes.",
body:`<h3>Why benzene does substitution, not addition</h3><p>Alkenes do addition. Benzene does substitution. Why the difference? Because addition would destroy benzene's aromaticity (worth ~36 kcal/mol of stability), while substitution lets the ring keep its 6 π electrons. Benzene reluctantly forms a non-aromatic intermediate (a sigma complex), then loses an H⁺ to restore aromaticity. The net result: an H is replaced by a new group.</p>
<h3>1. The general EAS mechanism (every reaction follows this)</h3><div class="concept"><b>Step 1:</b> An electrophile (E⁺) is generated, often with a Lewis acid catalyst.<br><b>Step 2:</b> The benzene π electrons attack E⁺, forming a non-aromatic <b>arenium ion</b> (sigma complex) with the new C–E bond and a positive charge delocalized over 3 ring carbons.<br><b>Step 3:</b> A base removes the H from the carbon now bearing E, restoring aromaticity. Net result: H replaced by E.</div>
<h3>2. The five core EAS reactions</h3><table><tr><th>Reaction</th><th>Reagents</th><th>Group added</th></tr>
<tr><td>Halogenation</td><td>Cl₂/FeCl₃ or Br₂/FeBr₃</td><td>–Cl, –Br</td></tr>
<tr><td>Nitration</td><td>HNO₃ + H₂SO₄</td><td>–NO₂</td></tr>
<tr><td>Sulfonation</td><td>SO₃ in H₂SO₄ (or fuming H₂SO₄)</td><td>–SO₃H</td></tr>
<tr><td>Friedel-Crafts alkylation</td><td>R–Cl + AlCl₃</td><td>–R (rearranges!)</td></tr>
<tr><td>Friedel-Crafts acylation</td><td>R–COCl + AlCl₃</td><td>–COR (no rearrangement)</td></tr></table>
<div class="tip">⭐ <b>Acylation > alkylation, almost always.</b> F-C alkylation has three big problems: (1) the carbocation rearranges (1° → 2° → 3°), (2) the product is more reactive than the starting material so you get over-alkylation, and (3) it doesn't work on rings with strong deactivators. Acylation avoids all three.</div>
<h3>3. Activators and deactivators</h3><div class="concept">Existing groups on the ring change how fast (and where) the next EAS happens.<br><b>Activators</b> donate electrons to the ring → ring is more electron-rich → faster EAS than benzene.<br><b>Deactivators</b> withdraw electrons from the ring → slower EAS than benzene.</div>
<table><tr><th>Group</th><th>Effect</th><th>Directs to</th></tr>
<tr><td>–NH₂, –NHR, –NR₂</td><td>strong activator</td><td>ortho/para</td></tr>
<tr><td>–OH, –OR</td><td>strong activator</td><td>ortho/para</td></tr>
<tr><td>–NHCOR (amide)</td><td>moderate activator</td><td>ortho/para</td></tr>
<tr><td>alkyl, –Ph</td><td>weak activator</td><td>ortho/para</td></tr>
<tr><td>–F, –Cl, –Br, –I</td><td><b>deactivator BUT o,p-director</b></td><td>ortho/para</td></tr>
<tr><td>–CHO, –COR, –CO₂R, –CO₂H, –CONR₂</td><td>moderate deactivator</td><td>meta</td></tr>
<tr><td>–SO₃H, –CN, –NO₂, –NR₃⁺</td><td>strong deactivator</td><td>meta</td></tr></table>
<div class="tip">⭐ <b>Memorize one weird rule:</b> Halogens are the only group that DEACTIVATE the ring but still direct ORTHO/PARA. Reason: their electronegativity withdraws electrons inductively (deactivation), but their lone pairs donate by resonance specifically to ortho/para positions (directing).</div>
<h3>4. Why directing effects work — resonance logic</h3><p>To predict where a new group goes, draw the arenium ion intermediate for each possible attack position (ortho, meta, para) and see which one is most stabilized by the existing group. The group that wins gives the lowest-energy intermediate → fastest pathway → major product.</p>
<div class="example"><b>Ortho/para directors:</b> An EDG like –OCH₃ donates electrons through resonance. When the new electrophile attacks ortho or para, the positive charge in the intermediate ends up on a carbon adjacent to the OCH₃, which can donate a lone pair to neutralize it. Meta attack gives an intermediate where the positive charge cannot reach the OCH₃ at all. So ortho/para intermediates are stabilized → ortho/para products dominate.<br><br><b>Meta directors:</b> An EWG like –NO₂ pulls electrons. Ortho/para attack would put positive charge ADJACENT to the already-positive nitro group — destabilized. Meta attack avoids this. So meta wins by elimination of the worse alternatives.</div>
<h3>5. Synthesis strategy: order matters!</h3><p>When building disubstituted benzenes, the order of installation determines what's possible. If you want para-bromonitrobenzene, install bromine FIRST (an o,p-director), then nitrate (Br directs to para). If you nitrated first, NO₂ would direct meta and you couldn't get the para isomer.</p>
<div class="example"><b>Worked example — make m-bromonitrobenzene from benzene:</b><br>Step 1: Nitrate first (HNO₃/H₂SO₄) → nitrobenzene. The –NO₂ is a meta director.<br>Step 2: Brominate (Br₂/FeBr₃). The new Br goes meta to the existing NO₂.<br>Result: m-bromonitrobenzene. ✓ If you'd brominated first, you'd get the o/p isomer instead.</div>
<h3>6. F-C limitations</h3><p>Friedel-Crafts reactions DO NOT work on rings that already have a meta director (or –NH₂ groups, which complex with AlCl₃). The ring is too electron-poor for the carbocation electrophile to attack. You can't directly alkylate or acylate nitrobenzene, for example.</p>`,
quiz:[
{q:"Which is the most reactive in EAS?",opts:["benzene","chlorobenzene","toluene","nitrobenzene"],correct:2,explain:"Step 1: Rank the substituents. Toluene has –CH₃ (weak activator). Chlorobenzene has –Cl (deactivator, even though it's o,p-directing). Nitrobenzene has –NO₂ (strong deactivator). Step 2: Activators speed up EAS; deactivators slow it down. Step 3: Toluene > benzene > chlorobenzene > nitrobenzene in reactivity. Toluene wins."},
{q:"Nitrobenzene undergoes a second nitration mainly at the:",opts:["ortho position","meta position","para position","ipso position"],correct:1,explain:"Step 1: Identify the existing group: –NO₂ is a strong electron-withdrawer (meta director). Step 2: Why? Draw the arenium ion intermediates for each attack site. Ortho and para attack place positive charge directly adjacent to the already-positive N of the nitro group → very unstable. Meta attack avoids this clash. Step 3: So the second NO₂ goes meta. The product is 1,3-dinitrobenzene."},
{q:"To make n-propylbenzene cleanly from benzene, you should:",opts:["use 1-chloropropane + AlCl₃ in one step","use propanoyl chloride + AlCl₃, then reduce the C=O","use propene + HCl","use propanol + H₂SO₄"],correct:1,explain:"Step 1: F-C alkylation with 1-chloropropane fails — the 1° propyl cation rearranges via hydride shift to a more stable 2° isopropyl cation, giving isopropylbenzene (cumene), not n-propylbenzene. Step 2: F-C acylation uses an acylium ion (R–C≡O⁺), which is resonance-stabilized and does NOT rearrange. So propanoyl chloride + AlCl₃ cleanly gives propiophenone (Ph-CO-CH₂CH₃). Step 3: Reduce the C=O with Zn(Hg)/HCl (Clemmensen) or H₂NNH₂/KOH (Wolff-Kishner) → straight-chain n-propylbenzene. This two-step route is the standard workaround for the rearrangement problem."},
{q:"Which group is a deactivator BUT an ortho/para director?",opts:["–OH","–CH₃","–Cl","–NO₂"],correct:2,explain:"Step 1: This is the famous halogen exception. Halogens are electronegative — they pull electron density out of the ring through induction (deactivation). Step 2: But halogens also have lone pairs that can donate by resonance specifically to the ortho and para positions of the arenium ion intermediate. Step 3: The two effects compete: induction wins for overall ring reactivity (deactivator), but resonance wins for site selection (o,p-director). All halogens (F, Cl, Br, I) behave this way."},
{q:"You want to make para-bromotoluene from benzene. The correct order is:",opts:["brominate first, then alkylate","alkylate first, then brominate","both can be done in either order","use only one step"],correct:1,explain:"Step 1: Both groups (–CH₃ and –Br) are ortho/para directors, so once one is installed, the second goes ortho or para (mostly para due to sterics). Step 2: But there's a deeper issue: F-C alkylation requires a moderately reactive ring. Bromobenzene works but is sluggish (Br is a deactivator). Toluene is more reactive than benzene, so brominating toluene is fast and clean. Step 3: Best route: methylate first (CH₃Cl/AlCl₃ → toluene), then brominate (Br₂/FeBr₃ → para-bromotoluene). The reverse order works in principle but is much slower."},
{q:"Why can't you do Friedel-Crafts acylation on nitrobenzene?",opts:["nitrobenzene is too volatile","the nitro group is too electron-withdrawing — the ring is too electron-poor for the acylium ion to react with","the AlCl₃ destroys the nitro group","nitrobenzene is aromatic"],correct:1,explain:"Step 1: F-C reactions require the ring to be a good nucleophile (decent π electron density). Step 2: Nitro is one of the strongest deactivators known — it removes so much electron density that the ring becomes a poor nucleophile, unable to attack even a strong electrophile like an acylium ion. Step 3: General rule: F-C reactions DO NOT work on rings bearing strong deactivators (–NO₂, –CN, –SO₃H, –CF₃, etc.) or on aniline derivatives (the lone pair on N coordinates with AlCl₃)."},
{q:"In the EAS mechanism, the slow (rate-determining) step is:",opts:["loss of H⁺ from the arenium ion","attack of the ring on E⁺ to form the arenium ion","generation of E⁺","tautomerization"],correct:1,explain:"Step 1: Forming the arenium ion costs aromaticity (~36 kcal/mol of stabilization). It's the highest-energy step in the reaction coordinate. Step 2: Loss of H⁺ from the arenium ion is fast — it RESTORES aromaticity, which is energetically favorable. Step 3: So attack of the ring on E⁺ is the slow, rate-determining step. The transition state for THIS step resembles the arenium ion, which is why directing effects (which stabilize the arenium ion) speed up the reaction."},
{q:"What product forms when toluene reacts with HNO₃/H₂SO₄?",opts:["mainly meta-nitrotoluene","mainly ortho and para nitrotoluene (mixture)","only para-nitrotoluene","no reaction"],correct:1,explain:"Step 1: Toluene's methyl group is a weak activator AND ortho/para director. Step 2: Both ortho and para are reactive. The actual ratio is ~60% para and ~35% ortho (with ~5% meta and dinitration as minor products). Step 3: Para usually wins slightly because ortho is sterically blocked by the nearby methyl. But ortho is still significant. The 'mainly o + p mixture' answer captures this. To get pure para, you typically separate by chromatography or distillation."},
{q:"In F-C alkylation, why does 1-chloropropane give isopropylbenzene instead of n-propylbenzene?",opts:["the chloride leaves the wrong way","the 1° carbocation rearranges via hydride shift to a more stable 2° cation","propane is a gas","AlCl₃ is too strong"],correct:1,explain:"Step 1: 1-Chloropropane + AlCl₃ generates a primary carbocation: CH₃CH₂CH₂⁺. Step 2: 1° cations are very unstable and live for billionths of a second — long enough for a HYDRIDE SHIFT to occur. The H on C2 migrates with its electrons to C1, generating the 2° cation: CH₃CH⁺CH₃ (isopropyl cation). Step 3: The benzene ring then attacks the rearranged isopropyl cation, giving isopropylbenzene (cumene). This is exactly why F-C acylation is preferred — acylium ions don't rearrange."},
{q:"You install –Br on benzene first, then nitrate. Where does the new –NO₂ go?",opts:["mainly meta to Br","mainly ortho and para to Br","only ipso to Br","both substituents form on the same carbon"],correct:1,explain:"Step 1: After bromination, the ring is bromobenzene. Step 2: Bromine is the famous exception — it's a deactivator BUT an ortho/para director. So even though the second EAS will be slower than on benzene, the new electrophile still adds at the o/p positions. Step 3: NO₂⁺ adds mostly para (least sterically blocked) and somewhat ortho. So the product is mainly p-bromonitrobenzene with some o-bromonitrobenzene. To get m-bromonitrobenzene instead, you'd have to nitrate FIRST (NO₂ is a meta director), then brominate."}
]},

m12:{title:"Spectroscopy: IR, MS, NMR",lead:"Three tools for figuring out unknown structures: IR tells you what functional groups are present, MS gives you molecular weight and clues about fragments, and NMR maps the carbon-hydrogen skeleton.",
body:`<h3>The structure detective\'s toolkit</h3><p>When chemists isolate an unknown compound, they don\'t guess — they use spectroscopy to read the molecule directly. Each technique gives a different kind of information, and together they pin down the structure unambiguously. For exams and the MCAT, you need to be fluent in IR (functional groups), MS (molecular weight, fragments), and ¹H NMR (atom counting, environment, coupling).</p>
<h3>1. IR spectroscopy — \"what functional groups are here?\"</h3><p>Infrared light makes covalent bonds vibrate (stretch and bend). Each kind of bond absorbs at a characteristic frequency, measured in wavenumbers (cm⁻¹). The IR spectrum has peaks where the molecule absorbs — and the LOCATIONS of those peaks reveal which functional groups are present.</p>
<table><tr><th>Wavenumber (cm⁻¹)</th><th>Bond / functional group</th><th>Look like</th></tr>
<tr><td>3200–3650 broad</td><td>O–H (alcohol)</td><td>broad rounded peak</td></tr>
<tr><td>2500–3300 very broad</td><td>O–H (carboxylic acid)</td><td>extremely broad, lower than alcohol</td></tr>
<tr><td>3300–3500 medium</td><td>N–H (amine, amide)</td><td>1 or 2 sharp peaks</td></tr>
<tr><td>~3300 sharp strong</td><td>≡C–H (terminal alkyne)</td><td>thin sharp spike</td></tr>
<tr><td>3000–3100</td><td>=C–H (alkene, aromatic)</td><td>just above 3000</td></tr>
<tr><td>2850–2960</td><td>C–H (alkyl)</td><td>just below 3000</td></tr>
<tr><td>~2200 weak</td><td>C≡C</td><td>small peak</td></tr>
<tr><td>~2250 medium</td><td>C≡N (nitrile)</td><td>sharp medium</td></tr>
<tr><td>1670–1780 strong</td><td>C=O (carbonyl)</td><td>very strong, unmistakable</td></tr>
<tr><td>1600 + 1500</td><td>aromatic C=C</td><td>two medium peaks</td></tr>
<tr><td>1540</td><td>NO₂</td><td>strong</td></tr></table>
<div class="tip">⭐ <b>Quick IR scan strategy:</b> Look for these in order: (1) Anything in 3200–3650? Could be O–H or N–H. (2) Anything strong near 1700? That\'s C=O — and which type depends on what else is nearby. (3) Aromatic? Check 1600/1500 and 3030. (4) Triple bond? Look near 2200.</div>
<div class="example"><b>Worked example:</b> An unknown shows a strong broad peak at 2500–3100, plus a very strong sharp peak at 1710 cm⁻¹. Diagnosis: the very broad O–H signature is unique to a carboxylic acid (alcohols are higher and narrower). The 1710 confirms a C=O. → carboxylic acid. ✓</div>
<h3>2. Mass spectrometry — \"what does it weigh, and what falls off?\"</h3><p>A mass spectrometer ionizes the molecule (knocking off an electron) and then breaks it apart, measuring the masses of all the resulting fragments. Two key data points:</p><ul><li><b>Molecular ion (M⁺):</b> the unbroken ionized molecule. Its m/z value = molecular weight in amu.</li><li><b>Fragment peaks:</b> smaller pieces from cleavage. The differences (M − fragment) tell you what was lost.</li></ul>
<div class="concept"><b>Common losses to memorize:</b><br>−15: loss of CH₃<br>−17: loss of OH<br>−18: loss of H₂O<br>−29: loss of CHO or C₂H₅<br>−43: loss of C₃H₇ or CH₃CO (acetyl)<br>−45: loss of CO₂H or C₂H₅O</div>
<div class="example"><b>Worked example:</b> Unknown has M⁺ = 102 and a strong fragment at m/z = 73 (loss of 29). What is it likely? Loss of 29 = loss of CHO (aldehyde) or C₂H₅ (ethyl). M = 102 fits C₆H₁₂O (102 g/mol = 6×12 + 12 + 16). One reasonable candidate: hexan-3-ol — α-cleavage gives a stable cation by losing the ethyl group, fitting the loss of 29.</div>
<h3>3. ¹H NMR — \"how many H environments and what are they near?\"</h3><p>Hydrogen NMR (proton NMR) is the most powerful structural tool you\'ll learn. Each unique H environment gives a signal. From a ¹H NMR spectrum you read four things:</p><div class="concept"><b>(1) Number of signals</b> = number of chemically distinct H environments. Equivalent H\'s (related by symmetry or by free rotation, like the 3 H\'s of a CH₃) give one signal.<br><br><b>(2) Chemical shift (δ, in ppm)</b> tells you the chemical neighborhood of each H. Electron-withdrawing neighbors push the signal downfield (higher ppm); electron-rich environments push it upfield (lower ppm).<br><br><b>(3) Integration</b> tells you the RELATIVE number of H\'s producing each signal. A 3:2:1 integration ratio could mean 3 H\'s : 2 H\'s : 1 H, or 6:4:2, etc.<br><br><b>(4) Splitting (multiplicity)</b> tells you how many H neighbors are on the ADJACENT carbon. The famous (n+1) rule: a peak split by n equivalent neighbors gives n+1 lines.</div>
<table><tr><th>δ (ppm)</th><th>Type of H</th></tr><tr><td>0.7–1.5</td><td>alkyl C–H (CH₃, CH₂, CH)</td></tr><tr><td>1.5–2.5</td><td>allylic, α to C=O</td></tr><tr><td>2.0–4.0</td><td>C–H next to electronegative atom</td></tr><tr><td>3.3–4.0</td><td>C–H next to O (alcohol, ether)</td></tr><tr><td>4.5–6.5</td><td>vinyl (=C–H)</td></tr><tr><td>6.5–8.0</td><td>aromatic</td></tr><tr><td>9–10</td><td>aldehyde C–H</td></tr><tr><td>10–13</td><td>carboxylic acid O–H</td></tr><tr><td>0.5–5.0 variable</td><td>alcohol/amine O–H, N–H (often broad)</td></tr></table>
<div class="example"><b>The classic ethyl group pattern:</b> An ethyl group (–CH₂CH₃) attached to anything else gives two signals in NMR. The CH₃ (3H) sees 2 neighbors on the adjacent CH₂ → splits into 3 lines (n+1 = 3) → triplet. The CH₂ (2H) sees 3 neighbors on the adjacent CH₃ → splits into 4 lines → quartet. So an ethyl always shows up as triplet (3H) + quartet (2H). Once you see that pattern, you know an ethyl is there.</div>
<h3>4. Putting it all together</h3><p>Real structure problems give you molecular formula + IR + MS + NMR all at once. The strategy: (1) Use the molecular formula to calculate degree of unsaturation. (2) Use IR to identify functional groups. (3) Use NMR signal count and integration to deduce H environments. (4) Use NMR splitting to figure out which carbons are adjacent. (5) Assemble the puzzle.</p>`,
quiz:[
{q:"A strong, very broad IR absorption from 2500–3100 cm⁻¹ indicates:",opts:["alcohol","alkene","carboxylic acid","amine"],correct:2,explain:"Step 1: Recognize the diagnostic shape. Alcohols give a broad O–H but it sits higher (3200–3650) and is moderately broad. Step 2: Carboxylic acid O–H is at LOWER frequency (around 2500–3100) AND extends much wider — it overlaps with the C–H region. This 'rolling hill' shape from ~3100 down to 2500 is unmistakable. Step 3: The reason it's so broad: COOH groups are strongly hydrogen-bonded into dimers, which spreads the O–H stretch over a huge range."},
{q:"In ¹H NMR, an isolated –OCH₃ group (methyl ether or methyl ester) appears as:",opts:["a triplet around 1.0 ppm","a singlet around 3.3–3.8 ppm","a quartet around 4 ppm","a doublet around 2 ppm"],correct:1,explain:"Step 1: Chemical shift. The methyl is attached to oxygen — electronegative — pulling the H signals downfield (higher ppm) to around 3.3–3.8. Step 2: Splitting. The OCH₃ has no adjacent H neighbors (the O has no H, or its H is too far for coupling). With zero neighbors, n+1 = 1 → singlet. Step 3: Integration is 3H. The combination 'singlet at 3.3–3.8, 3H' is the OCH₃ fingerprint."},
{q:"An ¹H NMR shows a triplet (3H, ~1.2 ppm) and a quartet (2H, ~3.5 ppm). What group is present?",opts:["methyl on a benzene ring","ethyl group attached to oxygen (–OCH₂CH₃)","isopropyl group","two unrelated methyls"],correct:1,explain:"Step 1: Recognize the triplet (3H) + quartet (2H) pattern. That's the ethyl group fingerprint. Step 2: Now use chemical shift to determine what the ethyl is attached to. The CH₂ at 3.5 ppm is downfield — adjacent to an electronegative atom, most likely oxygen. The CH₃ at 1.2 is normal alkyl range. Step 3: Conclusion: ethyl group attached to O — i.e., –OCH₂CH₃ (an ether or ester ethoxy group). This is one of the most common patterns in NMR problems."},
{q:"A compound shows a strong sharp IR peak at 1715 cm⁻¹ but NO broad O–H. What functional group is most likely present?",opts:["carboxylic acid","alcohol","ketone or aldehyde","amine"],correct:2,explain:"Step 1: 1715 is right in the C=O carbonyl region. Step 2: With NO O–H broad peak, we can rule out carboxylic acid (which would show both 1715-ish AND a broad 2500–3100). Step 3: A C=O without an O–H means ketone, aldehyde, or ester. Aldehyde would also show two characteristic C–H absorptions near 2720 and 2820 — if those are missing, ketone is most likely. Esters tend to show C=O slightly higher (~1735–1750)."},
{q:"How many ¹H NMR signals would you expect from para-dichlorobenzene?",opts:["1","2","3","4"],correct:0,explain:"Step 1: Draw para-dichlorobenzene. The two Cl groups are on opposite ends of the ring. Step 2: All four ring H's are in equivalent environments due to the molecule's symmetry — each H is ortho to one Cl and meta to the other. They are chemically equivalent. Step 3: Equivalent H's give a single NMR signal. So para-dichlorobenzene shows just 1 signal in the aromatic region (~7.3 ppm). The high symmetry makes it a classic example of a 'simple' aromatic NMR."},
{q:"A molecular ion at m/z = 60 with strong loss to m/z = 45 (loss of 15) suggests:",opts:["loss of OH","loss of CH₃","loss of H₂O","loss of CHO"],correct:1,explain:"Step 1: Calculate the loss: 60 − 45 = 15. Step 2: Match to the standard losses. Loss of 15 = loss of CH₃ (a methyl group breaking off). Loss of 17 would be OH; loss of 18 would be H₂O; loss of 29 would be CHO. Step 3: A compound with M = 60 that easily loses CH₃ could be acetic acid (CH₃COOH, MW 60) — losing CH₃ would give the COOH⁺ fragment at 45. Or propan-1-ol or propan-2-ol losing methyl. Several options, but the LOSS itself is unambiguously CH₃."},
{q:"In the n+1 rule, a CH proton with 6 equivalent neighbors (e.g., the central H of isopropyl, CH(CH₃)₂) shows up as:",opts:["a singlet","a doublet","a quartet","a septet (7 lines)"],correct:3,explain:"Step 1: Identify the neighbors. The central H is adjacent to two CH₃ groups, both equivalent — that's 6 neighboring H's. Step 2: Apply n+1: with 6 neighbors, the multiplicity is 6+1 = 7 lines. A 7-line signal is called a septet. Step 3: The classic isopropyl pattern: a doublet (6H, the two methyls split by the single CH neighbor) plus a septet (1H, the CH split by the 6 methyl neighbors). When you see a septet in NMR, isopropyl is a strong suspect."},
{q:"Benzaldehyde (PhCHO) shows what characteristic ¹H NMR signal that\'s diagnostic for an aldehyde?",opts:["a singlet around 0.9 ppm","a singlet around 9.8 ppm","a triplet around 4.0 ppm","a multiplet around 7 ppm"],correct:1,explain:"Step 1: The aldehyde C–H is in a unique chemical environment — attached to a sp² carbon that's also bonded to an oxygen. Step 2: This combination pulls the H very far downfield to around 9–10 ppm. No other common functional group H sits in this region. Step 3: A singlet near 9–10 ppm is the universal fingerprint of an aldehyde C–H. (Carboxylic acid OH is even further downfield, 11–13 ppm.) Benzaldehyde also shows the aromatic H's at 7.4–7.9 ppm."},
{q:"You see an IR with a sharp medium peak around 2250 cm⁻¹ and no other diagnostic peaks. What functional group is most consistent?",opts:["alcohol","carboxylic acid","alkene","nitrile (C≡N)"],correct:3,explain:"Step 1: 2250 cm⁻¹ is in the triple bond region. Step 2: Two candidates: C≡C (alkyne) or C≡N (nitrile). They appear in the same general area but C≡N is at slightly higher wavenumber and tends to be more intense. Step 3: A medium-intensity sharp peak around 2250 is the nitrile signature. C≡C is usually weaker (often nearly invisible for symmetric internal alkynes) and a bit lower (~2200). So the answer is nitrile."},
{q:"Acetone (C₃H₆O) shows a single peak in its ¹H NMR spectrum at about 2.1 ppm. Why only one peak?",opts:["acetone has no hydrogens","all 6 hydrogens are in identical chemical environments due to symmetry","the C=O blocks NMR detection","acetone is too volatile"],correct:1,explain:"Step 1: Draw acetone — CH₃-CO-CH₃. The two methyl groups are attached to the same carbonyl carbon, making them mirror images of each other. Step 2: Equivalent H's give a single NMR signal. All 6 H's in acetone (3 from each methyl) are chemically identical by symmetry → 1 signal. Step 3: Chemical shift of ~2.1 ppm fits H's α to a carbonyl. Step 4: No splitting because there are no neighboring H's on adjacent carbons (the carbonyl carbon has no H). Result: a clean singlet at 2.1 ppm integrating to 6H. This is the textbook example of how molecular symmetry simplifies NMR spectra."}
]},

st1:{title:"Self-Test 1: Foundations (Modules 1-4)",lead:"20 questions covering bonding, functional groups, nomenclature, and stereochemistry. Each answer walks through the full reasoning.",
body:`<p>This self-test draws on the first four modules. Aim for 80% or higher before moving on. Take your time — read every explanation, even on questions you got right.</p>`,
quiz:[
{q:"What is the hybridization of the central carbon in formaldehyde (H₂C=O)?",opts:["sp³","sp²","sp","sp³d"],correct:1,explain:"Step 1: Count electron groups on the central C. It has 2 single bonds (to two H's) and 1 double bond (to O) = 3 groups (a double bond counts as ONE group). Step 2: 3 groups → sp² → trigonal planar geometry, ~120° angles. Step 3: The C uses three sp² orbitals for the σ bonds (two C–H, one C–O), and its leftover unhybridized p orbital forms the π bond with O."},
{q:"Calculate the degree of unsaturation for C₈H₁₀.",opts:["2","3","4","5"],correct:2,explain:"Step 1: Apply the formula DoU = (2C+2−H)/2 with no N or X. Step 2: (2(8)+2−10)/2 = (16+2−10)/2 = 8/2 = 4. Step 3: 4 degrees of unsaturation could be: a benzene ring (1 ring + 3 π = 4), or other combinations of rings and double bonds. C₈H₁₀ matches xylene (methylated benzene) — 1 ring + 3 double bonds = 4 DoU. ✓"},
{q:"Which molecule has a net dipole moment?",opts:["CO₂","CCl₄","CH₂Cl₂","BF₃"],correct:2,explain:"Step 1: Check each for symmetry. CO₂ is linear (O=C=O) — the two C=O dipoles point in opposite directions and cancel. Step 2: CCl₄ is tetrahedral with 4 identical C–Cl bonds — perfect symmetry, all dipoles cancel. Step 3: BF₃ is trigonal planar with 3 identical B–F bonds — symmetric, dipoles cancel. Step 4: CH₂Cl₂ is tetrahedral but has two H's and two Cl's. The bond dipoles do NOT cancel because the four substituents aren't identical. Net dipole exists. Answer: CH₂Cl₂."},
{q:"Which functional group is in CH₃CH₂CONHCH₃?",opts:["ester","amide","amine","ketone"],correct:1,explain:"Step 1: Look at the central piece: -C(=O)-N(H)-. A carbon with a double-bonded oxygen AND a single bond to nitrogen = amide. Step 2: Don't confuse with similar groups: ester is C(=O)-O- (oxygen instead of nitrogen), amine is just N with no carbonyl, ketone is C(=O) flanked by two carbons (no nitrogen or oxygen on the other side). Step 3: This is N-methylpropanamide — a secondary amide (one H still on N)."},
{q:"How many primary carbons are in 2,2-dimethylbutane?",opts:["3","4","5","6"],correct:1,explain:"Step 1: Draw the structure: (CH₃)₃C-CH₂-CH₃. Step 2: A primary carbon is bonded to exactly 1 other carbon. Identify each: the three CH₃ groups attached to C2 are all primary (each bonded only to C2). The terminal CH₃ (C4) is also primary. Step 3: That's 4 primary carbons total. C2 is quaternary (bonded to 4 carbons). C3 is the CH₂, secondary."},
{q:"What is the IUPAC name of (CH₃)₂CHCH₂CH₂CH₂CH₃?",opts:["isohexane","2-methylhexane","2-methylpentane","3-methylhexane"],correct:1,explain:"Step 1: Find the longest continuous chain. Following from one end through the branched carbon: CH₃-CH(CH₃)-CH₂-CH₂-CH₂-CH₃. The longest chain is 6 carbons → hexane. Step 2: Number from the end closest to the branch — methyl branch is on C2. Step 3: Name = 2-methylhexane. 'Isohexane' is a common name, not IUPAC."},
{q:"Which carbon is a stereocenter in 2-bromobutane (CH₃-CHBr-CH₂-CH₃)?",opts:["C1","C2","C3","C4"],correct:1,explain:"Step 1: Check each carbon for 4 different substituents. C1 (CH₃): 3 H's + bond to C2 — only 2 different groups, not a stereocenter. Step 2: C2: bonded to H, Br, CH₃ (toward C1), and CH₂CH₃ (toward C3) — 4 DIFFERENT groups. Stereocenter! Step 3: C3 (CH₂): bonded to 2 H's + C2 + C4 — only 3 different groups, not a stereocenter. C4 (CH₃): primary, not a stereocenter. So only C2."},
{q:"Which has the HIGHEST CIP priority?",opts:["–CH₂Br","–CH₂OH","–CH₂CH₃","–CHO"],correct:0,explain:"Step 1: All four start with C, so look at the second shell — what's attached to that first carbon? Step 2: -CH₂Br: C is bonded to (Br, H, H). Br has atomic number 35. -CH₂OH: C is bonded to (O, H, H), O = 8. -CH₂CH₃: C is bonded to (C, H, H), C = 6. -CHO: C is bonded to (O, O, H) — the C=O counts as bonded to two O's. Step 3: Compare highest atom of each set: Br(35) > O(8) > O(8) > C(6). Br wins immediately. -CH₂Br has highest priority."},
{q:"Two molecules have identical connectivity but are non-superimposable mirror images. They are:",opts:["constitutional isomers","conformers","enantiomers","diastereomers"],correct:2,explain:"Step 1: 'Identical connectivity' rules out constitutional isomers (which have different bonding patterns). Step 2: 'Non-superimposable mirror images' is the literal definition of enantiomers. Step 3: Diastereomers are stereoisomers that are NOT mirror images. Conformers are different shapes of the same molecule from bond rotation. So: enantiomers."},
{q:"How many stereoisomers are possible for a molecule with 3 different stereocenters?",opts:["3","4","6","8"],correct:3,explain:"Step 1: Use the formula 2ⁿ where n = number of stereocenters. Step 2: 2³ = 8. Step 3: This assumes no internal symmetry (no meso forms). If the molecule has meso symmetry, the actual count is lower. With 3 different (non-symmetric) stereocenters, you get the full 8 stereoisomers — 4 pairs of enantiomers, each pair being diastereomers of the others."},
{q:"In cis-1,3-dimethylcyclohexane, the most stable chair conformation has:",opts:["both methyls axial","both methyls equatorial","one axial, one equatorial","cis means it can't be drawn in a chair"],correct:1,explain:"Step 1: Cis-1,3 means both methyls are on the same face of the ring. Step 2: For 1,3-relationships on a chair (unlike 1,2 or 1,4), cis substituents can BOTH be equatorial OR BOTH axial (depending on which chair). Step 3: Both equatorial is much more stable (no 1,3-diaxial strain). So the molecule lives almost exclusively in the both-equatorial chair. Trans-1,3 would force one axial + one equatorial."},
{q:"What is the relationship between (R)-2-bromobutane and (S)-2-bromobutane?",opts:["identical (homomers)","constitutional isomers","enantiomers","diastereomers"],correct:2,explain:"Step 1: Same molecular formula and same connectivity (both are 2-bromobutane). Not constitutional isomers. Step 2: They differ only in the configuration at C2 — opposite configurations means they are mirror images. Step 3: A molecule with one stereocenter can only have an enantiomer (no diastereomers possible without a second stereocenter). So (R)- and (S)-2-bromobutane are enantiomers."},
{q:"Which compound is achiral despite having stereocenters?",opts:["(R)-2-chlorobutane","(2R,3R)-tartaric acid","meso-2,3-dibromobutane","(S)-3-methylhexane"],correct:2,explain:"Step 1: Meso compounds contain stereocenters but have an internal mirror plane. Step 2: In meso-2,3-dibromobutane, C2 and C3 are stereocenters with opposite configurations (one R, one S). Their optical contributions cancel. Step 3: An imaginary mirror through the middle of the molecule reflects one half onto the other → the molecule is its own mirror image → achiral. Optically inactive despite the 'chiral' centers."},
