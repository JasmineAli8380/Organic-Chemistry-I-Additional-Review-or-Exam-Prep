{q:"In a Newman projection of butane along C2-C3, the highest-energy conformation is:",opts:["anti","gauche","eclipsed","totally eclipsed (syn-periplanar, 0°)"],correct:3,explain:"Step 1: Rank stability: anti (180°, both methyls opposite — most stable) > gauche (60° or 300°, methyls 60° apart, slight strain) > eclipsed (120°, 240°, methyl-eclipsing-H) > totally eclipsed/syn-periplanar (0°, methyls directly overlap — maximum strain). Step 2: At 0°, the two methyls are perfectly aligned along the same direction → maximum steric AND torsional strain. Step 3: This is the energy maximum on the rotational graph."},
{q:"Cyclohexane in its chair conformation has bond angles of:",opts:["90°","109.5°","120°","180°"],correct:1,explain:"Step 1: Each ring carbon is sp³, which prefers tetrahedral 109.5° angles. Step 2: A flat hexagon would force 120° angles (and eclipsed H's) — high strain. Step 3: The chair conformation puckers the ring so each C–C–C angle is exactly 109.5°, AND every adjacent C–H pair is staggered. Result: zero angle strain, zero torsional strain. This is why the chair is so stable."},
{q:"Which functional group transformation would convert –COOH into an –COOR?",opts:["reduction","esterification","oxidation","hydrolysis"],correct:1,explain:"Step 1: –COOH is a carboxylic acid; –COOR is an ester. Step 2: Replacing the OH of the acid with OR (where R is an alkyl group from an alcohol) is called esterification — typically done by reacting the acid with an alcohol under acid catalysis (Fischer esterification). Step 3: Hydrolysis is the reverse (ester → acid). Reduction would change C=O to C-OH. Oxidation goes the other direction."},
{q:"Which compound has exactly 2 stereocenters AND is meso?",opts:["2,3-dichlorobutane (one specific stereoisomer)","2-chlorobutane","2,3-dibromopentane","1,2-dichloropropane"],correct:0,explain:"Step 1: 2-chlorobutane has only 1 stereocenter. 2,3-dibromopentane has 2 stereocenters but no symmetry (the ends differ — methyl vs ethyl). 1,2-dichloropropane has 1 stereocenter (C2). Step 2: 2,3-dichlorobutane has 2 stereocenters AND has the potential for meso because the two halves of the molecule (C1-C2 and C3-C4) are mirror images. Step 3: Specifically, the (2R,3S) form is meso — it has an internal mirror plane and is achiral despite the stereocenters."},
{q:"In bromocyclohexane, the chair with Br axial vs Br equatorial:",opts:["are equally stable","equatorial is more stable","axial is more stable","Br can\'t be on cyclohexane"],correct:1,explain:"Step 1: Bulky substituents prefer equatorial positions on cyclohexane. Step 2: Why? In the axial position, Br points straight up (or down), and on the same face two carbons away are H's (or worse, other groups) on C3 and C5 — this causes 1,3-diaxial strain. Step 3: In the equatorial position, Br points outward away from the ring, no 1,3-diaxial clash. Equatorial bromocyclohexane is preferred (~70% at equilibrium for Br). The bigger the substituent, the stronger the equatorial preference."},
{q:"Which contains both a primary amine AND a carboxylic acid in the same molecule?",opts:["ethanol","glycine (H₂N-CH₂-COOH)","acetone","benzaldehyde"],correct:1,explain:"Step 1: Glycine is the simplest amino acid. Step 2: H₂N- is a primary amine (N has 2 H's and 1 R group). -COOH is a carboxylic acid (C=O and OH on same carbon). Step 3: The combination of an amine and a carboxylic acid is what defines an amino acid — the building blocks of proteins. The other compounds have only one functional group each."},
{q:"How many σ and π bonds are in CH₂=CH-C≡N (acrylonitrile)?",opts:["5σ, 2π","6σ, 3π","6σ, 2π","5σ, 3π"],correct:1,explain:"Step 1: Count single bonds first. CH₂= has 2 C-H bonds. =CH- has 1 C-H bond. C-C bond between =CH and C≡N counts as 1 σ. That's 4 σ bonds so far. Step 2: Add bonds from multiples. The C=C double bond = 1σ + 1π. The C≡N triple bond = 1σ + 2π. Step 3: Total: 4 (single bonds) + 1 (from C=C σ) + 1 (from C≡N σ) = 6 σ. And 1 π (from C=C) + 2 π (from C≡N) = 3 π. Answer: 6σ, 3π."}
]},

st2:{title:"Self-Test 2: Reactions (Modules 5-8)",lead:"20 questions on conformations, alkene reactions, alkynes, and SN/E mechanisms. Worked solutions for every question.",
body:`<p>This self-test focuses on the reaction-heavy middle of the course. Mechanisms and stereochemistry are heavily tested here. Take your time on each one.</p>`,
quiz:[
{q:"In trans-1,4-dimethylcyclohexane, the most stable chair has:",opts:["both methyls axial","both methyls equatorial","one axial, one equatorial","trans-1,4 doesn\'t exist"],correct:1,explain:"Step 1: Trans-1,4 means the substituents are on opposite faces of the ring. Step 2: For 1,4-relationships on a chair, trans means BOTH equatorial OR BOTH axial in either chair. (Cis-1,4 forces one of each.) Step 3: Both equatorial is far more stable — no 1,3-diaxial strain. So trans-1,4-dimethylcyclohexane sits in the chair with both methyls equatorial. The other chair (both axial) is high energy and rare."},
{q:"What is the major product of 2-methylpropene + HBr (no peroxides)?",opts:["1-bromo-2-methylpropane","2-bromo-2-methylpropane (tert-butyl bromide)","2-bromobutane","no reaction"],correct:1,explain:"Step 1: Identify the alkene carbons in (CH₃)₂C=CH₂: a tertiary carbon (with two methyls) and a primary carbon (CH₂). Step 2: Apply Markovnikov: H goes to the C that already has more H's (the CH₂ end). Step 3: Mechanistically, this generates a 3° carbocation on the more substituted C (most stable). Br⁻ attacks → Br on the 3° carbon. Product: (CH₃)₃C-Br = 2-bromo-2-methylpropane (tert-butyl bromide)."},
{q:"Cyclopentene + Br₂ in CH₂Cl₂ gives:",opts:["1,1-dibromocyclopentane","cis-1,2-dibromocyclopentane","trans-1,2-dibromocyclopentane","bromocyclopentane only"],correct:2,explain:"Step 1: The mechanism involves a bromonium ion. Br₂ approaches one face of the C=C, and the alkene electrons attack one Br while the other becomes a bridging cation. Step 2: Br⁻ then attacks from the OPPOSITE face (backside attack) at one of the ring carbons, opening the bromonium ring. Step 3: The result: the two Br atoms end up on opposite faces of the ring → trans (anti) addition. Product: trans-1,2-dibromocyclopentane."},
{q:"Hydroboration-oxidation (BH₃·THF then H₂O₂/NaOH) of 1-methylcyclohexene gives:",opts:["1-methylcyclohexanol","trans-2-methylcyclohexanol","cis-2-methylcyclohexanol","cis-1-methylcyclohexanol"],correct:2,explain:"Step 1: Hydroboration is anti-Markovnikov AND syn. Step 2: Anti-Markovnikov: OH ends up on the LESS substituted alkene carbon. In 1-methylcyclohexene, the methyl-bearing C is more substituted; the adjacent C is less substituted. So OH goes to the C without the methyl → 2-methylcyclohexanol. Step 3: Syn addition: H and OH add to the SAME face. The methyl (already on C1) and the new OH (on C2) end up on the same face → cis-2-methylcyclohexanol."},
{q:"To convert 2-butyne to cis-2-butene, you should use:",opts:["H₂ / Pd-C","H₂ / Lindlar catalyst","Na or Li / NH₃","HBr"],correct:1,explain:"Step 1: Goal is alkyne → cis (Z) alkene. Step 2: H₂ with Pd-C goes all the way to alkane (over-reduction). Step 3: Lindlar catalyst is poisoned palladium (Pd/CaCO₃ with Pb) — it reduces alkynes by SYN addition of H₂ but stops at the alkene. Syn addition gives cis. Step 4: Na or Li in NH₃ would give the trans (E) alkene through dissolving metal reduction. So Lindlar is the answer for cis."},
{q:"Acetylene (HC≡CH) + NaNH₂, then ethyl bromide, gives:",opts:["1-butene","ethane","1-butyne","2-butyne"],correct:2,explain:"Step 1: NaNH₂ deprotonates the terminal alkyne (terminal alkyne pKa ~25, NH₃ pKa ~35 — strong enough). Step 2: HC≡C⁻Na⁺ (acetylide) attacks ethyl bromide via SN2 (primary halide, perfect). Step 3: The new C–C bond forms between the acetylide carbon and the carbon bearing Br: HC≡C-CH₂CH₃ = 1-butyne. Note: this is alkylation only on ONE side of acetylene. To get 2-butyne, you'd repeat the process (deprotonate the new terminal alkyne, alkylate again with another methyl halide)."},
{q:"What's the product of (R)-2-bromooctane + NaOH in water/acetone (mild conditions)?",opts:["(R)-2-octanol","(S)-2-octanol","racemic 2-octanol","2-octene"],correct:1,explain:"Step 1: Substrate is 2°. NaOH is a strong nucleophile and a strong base. The conditions (water/acetone, no extreme heat) favor SN2 over E2 for a 2° substrate with a small strong nucleophile like OH⁻. Step 2: SN2 is concerted backside attack → 100% inversion of configuration. Step 3: The starting material is (R) → product is (S)-2-octanol. Some elimination might compete, but the SN2 product dominates and is the (S) enantiomer."},
{q:"You want to make ONLY the trans alkene from 3-hexyne. Use:",opts:["H₂ / Pd-C","H₂ / Lindlar","Na / NH₃ (liquid)","mCPBA"],correct:2,explain:"Step 1: Goal: alkyne → trans (E) alkene. Step 2: Lindlar gives cis (syn addition of H₂). Pd-C over-reduces to alkane. mCPBA makes epoxides from alkenes (wrong reaction). Step 3: Dissolving metal reduction (Na or Li in liquid NH₃) is the only way to get trans alkene from an alkyne. The mechanism goes through a vinyl radical intermediate that adopts the trans geometry before being protonated."},
{q:"Hydration of propyne (HC≡C-CH₃) with H₂SO₄/H₂O/HgSO₄ gives:",opts:["propanal (CH₃CH₂CHO)","acetone (CH₃COCH₃)","propan-1-ol","propan-2-ol"],correct:1,explain:"Step 1: Markovnikov hydration of an alkyne gives an enol, which tautomerizes to a ketone (or aldehyde). Step 2: For a terminal alkyne, Markovnikov puts OH on the more substituted carbon (the internal one). Enol = CH₂=C(OH)-CH₃. Step 3: Tautomerization moves the H from O to the terminal C → CH₃-CO-CH₃ = acetone (a methyl ketone). Terminal alkynes ALWAYS give methyl ketones with this reagent, never aldehydes. To get an aldehyde from a terminal alkyne, use hydroboration instead (anti-Markovnikov)."},
{q:"Which substrate undergoes SN1 the FASTEST?",opts:["CH₃Br","CH₃CH₂Br","(CH₃)₂CHBr","(CH₃)₃CBr"],correct:3,explain:"Step 1: SN1 rate depends on carbocation stability. Step 2: After Br leaves, you get: CH₃⁺ (methyl cation, terrible), CH₃CH₂⁺ (1°, very poor), (CH₃)₂CH⁺ (2°, ok), (CH₃)₃C⁺ (3°, stable). Step 3: Most stable cation = fastest SN1. Tertiary butyl bromide is the textbook champion — the 3° cation is stabilized by hyperconjugation from the three methyl groups."},
{q:"In E2 elimination on a cyclohexane, the leaving group and the β-H must be:",opts:["both equatorial","both axial (anti-periplanar)","cis to each other","gauche"],correct:1,explain:"Step 1: E2 requires anti-periplanar geometry — the H and leaving group must be 180° apart in the same plane. Step 2: On a cyclohexane chair, the only way for two substituents on adjacent carbons to be 180° apart is for BOTH to be axial. Step 3: This means E2 from cyclohexanes only happens when the leaving group is in the axial position AND there's a β-H also axial. If the leaving group is locked equatorial (e.g., by a t-Bu anchor), E2 can't happen until a ring flip."},
{q:"What does a bulky base like KOtBu favor when reacting with a 3° alkyl halide?",opts:["SN1","SN2","E2 with Zaitsev product","E2 with Hofmann product"],correct:3,explain:"Step 1: 3° alkyl halide + strong base = E2 (substitution is impossible because of steric crowding for SN2, and SN1 would only happen with weak nucleophiles). Step 2: A BULKY base can't reach the more sterically crowded β-hydrogens. Step 3: The bulky base grabs the most accessible (least hindered) β-H, which leads to the LESS substituted alkene — the Hofmann product. Small strong bases like NaOEt give the more substituted Zaitsev product."},
{q:"In SN1, what happens to the stereochemistry at the reacting carbon?",opts:["complete inversion","complete retention","racemization (mostly)","no stereochemistry change"],correct:2,explain:"Step 1: The mechanism: the leaving group leaves first, generating a planar (sp²) carbocation. Step 2: The cation has lost its tetrahedral geometry — it's flat. The nucleophile can attack from EITHER face with roughly equal probability. Step 3: Result: ~50:50 mixture of the two possible configurations at that carbon = racemic. (In practice, slight preference for backside attack gives a small excess of inversion, but for exam purposes, SN1 = racemization.)"},
{q:"Which conditions favor SN2 over E2 for a primary alkyl halide?",opts:["bulky strong base, heat","small strong nucleophile that's a weak base, polar aprotic solvent","weak nucleophile, polar protic","no nucleophile"],correct:1,explain:"Step 1: For 1° substrates, SN2 is naturally preferred (no SN1, and elimination is mostly disfavored due to no incentive to form the alkene). Step 2: To favor substitution over elimination further, use a STRONG NUCLEOPHILE that is a WEAK BASE — examples: I⁻, Br⁻, RS⁻, CN⁻, N₃⁻. These attack the carbon (substitution) rather than abstracting a β-H (elimination). Step 3: Polar aprotic solvent (DMSO, DMF, acetone) keeps the nucleophile reactive. Avoid heat (which would push toward elimination)."},
{q:"What's the product of cyclohexene + OsO₄ then NaHSO₃?",opts:["cyclohexanol","cis-1,2-cyclohexanediol","trans-1,2-cyclohexanediol","cyclohexanone"],correct:1,explain:"Step 1: OsO₄ does syn dihydroxylation. The osmium adds across the double bond in a concerted, single-face manner, forming a cyclic osmate ester. Step 2: NaHSO₃ hydrolyzes the osmate ester, releasing the diol. Step 3: Because both new C-O bonds formed on the SAME face of the original alkene, the two OHs end up cis to each other → cis-1,2-cyclohexanediol. (Trans-diol would require anti addition, which OsO₄ does not do.)"},
{q:"Ozonolysis of 2-methyl-2-butene with O₃ then Zn/H₃O⁺ gives:",opts:["2 acetones","acetone + acetaldehyde","propanal + formaldehyde","2-butanone"],correct:1,explain:"Step 1: Identify the alkene: (CH₃)₂C=CH-CH₃. Step 2: Ozonolysis cleaves the C=C and replaces it with two C=O groups, one on each former alkene carbon. Step 3: The (CH₃)₂C= side becomes (CH₃)₂C=O = acetone (no H on that C, so it's a ketone). The =CH-CH₃ side becomes O=CH-CH₃ = acetaldehyde (H present, so it's an aldehyde). Two products: acetone + acetaldehyde."},
{q:"Why does a terminal alkyne (pKa ~25) get deprotonated by NaNH₂ but NOT by NaOH?",opts:["NaOH is a weaker base than NaNH₂","NaOH would react with the alkyne carbon instead","NaOH is too dilute","they both work equally well"],correct:0,explain:"Step 1: For full deprotonation, the base must be stronger than the conjugate base of the acid. Equivalently: the base's conjugate acid must have a HIGHER pKa than the acid being deprotonated. Step 2: NH₂⁻ (from NaNH₂) has conjugate acid NH₃ (pKa ~35). Since 35 > 25, NaNH₂ can deprotonate the terminal alkyne. Step 3: OH⁻ (from NaOH) has conjugate acid H₂O (pKa ~16). Since 16 < 25, NaOH is NOT strong enough — the equilibrium would lie heavily toward the alkyne, not the acetylide. The alkyne is more acidic than water, so water 'wins' and the reaction doesn't proceed."},
{q:"Which solvent best supports SN1 reactions?",opts:["DMSO","hexane","ethanol","DMF"],correct:2,explain:"Step 1: SN1 requires good solvation of the carbocation intermediate AND the leaving group. Step 2: Polar protic solvents (water, alcohols, carboxylic acids) excel at this — they can hydrogen-bond to the leaving group anion AND solvate the cation through their polar groups. Step 3: DMSO and DMF are polar APROTIC — they solvate cations well but not anions, which makes them great for SN2 (free, naked nucleophile) but poor for SN1 (no anion stabilization). Hexane is nonpolar, can't dissolve ionic intermediates at all. Ethanol is the best of these for SN1."},
{q:"Acetone (a polar aprotic solvent) is commonly used for:",opts:["SN1 reactions","SN2 reactions like the Finkelstein reaction","E1 reactions","Friedel-Crafts reactions"],correct:1,explain:"Step 1: Acetone is polar aprotic — it dissolves ionic compounds (its polarity solvates cations) but doesn't H-bond to anionic nucleophiles. Step 2: This leaves the nucleophile 'naked' and highly reactive — perfect for SN2. Step 3: The Finkelstein reaction is the textbook example: alkyl chloride + NaI in acetone → alkyl iodide + NaCl. NaI dissolves in acetone, NaCl precipitates out, driving the equilibrium forward. Acetone is the solvent of choice for clean SN2 on primary halides."},
{q:"Which would NOT undergo a typical SN2 reaction at a useful rate?",opts:["1-bromobutane","2-bromobutane","tert-butyl bromide","bromomethane"],correct:2,explain:"Step 1: SN2 requires backside attack on the carbon bearing the leaving group. Step 2: As the carbon gets more substituted, it becomes more sterically hindered, slowing SN2 dramatically. Step 3: Methyl halides are fastest, then 1°, then 2° (slow), then 3° (essentially zero rate). Tert-butyl bromide (3°) is so hindered that backside attack is blocked entirely — SN2 doesn't happen. Tert-butyl bromide reacts only by SN1 or E2."}
]},

st3:{title:"Self-Test 3: Advanced Topics (Modules 9-12)",lead:"20 questions on conjugation, Diels-Alder, aromaticity, EAS, and spectroscopy. Worked solutions throughout.",
body:`<p>This self-test covers the back half of the course — the topics most heavily tested on midterms and finals. Take your time and read every walkthrough.</p>`,
quiz:[
{q:"Which conformation must a diene adopt to undergo Diels-Alder?",opts:["s-trans","s-cis","fully eclipsed","gauche"],correct:1,explain:"Step 1: Diels-Alder forms a 6-membered ring by joining the diene's C1 and C4 to the dienophile's two carbons. Step 2: For C1 and C4 to reach the dienophile simultaneously, they must point the same direction — that's the s-cis conformation (U-shape). Step 3: s-trans points them in opposite directions, too far apart to react. Most acyclic dienes interconvert between s-cis and s-trans freely, so they can react. Dienes locked in s-trans (e.g., in rigid rings) cannot."},
{q:"What makes a good Diels-Alder dienophile?",opts:["electron-donating groups","electron-withdrawing groups","aromatic rings","saturated chains"],correct:1,explain:"Step 1: Diels-Alder is a normal-electron-demand reaction — the diene is electron-rich and the dienophile should be electron-poor. Step 2: Electron-withdrawing groups (–CHO, –COR, –CO₂R, –CN, –NO₂) pull electron density out of the dienophile's C=C, making it more electrophilic. Step 3: This lowers the LUMO energy of the dienophile, allowing better orbital overlap with the diene's HOMO → faster reaction. Maleic anhydride (with two C=O groups) is the textbook champion dienophile."},
{q:"How many π electrons does pyrrole have in its aromatic system?",opts:["4","6","8","2"],correct:1,explain:"Step 1: Pyrrole is a 5-membered ring with N–H, two C=C bonds, and the N's lone pair. Step 2: The N is sp² and uses its sp² orbitals for bonds to two C's and one H. Its lone pair must go in the perpendicular p-orbital. Step 3: Count π electrons in the ring: 2 C=C × 2 = 4 e⁻, plus 2 from the N lone pair = 6 π electrons. Step 4: 6 = 4(1)+2 with n=1 → satisfies Hückel → aromatic."},
{q:"Cyclooctatetraene escapes anti-aromaticity by:",opts:["dimerizing","losing electrons","puckering into a non-planar tub shape","gaining electrons"],correct:2,explain:"Step 1: COT has 8 π electrons. If planar, that's 4n with n=2 → anti-aromatic (very destabilized). Step 2: Nature avoids the anti-aromatic destabilization by breaking planarity — the molecule puckers into a tub-shaped (non-planar) conformation. Step 3: In the tub shape, the p-orbitals can no longer overlap continuously around the ring → the molecule becomes non-aromatic (just a regular cyclic polyene), behaving chemically like 4 isolated alkenes."},
{q:"Which is the strongest activator in EAS?",opts:["–CH₃","–OCH₃","–NH₂","–Cl"],correct:2,explain:"Step 1: Activators donate electrons to the ring. The strongest donors are those with lone pairs that can participate in resonance directly with the ring. Step 2: Both –NH₂ and –OCH₃ donate via lone pair resonance. But N (less electronegative than O) holds its lone pair more loosely, making it a better donor. Step 3: Reactivity ranking: –NH₂ > –OH > –OCH₃ > –NHCOR > alkyl > –Ph > –H > halogens > –CHO > ... > –NO₂. So –NH₂ is the strongest activator among these choices."},
{q:"You want para-bromonitrobenzene from benzene. Correct order:",opts:["nitrate first, then brominate","brominate first, then nitrate","both at the same time","not possible from benzene"],correct:1,explain:"Step 1: Identify the directing effects. Br is a deactivator BUT an o,p-director. NO₂ is a strong deactivator and meta-director. Step 2: If you nitrate first, the NO₂ directs the next electrophile to the meta position → you'd get m-bromonitrobenzene (wrong). Step 3: If you brominate first, the Br directs the next electrophile to ortho/para. The para isomer dominates due to less steric hindrance. Step 4: So: brominate → nitrate gives the para product."},
{q:"Why does Friedel-Crafts alkylation with 1-chloropropane give isopropylbenzene as the major product?",opts:["chloride is a poor leaving group","the primary carbocation rearranges via hydride shift to a more stable secondary cation","propane is volatile","steric hindrance"],correct:1,explain:"Step 1: AlCl₃ + 1-chloropropane generates the primary cation CH₃CH₂CH₂⁺ — very unstable. Step 2: A hydride from C2 migrates to C1, generating the secondary cation (CH₃)₂CH⁺ (isopropyl) — much more stable. Step 3: The benzene ring attacks the rearranged isopropyl cation → product is isopropylbenzene (cumene), not n-propylbenzene. Step 4: This rearrangement problem is exactly why F-C acylation is preferred when you need a straight-chain alkyl group: the acylium ion (R-C≡O⁺) is resonance-stabilized and doesn't rearrange."},
{q:"A strong, broad IR peak at 3200–3650 cm⁻¹ indicates:",opts:["alcohol O–H","aldehyde C–H","alkyne C–H","aromatic C–H"],correct:0,explain:"Step 1: Strong, broad peaks in the 3200–3650 region are O–H or N–H stretches. Step 2: Alcohol O–H is broad (due to hydrogen bonding) and sits in the 3200–3650 range. Step 3: Aldehyde C–H is around 2720 and 2820 (two weak peaks). Alkyne ≡C–H is sharp at 3300. Aromatic C–H is at 3030 (medium). Step 4: 'Strong AND broad' in 3200–3650 = alcohol. Carboxylic acid O–H is even broader and lower (2500–3100)."},
{q:"In ¹H NMR, the (n+1) splitting rule says a peak split by 3 equivalent neighbors gives:",opts:["a doublet","a triplet","a quartet","a quintet"],correct:2,explain:"Step 1: The n+1 rule: a hydrogen with n equivalent neighboring hydrogens (on adjacent carbons) appears as a peak split into n+1 lines. Step 2: With 3 neighbors, multiplicity = 3+1 = 4 lines → quartet. Step 3: Classic example: the CH₂ of an ethyl group (–CH₂CH₃) sees 3 H's on the adjacent CH₃ → quartet. The CH₃ sees 2 H's on the adjacent CH₂ → triplet. So ethyl = triplet (3H) + quartet (2H)."},
{q:"In a mass spectrum, a loss of 18 from the molecular ion suggests loss of:",opts:["CH₃","NH₂","H₂O","CO"],correct:2,explain:"Step 1: Mass losses are diagnostic clues. Memorize the common ones: −15 (CH₃), −17 (OH), −18 (H₂O), −28 (CO or N₂), −29 (CHO or C₂H₅), −43 (C₃H₇ or CH₃CO), −45 (CO₂H). Step 2: A loss of 18 = H₂O. This is especially common from alcohols, which dehydrate during ionization. Step 3: If you see M − 18, suspect an alcohol. (Or sometimes loss of water from a ketone via McLafferty rearrangement.)"},
{q:"How many ¹H NMR signals does para-xylene (1,4-dimethylbenzene) show?",opts:["1","2","3","4"],correct:1,explain:"Step 1: Identify all H environments. The two methyl groups: by symmetry, both –CH₃ groups are equivalent → 1 signal (6H total). Step 2: The four aromatic H's: by symmetry of the para-substitution, all four ring H's are equivalent → 1 signal (4H total). Step 3: Total = 2 signals. The high symmetry of para-disubstituted benzenes always gives simple NMRs."},
{q:"Naphthalene (two fused benzene rings) has how many π electrons and is it aromatic?",opts:["6, aromatic","8, anti-aromatic","10, aromatic","12, non-aromatic"],correct:2,explain:"Step 1: Count C=C bonds in the standard structure of naphthalene — there are 5 double bonds drawn. Step 2: 5 × 2 = 10 π electrons. Step 3: Check Hückel: 10 = 4(2)+2 with n=2 → ✓ matches 4n+2. Step 4: Naphthalene is planar, fully conjugated across both rings. Aromatic. ✓ Other polycyclic aromatics like anthracene (14 e⁻, n=3) and coronene also fit."},
{q:"Furan is aromatic. Which oxygen lone pair is part of the aromatic π system?",opts:["both lone pairs","one lone pair (in the perpendicular p-orbital)","neither lone pair","there are no lone pairs on O"],correct:1,explain:"Step 1: Oxygen in furan is sp² hybridized. It has 6 valence electrons total. Step 2: Two electrons go into σ bonds to the two adjacent ring carbons. Two more electrons sit in the third sp² orbital — this lone pair is IN the plane of the ring, not part of π. Step 3: The remaining two electrons sit in the perpendicular p-orbital — THIS lone pair is part of the π system. Adding 2 (from O) + 4 (from the two C=C) = 6 π electrons → aromatic."},
{q:"Why is benzaldehyde\'s C=O at higher wavenumber (~1700) than a regular aldehyde (~1725)?",opts:["it isn\'t","conjugation with the benzene ring lowers the C=O frequency","aromatic rings have no effect","benzaldehyde isn\'t a real compound"],correct:1,explain:"Step 1: General principle: conjugation between C=O and an aromatic ring or another C=C lowers the C=O stretching frequency. Step 2: Why? Conjugation gives the C=O some single-bond character (the electrons delocalize into the π system), and weaker bonds vibrate at lower frequencies. Step 3: A non-conjugated aldehyde absorbs near 1725 cm⁻¹. Benzaldehyde absorbs near 1700 cm⁻¹ — the conjugation with the ring drops it by ~25 cm⁻¹. Same effect for α,β-unsaturated ketones."},
{q:"In the EAS arenium ion intermediate, the positive charge is delocalized over how many ring carbons?",opts:["1","2","3","all 6"],correct:2,explain:"Step 1: When the electrophile attacks, one ring carbon becomes sp³ (forming the new C–E bond). The remaining 5 ring carbons still have p-orbitals. Step 2: Resonance structures of the arenium ion show the positive charge appearing on three specific carbons: ortho, ortho, and para to the new C–E bond. Step 3: That's 3 carbons sharing the positive charge — NOT all 6, because the sp³ carbon breaks the ring's full conjugation. Stabilizing groups at those ortho/para positions explain why o,p-directors work."},
{q:"Which dienophile reacts FASTEST with cyclopentadiene in a Diels-Alder?",opts:["ethylene","propene","tetracyanoethylene (TCNE, four CN groups)","cyclohexene"],correct:2,explain:"Step 1: Diels-Alder rate increases as the dienophile becomes more electron-poor. Step 2: TCNE has FOUR strongly electron-withdrawing –CN groups around the C=C — the most extreme electron-poor dienophile in common use. Step 3: Ethylene, propene, and cyclohexene have no EWGs and react sluggishly or not at all with simple dienes. TCNE is so reactive that it reacts even with weakly nucleophilic dienes like anthracene."},
{q:"How many ¹H NMR signals would you see for 2,2-dimethylpropane (neopentane)?",opts:["1","2","3","5"],correct:0,explain:"Step 1: Draw neopentane: C(CH₃)₄ — a central carbon bonded to 4 identical methyl groups. Step 2: All 12 H's are equivalent by the high tetrahedral symmetry — every H sees the same chemical environment. Step 3: Equivalent H's give a single NMR signal. So neopentane shows just 1 peak (a singlet, integrating to 12H). The simplest possible NMR."},
{q:"You want to make m-bromobenzoic acid from toluene. The cleanest order is:",opts:["brominate, then oxidize the methyl","oxidize the methyl to COOH, then brominate","both at once","not possible"],correct:1,explain:"Step 1: Identify directing effects. –CH₃ is an o,p-director. –COOH is a meta-director. Step 2: If you brominate toluene first, the methyl directs the Br to ortho/para → wrong product (you'd get o- or p-bromotoluene, then oxidation gives o- or p-bromobenzoic acid, not meta). Step 3: Oxidize the methyl FIRST (KMnO₄) → benzoic acid. Now –COOH is the substituent, which directs meta. Then brominate → m-bromobenzoic acid. ✓"},
{q:"In a ¹H NMR, an isopropyl group (–CH(CH₃)₂) gives what pattern?",opts:["singlet (6H) + singlet (1H)","doublet (6H) + septet (1H)","triplet (6H) + quartet (1H)","quartet (6H) + multiplet (1H)"],correct:1,explain:"Step 1: Identify the H environments. The two CH₃ groups are equivalent (6H total). The central CH has 1H. Step 2: Apply n+1. The CH₃'s see ONE neighbor (the central CH) → 1+1 = 2 lines = doublet. Step 3: The central CH sees SIX neighbors (the two equivalent methyls) → 6+1 = 7 lines = septet. Step 4: Result: 6H doublet + 1H septet — the unmistakable isopropyl fingerprint in NMR."},
{q:"Pyridine\'s N has a lone pair. Why is pyridine basic but pyrrole isn\'t?",opts:["pyridine\'s lone pair is in the π system","pyridine\'s lone pair is in an sp² orbital pointing OUT of the ring (not in π) — free to grab a proton","pyrrole\'s lone pair is on a different atom","they\'re both equally basic"],correct:1,explain:"Step 1: In pyridine, the N is sp² and uses one sp² orbital for an in-plane lone pair pointing OUTWARD. Its perpendicular p-orbital contributes 1 electron (like a regular sp² C) to the π system through C=N. Step 2: That outward-pointing lone pair is freely available to accept a proton → pyridine is basic (like an amine). Step 3: In pyrrole, the N's lone pair is COMMITTED to the π system (it\'s the only way to reach 6 π electrons). Removing it (by protonation) would destroy aromaticity → very unfavorable. So pyrrole is a poor base, despite having a lone pair on N."}
]},

st4:{title:"Self-Test 4: Comprehensive Review (All Modules)",lead:"20 questions pulling from across the entire course. The best preparation for exams.",
body:`<p>This is a mixed practice set covering everything in Modules 1-12. Treat it like a mini-exam: try to answer without looking back at notes first, then read the walkthroughs.</p>`,
quiz:[
{q:"Which has a bond angle of 109.5°?",opts:["water","CO₂","methane","BF₃"],correct:2,explain:"Step 1: 109.5° is the perfect tetrahedral angle, characteristic of sp³ carbons or atoms with 4 electron groups in tetrahedral geometry. Step 2: Methane (CH₄) has 4 C–H bonds around an sp³ C → exact 109.5° angles. Step 3: Water is bent (~104.5° due to lone pair compression). CO₂ is linear (180°). BF₃ is trigonal planar (120°). Only methane matches."},
{q:"How many degrees of unsaturation in C₆H₆?",opts:["2","3","4","5"],correct:2,explain:"Step 1: Apply DoU = (2C+2−H)/2 = (12+2−6)/2 = 8/2 = 4. Step 2: 4 degrees of unsaturation. Step 3: This matches benzene perfectly: 1 ring + 3 C=C = 4 DoU. ✓"},
{q:"What is the IUPAC name for acetone?",opts:["propan-1-one","propan-2-one","2-propanone","both b and c are acceptable"],correct:3,explain:"Step 1: Acetone is CH₃-CO-CH₃, a 3-carbon ketone with the C=O on C2. Step 2: 'Propan-2-one' is the modern IUPAC form (locant before the suffix), and '2-propanone' is the older but still accepted form. Both are correct. Step 3: 'Propan-1-one' would put the C=O at C1 — but a ketone can\'t be on a terminal carbon (that would be an aldehyde). Acetone is propanone, with the 2 implied since there\'s only one possible position for a 3-carbon ketone."},
{q:"Which has the highest priority by CIP rules?",opts:["–OH","–NH₂","–F","–CH₃"],correct:2,explain:"Step 1: Compare atomic numbers of the directly attached atom. F = 9, O = 8, N = 7, C = 6. Step 2: Highest atomic number wins immediately. F (9) > O (8) > N (7) > C (6). Step 3: So –F has the highest CIP priority. Halogens often dominate priority when present."},
{q:"In trans-1,2-dimethylcyclohexane, the most stable chair has:",opts:["both methyls equatorial","both methyls axial","one of each","trans-1,2 doesn\'t exist"],correct:0,explain:"Step 1: Trans-1,2 means substituents on opposite faces of the ring. On adjacent carbons of a chair, trans means one is axial and one is equatorial in either chair... wait, let me reconsider. Step 2: Actually, for trans-1,2: one chair has both equatorial, the other has both axial. Cis-1,2 forces one axial + one equatorial. Step 3: Both equatorial is much more stable (no diaxial strain). So trans-1,2-dimethylcyclohexane lives in the both-equatorial chair."},
{q:"Markovnikov addition of HCl to propene gives:",opts:["1-chloropropane","2-chloropropane","propan-1-ol","both equally"],correct:1,explain:"Step 1: Propene is CH₃-CH=CH₂. The two alkene carbons are: a 1° CH₂ and a 2° CH. Step 2: Markovnikov: H goes to the carbon with more H\'s (CH₂). The Cl goes to the more substituted C (the CH). Step 3: Mechanism: H⁺ adds to give the more stable cation (2° on the middle C), then Cl⁻ attacks. Product: CH₃-CHCl-CH₃ = 2-chloropropane (isopropyl chloride)."},
{q:"To convert a terminal alkyne to a methyl ketone, use:",opts:["BH₃ then H₂O₂","H₂O/H₂SO₄/HgSO₄","H₂/Lindlar","Na/NH₃"],correct:1,explain:"Step 1: Markovnikov hydration of an alkyne gives an enol that tautomerizes to a ketone. Step 2: For a terminal alkyne, Markovnikov places the OH on the more substituted (internal) carbon → enol → tautomerizes to a methyl ketone (with the C=O on the internal C). Step 3: Hydroboration (BH₃) is anti-Markovnikov and would give an aldehyde instead. H₂/Lindlar gives a cis alkene, not a ketone. Na/NH₃ gives a trans alkene."},
{q:"Which substrate undergoes E2 with the FASTEST rate when treated with NaOEt?",opts:["1-bromobutane","2-bromobutane","2-bromo-2-methylbutane","bromocyclohexane"],correct:2,explain:"Step 1: E2 rate generally increases with substrate substitution: 3° > 2° > 1°. Step 2: 2-Bromo-2-methylbutane is 3° (the C bearing Br has 3 R groups attached). It forms the most stable transition state (the developing alkene is most substituted). Step 3: 1-Bromobutane is 1° (slower E2, would mostly do SN2). 2-Bromobutane is 2° (intermediate). Bromocyclohexane is 2°. So 2-bromo-2-methylbutane wins."},
{q:"Which diene is locked in s-cis and is therefore extremely reactive in Diels-Alder?",opts:["1,3-butadiene","cyclopentadiene","2,4-hexadiene (E,E)","1,3-pentadiene"],correct:1,explain:"Step 1: Cyclopentadiene is a 5-membered ring containing 1,3-cyclopentadiene — its diene is locked in the s-cis conformation by the ring geometry. Step 2: The other dienes can rotate between s-cis and s-trans, with s-trans being more stable — they spend most of their time in the unreactive shape. Step 3: Cyclopentadiene\'s lock means it\'s ALWAYS ready to react → famously fast Diels-Alder reactions. So fast that it dimerizes with itself at room temperature."},
{q:"Which of these is anti-aromatic if planar?",opts:["benzene","cyclooctatetraene (planar form)","naphthalene","cyclopentadienyl anion"],correct:1,explain:"Step 1: Anti-aromatic = cyclic, planar, fully conjugated, with 4n π electrons (n=1,2,3...). Step 2: Cyclooctatetraene has 8 π electrons. If planar, that\'s 4n with n=2 → anti-aromatic. Step 3: Benzene (6e⁻), naphthalene (10e⁻), and cyclopentadienyl anion (6e⁻) all satisfy 4n+2 → aromatic. Only COT in its (hypothetical) planar form is anti-aromatic — and to escape this, it puckers into a non-planar tub instead."},
{q:"Which substituent is a meta-director in EAS?",opts:["–OH","–NH₂","–OCH₃","–NO₂"],correct:3,explain:"Step 1: Activators (donors) → ortho/para directors. Deactivators (withdrawers) → meta directors (except halogens). Step 2: –OH, –NH₂, and –OCH₃ all donate electrons through their lone pairs → strong activators → all o,p-directors. Step 3: –NO₂ is a strong electron-withdrawer (powerful deactivator). The arenium ion intermediates for ortho/para attack put positive charge directly adjacent to the already-positive nitro group — destabilized. Meta attack avoids this clash → meta is preferred. So –NO₂ is a meta director."},
{q:"In an IR spectrum, a sharp medium peak around 2250 cm⁻¹ suggests:",opts:["carboxylic acid","alkene","nitrile","alcohol"],correct:2,explain:"Step 1: Locate the region. 2250 cm⁻¹ is in the triple bond region (~2100–2300). Step 2: Two main candidates here: C≡C and C≡N. Internal alkynes can be very weak (sometimes invisible), and their absorption is around 2200. Nitriles (C≡N) appear around 2250 with medium intensity. Step 3: A medium peak at exactly 2250 is the textbook nitrile signature. Sharp and unmistakable."},
{q:"How many ¹H NMR signals does ethanol (CH₃CH₂OH) show?",opts:["1","2","3","4"],correct:2,explain:"Step 1: Identify the distinct H environments. Step 2: (a) The 3 H\'s on the methyl (–CH₃) — equivalent → 1 signal at ~1.2 ppm. (b) The 2 H\'s on the methylene (–CH₂–) — equivalent → 1 signal at ~3.7 ppm (downfield because of the adjacent O). (c) The 1 H on the hydroxyl (–OH) — 1 signal, often broad and variable around 2–5 ppm. Step 3: That\'s 3 distinct signals total. The methyl is a triplet, the CH₂ a quartet (classic ethyl pattern), and the OH usually appears as a broad singlet."},
{q:"Which of these is NOT a stereoisomer relationship?",opts:["enantiomers","diastereomers","constitutional isomers","cis/trans isomers"],correct:2,explain:"Step 1: Stereoisomers have the same connectivity but differ in 3D arrangement. Step 2: Enantiomers, diastereomers, and cis/trans isomers all share the same connectivity → all are stereoisomers. Step 3: Constitutional (structural) isomers have DIFFERENT connectivity (atoms bonded in a different order) — they are NOT stereoisomers. They share only the same molecular formula. So 'constitutional isomers' is the odd one out."},
{q:"How many ¹H NMR signals does cyclohexane show at room temperature?",opts:["1","2 (axial vs equatorial)","6","12"],correct:0,explain:"Step 1: Cyclohexane has 12 H\'s — 6 axial and 6 equatorial. At first glance you might predict 2 signals. Step 2: BUT the ring flips back and forth thousands of times per second, swapping axial ↔ equatorial. The NMR timescale is too slow to catch this — it sees an averaged environment. Step 3: All 12 H\'s appear equivalent on the NMR timescale → 1 single signal. (At very low temperatures, the ring flip slows enough to actually see 2 separate signals.)"},
{q:"Friedel-Crafts acylation of benzene with acetyl chloride / AlCl₃ gives:",opts:["toluene","ethylbenzene","acetophenone","benzaldehyde"],correct:2,explain:"Step 1: The reagents AlCl₃ + CH₃COCl generate the acylium ion CH₃C≡O⁺. Step 2: The benzene ring attacks the acylium carbon. After loss of H⁺, the new bond is C(ring)–CO–CH₃. Step 3: Product = phenyl methyl ketone = acetophenone (PhCOCH₃). Note: F-C acylation gives ketones cleanly (no rearrangement, no over-acylation, since the product is deactivated)."},
{q:"You react (R)-2-bromobutane with NaCN in DMSO. The product is:",opts:["(R)-2-cyanobutane","(S)-2-cyanobutane","racemic 2-cyanobutane","2-butene"],correct:1,explain:"Step 1: Identify conditions. CN⁻ is a strong nucleophile and weak base. DMSO is polar aprotic. Substrate is 2°. → SN2 conditions are met. Step 2: SN2 mechanism: backside attack with complete inversion of configuration. Step 3: Starting (R) configuration → product has (S) configuration. The Br and CN have similar CIP priorities, so the configuration label happens to flip from R to S in this case. Note: even when SN2 inverts the geometry, sometimes the LABEL stays the same depending on group priorities. Always re-evaluate CIP for the product."},
{q:"What\'s the most stable carbocation?",opts:["methyl (CH₃⁺)","primary (CH₃CH₂⁺)","secondary ((CH₃)₂CH⁺)","tertiary ((CH₃)₃C⁺)"],correct:3,explain:"Step 1: Carbocation stability follows: 3° > 2° > 1° > methyl. Step 2: Why? The empty p-orbital on the cation is stabilized by donation from adjacent C–H bonds (hyperconjugation) and from the inductive effect of attached alkyl groups. More alkyl groups = more donation = more stable. Step 3: Tertiary has 3 alkyl groups directly attached → maximum stabilization. Methyl has zero adjacent alkyls → essentially never forms in solution. So 3° is the winner."},
{q:"To convert 1-butanol to 1-bromobutane, you can use:",opts:["NaBr alone","HBr","NaBH₄","KMnO₄"],correct:1,explain:"Step 1: Goal: replace OH with Br. Step 2: HBr (or PBr₃, or SOBr₂) protonates the OH first, making it a good leaving group (water), and then Br⁻ does the substitution. Step 3: NaBr alone won\'t work because OH⁻ is a terrible leaving group — needs to be activated. NaBH₄ is a reductant. KMnO₄ would oxidize the alcohol (to a carboxylic acid for primary alcohols)."},
{q:"You want to identify an unknown alcohol by ¹H NMR. The OH proton typically appears:",opts:["always at 9-10 ppm","at a fixed position around 2 ppm","as a broad signal at variable position (1–5 ppm typically)","never appears"],correct:2,explain:"Step 1: The OH chemical shift is highly variable — it depends heavily on concentration, solvent, temperature, and hydrogen bonding. Step 2: It typically appears somewhere between 1–5 ppm but can be even broader. Often the signal is a broad hump, not a sharp peak, due to fast proton exchange. Step 3: To confirm it\'s an OH, you can shake the sample with D₂O — the OH proton swaps with deuterium and the signal disappears (the 'D₂O shake' technique). Aldehydes (9–10) and carboxylic acids (10–13) have much more predictable shifts."}
]},

st5:{title:"Self-Test 5: Synthesis & Multi-Step Reasoning",lead:"20 questions on building target molecules in 2 or 3 steps. Learn to think backwards from the product.",
body:`<p>Synthesis problems are about choosing the right reagents in the right order. Each question here gives you a starting material and a target — your job is to identify the best reagent or reaction sequence. Read every walkthrough carefully, even on questions you got right.</p>`,
quiz:[
{q:"To convert 1-butene to butan-2-ol, the best reagents are:",opts:["BH₃ then H₂O₂/NaOH","H₂O / H₂SO₄","KMnO₄","O₃ then Zn"],correct:1,explain:"Step 1: Goal is Markovnikov hydration of 1-butene. Step 2: 1-butene = CH₃CH₂CH=CH₂. Markovnikov puts OH on the more substituted (internal) carbon → C2 → butan-2-ol. Step 3: H₂O/H₂SO₄ gives Markovnikov hydration. BH₃ is ANTI-Markovnikov and would give butan-1-ol instead. KMnO₄ would oxidize/cleave. O₃ would cleave the alkene to two carbonyls."},
{q:"Best route to butan-1-ol from 1-butene:",opts:["H₂O/H₂SO₄","Hg(OAc)₂/H₂O then NaBH₄","BH₃·THF then H₂O₂/NaOH","HBr"],correct:2,explain:"Step 1: Goal is anti-Markovnikov hydration — OH on the LESS substituted (terminal) carbon. Step 2: BH₃ adds to the alkene with boron going to the less hindered carbon (steric reasons). After H₂O₂/NaOH oxidation, B is replaced with OH at that same position. Step 3: Net result: OH on the terminal C → butan-1-ol. The other reagents all give Markovnikov products."},
{q:"Convert 1-butyne to 2-butanone in two steps:",opts:["NaNH₂, then CH₃Br","H₂O/H₂SO₄/HgSO₄ (one step)","BH₃, then H₂O₂","Lindlar then H₂O"],correct:1,explain:"Step 1: This is actually a one-step Markovnikov hydration of a terminal alkyne. Step 2: H₂O/H₂SO₄/HgSO₄ adds water to the alkyne following Markovnikov: OH on the more substituted (internal) carbon → forms an enol → tautomerizes to a methyl ketone. Step 3: 1-butyne (HC≡C-CH₂CH₃) → enol (CH₂=C(OH)-CH₂CH₃) → 2-butanone (CH₃-CO-CH₂CH₃). Methyl ketone, not aldehyde, because Markovnikov puts OH on the internal C."},
{q:"To make trans-2-pentene from 2-pentyne, use:",opts:["H₂/Pd-C","H₂/Lindlar","Na/NH₃","HBr"],correct:2,explain:"Step 1: Goal: alkyne → trans (E) alkene. Step 2: H₂/Pd-C over-reduces all the way to pentane. Lindlar gives syn addition → cis alkene (wrong stereochemistry). HBr would add Br instead of reducing. Step 3: Dissolving metal reduction (Na or Li in liquid NH₃) is the only way to get a trans alkene from an alkyne. The mechanism involves vinyl radical/anion intermediates that adopt the trans geometry before the second protonation."},
{q:"To make 1-bromobutane from 1-butanol, use:",opts:["Br₂","NaBr alone","HBr (or PBr₃)","KMnO₄"],correct:2,explain:"Step 1: Goal: replace OH with Br. Direct substitution requires activating the OH (a poor leaving group on its own). Step 2: HBr protonates the OH to make water (a great leaving group), then Br⁻ attacks via SN2 (1° substrate). PBr₃ is an even cleaner alternative — it activates the OH and delivers Br in one operation. Step 3: NaBr alone won't work — without acid, OH⁻ won't leave. Br₂ would add across a double bond (none here). KMnO₄ would oxidize the alcohol."},
{q:"Synthesize hexane from 1-bromopropane (a coupling problem):",opts:["heat alone","NaNH₂","Li, then CuI, then 1-bromopropane","Br₂"],correct:2,explain:"Step 1: Goal: take two propyl pieces and join them into a 6-carbon chain. This is a classic Gilman reagent (lithium dialkylcuprate) coupling. Step 2: Step a: 1-bromopropane + 2 Li → propyllithium. Step b: 2 propyllithium + CuI → lithium dipropylcuprate (R₂CuLi). Step c: R₂CuLi + 1-bromopropane → propyl-propyl coupled = hexane. Step 3: Gilman reagents transfer one alkyl group to another alkyl halide via substitution-like mechanism. They\'re the textbook tool for forming new C–C bonds between two alkyl pieces."},
{q:"To convert benzene to ethylbenzene, the best route is:",opts:["F-C alkylation with chloroethane/AlCl₃","F-C acylation with acetyl chloride/AlCl₃, then Clemmensen reduction","direct addition of ethylene","SN2 with ethyl bromide"],correct:1,explain:"Step 1: F-C alkylation with chloroethane works for ethyl (no rearrangement is possible from a 2-carbon primary halide because rearrangement to methyl + cation is energetically uphill). Step 2: BUT F-C alkylation has another problem: the product (ethylbenzene) is more reactive than benzene → over-alkylation. Step 3: Cleaner: F-C acylation (gives acetophenone, no rearrangement, no over-acylation), then reduce the C=O to CH₂ with Clemmensen (Zn/Hg, HCl) or Wolff-Kishner. Net result: clean ethylbenzene without polysubstitution."},
{q:"To make m-bromoacetophenone from benzene, the order is:",opts:["brominate first, then acylate","acylate first, then brominate","acylate, then nitrate, then brominate","both at once"],correct:1,explain:"Step 1: Identify directing effects. The –COCH₃ group (after acylation) is a meta-director (deactivating EWG). Br is an o,p-director. Step 2: If you brominate first, Br directs the next group to ortho/para → wrong product. Step 3: If you acylate first (F-C acylation with CH₃COCl/AlCl₃) → acetophenone, then brominate → the COCH₃ directs Br to meta → m-bromoacetophenone. ✓"},
{q:"Convert 2-bromobutane to 2-butanol with retention of stereochemistry. The cleanest route is:",opts:["NaOH (SN2)","NaOH (SN1)","two successive SN2 reactions","E2 then hydration"],correct:2,explain:"Step 1: A single SN2 reaction inverts the configuration. SN1 racemizes. Neither gives clean retention. Step 2: TWO successive SN2 reactions = double inversion = net retention. Sequence: (R)-2-bromobutane + I⁻ → (S)-2-iodobutane (1st inversion) → then OH⁻ → (R)-2-butanol (2nd inversion). Step 3: This 'double SN2' is a classic trick for inverting an inversion. The intermediate iodide is often used because I⁻ is both a good Nu (attacks Br substrate) and a good LG (leaves easily for the next attack)."},
{q:"To prepare propanal from propan-1-ol, use:",opts:["KMnO₄ in cold water","PCC (pyridinium chlorochromate)","CrO₃/H₂SO₄ (Jones)","HCl"],correct:1,explain:"Step 1: 1° alcohol → aldehyde requires a MILD oxidant. Step 2: Strong oxidants (KMnO₄, CrO₃/H₂SO₄ Jones) over-oxidize 1° alcohols all the way to carboxylic acids — they don\'t stop at the aldehyde. Step 3: PCC is a mild, anhydrous Cr-based oxidant that stops cleanly at the aldehyde stage. Other mild options: DMP (Dess-Martin periodinane), Swern oxidation. PCC is the most commonly tested in undergraduate orgo. HCl doesn\'t oxidize."},
{q:"To make cis-2-butene from 2-butyne, use:",opts:["H₂/Pd-C","H₂/Lindlar","Na/NH₃","Br₂"],correct:1,explain:"Step 1: Goal is alkyne → cis (Z) alkene. Step 2: Lindlar catalyst (Pd poisoned with lead, on CaCO₃) does syn hydrogenation that stops at the alkene stage. Syn addition of H₂ to an alkyne gives the cis alkene. Step 3: H₂/Pd-C over-reduces to butane. Na/NH₃ gives trans. Br₂ adds bromines, doesn\'t reduce. So Lindlar is the answer for cis."},
{q:"You want to install a propyl group on benzene without rearrangement. Best:",opts:["1-chloropropane / AlCl₃","propanoyl chloride / AlCl₃, then Wolff-Kishner reduction","propene + HCl","Na with propyl bromide"],correct:1,explain:"Step 1: F-C alkylation with 1-chloropropane FAILS — the primary cation rearranges to the secondary isopropyl cation (hydride shift), giving cumene instead. Step 2: Two-step workaround: F-C acylation with propanoyl chloride forms an acylium ion (resonance-stabilized, no rearrangement) → propiophenone (Ph-CO-CH₂CH₃). Then reduce the C=O to CH₂ using Wolff-Kishner (NH₂NH₂ then KOH) or Clemmensen (Zn/Hg, HCl). Step 3: Final product: n-propylbenzene with no rearrangement. ✓"},
{q:"Convert ethanol to ethyl bromide:",opts:["NaBr","HBr (or PBr₃)","Br₂","NaOH then HBr"],correct:1,explain:"Step 1: Replace OH with Br. Same logic as 1-butanol → 1-bromobutane. Step 2: HBr protonates OH → water leaves → Br⁻ substitutes. Or PBr₃ does it cleaner in one shot for primary alcohols. Step 3: NaBr alone is useless without acid (OH won\'t leave). Br₂ would need an alkene to add to. The straightforward 1-step conversion is HBr or PBr₃."},
{q:"You need (E)-2-pentenal from 1-pentyne. Sequence:",opts:["BH₃ then H₂O₂","Na/NH₃ then ozonolysis","H₂SO₄/HgSO₄ then PCC","none of these work cleanly in one step"],correct:3,explain:"Step 1: This is a tricky multi-step problem. Goal: terminal alkyne → α,β-unsaturated aldehyde. Step 2: None of the listed single 'sequences' do it directly. The honest answer: you\'d need several steps — perhaps form the alkyne anion, alkylate, partially reduce, then oxidize an allylic position. Step 3: This question teaches the lesson that not every transformation has a clean 1-step solution. Real synthesis often requires creative multi-step routes — this is why retrosynthesis is taught as a skill. For exam purposes, recognize when none of the options work."},
{q:"Convert benzene to phenol via a sulfonation route:",opts:["one step with H₂O","SO₃/H₂SO₄, then NaOH (fusion), then H⁺","Br₂/FeBr₃ then NaOH","HNO₃/H₂SO₄"],correct:1,explain:"Step 1: Direct hydroxylation of benzene is hard. The traditional industrial route (now mostly replaced) uses sulfonation followed by alkali fusion. Step 2: Step a: Sulfonation (SO₃/H₂SO₄) installs –SO₃H. Step b: Fuse the resulting benzenesulfonic acid with molten NaOH at high temperature — replaces –SO₃H with –OH (–O⁻Na⁺ form). Step c: Acidify to get phenol. Step 3: Modern industrial routes use cumene oxidation, but this sulfonation route is still tested in textbooks as a classic transformation."},
{q:"You want para-nitrotoluene from toluene. Use:",opts:["just HNO₃","HNO₃/H₂SO₄","Br₂ first, then HNO₃","KMnO₄"],correct:1,explain:"Step 1: Toluene's methyl group is an o,p-director. Nitration with HNO₃/H₂SO₄ adds –NO₂ to the ortho or para position. Step 2: Para is preferred over ortho due to less steric hindrance from the methyl. Typical product distribution: ~60% para, ~35% ortho, ~5% meta. Step 3: Just HNO₃ alone (without H₂SO₄) is too slow — H₂SO₄ activates HNO₃ to form the nitronium ion (NO₂⁺), the actual electrophile. KMnO₄ would oxidize the methyl group instead. So HNO₃/H₂SO₄ is correct."},
{q:"To convert cyclohexene to cyclohexane-1,2-diol with TRANS stereochemistry:",opts:["OsO₄ then NaHSO₃","mCPBA then H₃O⁺","H₂/Pd","Br₂ then H₂O"],correct:1,explain:"Step 1: For TRANS-diol, you need anti addition of the two OH groups. Step 2: OsO₄ is syn dihydroxylation → cis-diol (wrong stereochem). H₂/Pd reduces the alkene without adding OHs. Br₂/H₂O makes a halohydrin, not a diol. Step 3: mCPBA forms an epoxide (syn). Acidic ring-opening of the epoxide proceeds with backside attack at one carbon → the two OHs end up trans. So mCPBA → epoxide → H₃O⁺ ring-opening = trans-1,2-diol. The two-step epoxidation/hydrolysis is the standard route to anti-diols."},
{q:"To make 1-pentyne from acetylene:",opts:["NaNH₂ then 1-bromopropane","Lindlar then propene","H₂SO₄ then propane","Na then propane"],correct:0,explain:"Step 1: Goal: extend acetylene by 3 carbons. Step 2: Step a: Deprotonate acetylene with NaNH₂ → HC≡C⁻Na⁺ (acetylide). Step b: Acetylide attacks 1-bromopropane via SN2 (primary halide ✓). Step 3: New C–C bond forms: HC≡C–CH₂CH₂CH₃ = 1-pentyne. Note: only PRIMARY alkyl halides work for acetylide alkylation — secondary or tertiary halides give E2 elimination instead. To extend further to higher alkynes, repeat the process on the new terminal alkyne."},
{q:"Best way to convert primary alcohol RCH₂OH to carboxylic acid RCOOH:",opts:["PCC","KMnO₄/H₃O⁺","NaBH₄","Lindlar"],correct:1,explain:"Step 1: 1° alcohol → carboxylic acid is a 4-electron oxidation (going through the aldehyde). Step 2: PCC stops at the aldehyde stage — too mild for the full oxidation. Step 3: Strong oxidants like KMnO₄/H₃O⁺ or CrO₃/H₂SO₄ (Jones) over-oxidize 1° alcohols all the way to the carboxylic acid. Step 4: NaBH₄ is a REDUCTANT (does the opposite). Lindlar is for alkyne reduction. Use KMnO₄/H₃O⁺ for the full oxidation."},
{q:"Convert 1-bromobutane to 1-butanol with retention of regiochemistry:",opts:["NaOH in DMSO (SN2)","H₂O alone (slow SN1)","KOH heat (E2)","NaH"],correct:0,explain:"Step 1: Goal: replace Br with OH at the same C. Substrate is primary. Step 2: NaOH in DMSO is the textbook clean SN2: strong nucleophile (OH⁻), polar aprotic solvent (DMSO leaves OH⁻ naked and reactive), 1° substrate (perfect for SN2). Result: 1-butanol. Step 3: H₂O alone is too slow on a primary substrate (no SN1 because primary cation is too unstable). KOH/heat would give elimination (1-butene). NaH would deprotonate, not substitute. NaOH/DMSO is the cleanest answer."}
]},

st6:{title:"Self-Test 6: Mechanism Mastery",lead:"20 questions focused on mechanism: predicting intermediates, drawing arrows in your head, and understanding WHY reactions go.",
body:`<p>Mechanisms are the heart of organic chemistry. If you understand WHY a reaction works, memorizing it becomes optional. These questions test your ability to think about electrons.</p>`,
quiz:[
{q:"In an SN2 reaction, the rate-determining step has a transition state that looks like:",opts:["a flat carbocation","a five-coordinate carbon (trigonal bipyramidal)","an alkene","a free nucleophile"],correct:1,explain:"Step 1: SN2 is concerted — one step. The nucleophile attacks while the leaving group is leaving. Step 2: At the transition state, the central carbon has 5 partial bonds: 3 to the unchanged groups (in a plane), one weakening bond to the leaving group, and one forming bond to the nucleophile. Step 3: This 5-coordinate geometry is trigonal bipyramidal — the Nu and LG are at the axial positions (180° apart), and the other 3 groups are equatorial. Walden inversion happens because the central C 'flips through' from one side to the other."},
{q:"In SN1, the slow step is:",opts:["nucleophile attack","ionization of the C-LG bond to form the carbocation","loss of a proton","formation of the alkene"],correct:1,explain:"Step 1: SN1 has two steps. Step 1: ionization (slow) — the C-leaving group bond breaks heterolytically, forming a carbocation. Step 2: nucleophile attack (fast) — the Nu adds to the carbocation. Step 2: The slow (rate-determining) step is the ionization, because forming a carbocation costs a lot of energy. Step 3: The rate equation is rate = k[substrate] only — no [nucleophile] dependence — confirming the slow step doesn\'t involve the nucleophile."},
{q:"Why is the bromonium ion intermediate in Br₂ addition important?",opts:["it speeds up the reaction","it forces anti addition by blocking one face of the alkene","it makes the product more stable","it has nothing to do with stereochemistry"],correct:1,explain:"Step 1: When Br₂ approaches the alkene, the alkene electrons form a bond to one Br, and the other Br ends up bridging both carbons in a 3-membered ring with a positive charge. This is the bromonium ion. Step 2: The bromonium ring physically blocks the top face of the alkene from any further attack. Step 3: Br⁻ then attacks ONLY from the bottom face (backside). Result: the two Br atoms end up on opposite faces of the original alkene → trans/anti addition. This is the key mechanistic reason halogenation is stereospecifically anti."},
{q:"Markovnikov\'s rule predicts that in HCl + propene, the Cl ends up on the more substituted carbon. WHY?",opts:["the chloride ion prefers crowded positions","the H⁺ adds first to give the more stable carbocation, and Cl⁻ attacks where the cation is","both possibilities are equally likely","Cl is more electronegative"],correct:1,explain:"Step 1: The mechanism: H⁺ (from HCl) adds first to one alkene carbon. Step 2: This generates a carbocation on the OTHER carbon. There are two choices: cation on the 1° C (very unstable) or cation on the 2° C (more stable). The reaction goes through the more stable cation. Step 3: Cl⁻ then attacks the cation. So Cl ends up on the more substituted C purely because that\'s where the cation formed. Markovnikov\'s rule is just a shorthand for 'go through the more stable cation.'"},
{q:"In E2 elimination, the H and leaving group must be:",opts:["on the same carbon","cis to each other","anti-periplanar (180° apart, in the same plane)","at any orientation"],correct:2,explain:"Step 1: E2 is concerted: the base removes the β-H, and the C-LG bond breaks, and the new π bond forms — all simultaneously. Step 2: For all this to happen smoothly, the orbitals involved must align. The H and LG must be on opposite sides (180° apart) AND in the same plane (periplanar) so the developing p-orbitals are parallel. Step 3: This anti-periplanar requirement is why E2 on cyclohexanes only happens when both groups are AXIAL (the only way to be 180° apart on adjacent ring carbons)."},
{q:"In the mechanism of nitration of benzene, the actual electrophile is:",opts:["HNO₃","NO₂⁻","NO₂⁺ (the nitronium ion)","H₂SO₄"],correct:2,explain:"Step 1: Nitration uses HNO₃ + H₂SO₄. The role of H₂SO₄ is to protonate HNO₃ and generate the nitronium ion. Step 2: HNO₃ + H₂SO₄ → H₂NO₃⁺ + HSO₄⁻ → NO₂⁺ + H₂O + HSO₄⁻. Step 3: The benzene ring then attacks NO₂⁺ to form the arenium ion intermediate, which loses H⁺ to give nitrobenzene. NO₂⁺ is a strong, linear electrophile — the actual species attacking the ring."},
{q:"A carbocation rearranges from 2° to 3° via:",opts:["a hydride shift","a methyl shift","either, depending on the structure","they don\'t rearrange"],correct:2,explain:"Step 1: Carbocations rearrange to more stable cations whenever possible. The two main types of shifts are: hydride shift (H moves with its bonding electron pair) and methyl shift (a methyl group moves with its bonding pair). Step 2: Whichever shift produces the more stable cation will happen. Step 3: For a 2°→3° rearrangement, either type can do the job depending on what\'s adjacent. If a methyl is on the adjacent C with no H to spare, the methyl shifts; if there\'s a hydrogen, hydride shift is usually faster (smaller, easier to move)."},
{q:"In the EAS arenium ion, the positive charge is delocalized over how many carbons?",opts:["2","3","4","6"],correct:1,explain:"Step 1: When the electrophile bonds to one ring carbon, that carbon becomes sp³ (and bears no positive charge). The remaining 5 ring carbons retain their p-orbitals. Step 2: Drawing resonance structures of the arenium ion, the positive charge appears on three of those five carbons: the two ortho positions (relative to the new bond) and the para position. Step 3: So the charge is delocalized over 3 specific carbons — not all 6, because the new sp³ C interrupts the conjugation. This is why ortho/para directors stabilize the intermediate (their donation reaches the cation), and meta directors destabilize it less when the new group ends up meta."},
{q:"In a Diels-Alder reaction, how many bonds form and break in the transition state?",opts:["form 2, break 0","form 2 σ, break 2 π (and form 1 new π)","form 6 bonds","form 4, break 4"],correct:1,explain:"Step 1: Diels-Alder is a [4+2] cycloaddition, concerted in a single step. Step 2: Breaking: 2 π bonds (one from the diene's two double bonds — though they reorganize, not all break — and one from the dienophile). Forming: 2 new σ bonds (closing the new ring) plus 1 new π bond (between what were the middle carbons of the diene). Step 3: Net: 2 σ bonds form, 2 π bonds break, 1 π bond forms. The cyclic 6-membered transition state has all these bond changes happening simultaneously, with electrons flowing in a loop."},
{q:"Why does cyclopentadiene easily lose a proton compared to a normal alkene?",opts:["the proton is acidic","the resulting cyclopentadienyl anion is aromatic (6 π electrons)","cyclopentadiene is unstable","the C-H bond is weak"],correct:1,explain:"Step 1: Cyclopentadiene\'s pKa is ~16 (similar to water!). For an alkane, that\'s extraordinarily acidic. Step 2: The reason: when you remove the H from the sp³ carbon, the resulting carbanion has a lone pair in a p-orbital. That p-orbital lines up with the existing 4 π electrons (from the two C=C bonds) to give 6 total π electrons in a continuous cyclic system → AROMATIC. Step 3: Aromaticity is so stabilizing that it\'s worth ~36 kcal/mol — making the anion much more stable than a normal carbanion → much easier to form → much more acidic parent. The driving force is gaining aromaticity."},
{q:"In the mechanism of Friedel-Crafts acylation, the acylium ion forms by:",opts:["protonation of an alcohol","R-CO-Cl + AlCl₃ → R-C≡O⁺ + AlCl₄⁻","heating an aldehyde","reduction of a ketone"],correct:1,explain:"Step 1: AlCl₃ is a Lewis acid — it has an empty orbital and likes to grab a chloride. Step 2: When R-COCl meets AlCl₃, the chloride leaves with AlCl₃ (forming AlCl₄⁻), and the acyl carbon becomes positively charged. Step 3: The resulting acylium ion R-C≡O⁺ is resonance-stabilized: the lone pair on O can donate to the positive C, giving a structure with a triple bond between C and O and the positive charge on O. This delocalization makes the acylium ion stable and prevents rearrangement (unlike alkyl cations in F-C alkylation)."},
{q:"In the addition of HBr to an alkene WITH peroxides, the mechanism switches to radical. The first step is:",opts:["H⁺ adds to the alkene","Br• adds to the less substituted alkene C","Cl⁻ attacks","the alkene rearranges"],correct:1,explain:"Step 1: Peroxides initiate a radical mechanism. ROOR splits homolytically into 2 RO•, which abstracts H from HBr to make Br•. Step 2: Br• adds to the alkene FIRST. It chooses the LESS substituted carbon (where its addition generates the more stable radical on the other C — the more substituted one). Step 3: The resulting carbon radical then abstracts H from another HBr → product has H on the more substituted C and Br on the less substituted C → ANTI-Markovnikov. This is why peroxides reverse the regiochemistry of HBr addition."},
{q:"Why is hydroboration anti-Markovnikov?",opts:["because it goes through a carbocation","BH₃ adds in a single concerted step where boron prefers the less hindered carbon (sterics, not electronics)","the boron is more electronegative","H₂O₂ scrambles the position"],correct:1,explain:"Step 1: BH₃ adds to alkenes in a SINGLE concerted step (no carbocation). The H and B both add to the same face simultaneously. Step 2: Boron is less electronegative than H, so the polarity is δ⁻H–Bδ⁺. The δ+ B prefers to bond to the alkene carbon where it experiences LESS steric crowding — that\'s the less substituted carbon. The δ−H ends up on the more substituted C. Step 3: After H₂O₂/NaOH, the C-B bond is replaced by C-OH with retention of stereochemistry — so OH ends up where B was, on the LESS substituted carbon → anti-Markovnikov. The whole mechanism is concerted and steric, not cationic."},
{q:"Why does ortho/para attack on an –OCH₃ benzene give a more stable intermediate than meta attack?",opts:["it doesn\'t","the OCH₃ group can donate its lone pair through resonance to stabilize the positive charge ONLY when it\'s ortho or para to the new bond","sterics","entropy"],correct:1,explain:"Step 1: When the electrophile attacks, the arenium ion has a positive charge delocalized over carbons ortho and para to the attack site. Step 2: If –OCH₃ is at the ortho or para position relative to the attack, then OCH₃ ends up directly adjacent to a positively charged carbon in one of the resonance structures. The O lone pair can donate into the empty orbital → extra stabilization (an additional resonance structure with full octets and the + charge moved onto O). Step 3: If –OCH₃ is at the meta position relative to attack, the positive charge never reaches a carbon adjacent to the O → no extra stabilization. So o/p attack gives a more stable intermediate → faster reaction → o/p directing."},
{q:"In the mechanism of acid-catalyzed hydration of an alkene, the proton transfer to water happens:",opts:["at the start","after the carbocation is attacked by water","never","simultaneously with the C-O bond formation"],correct:1,explain:"Step 1: Mechanism step 1: H⁺ adds to the alkene to form a carbocation (Markovnikov: more stable cation). Step 2: Step 2: water attacks the cation as a nucleophile. Now you have R-OH₂⁺ (a protonated alcohol). Step 3: Step 3: another water molecule deprotonates R-OH₂⁺ → neutral R-OH alcohol. The proton transfer to water happens AFTER the cation has been attacked, regenerating the H⁺ catalyst (so it\'s catalytic, not consumed). The mechanism is reversible; high water concentration drives it forward toward alcohol."},
{q:"Why does an acetylide ion act as a nucleophile in alkylation reactions?",opts:["it has a lone pair and a negative charge on a carbon","it\'s electrophilic","carbons are always nucleophilic","it has hydrogen bonds"],correct:0,explain:"Step 1: An acetylide is RC≡C⁻ — the negative charge is on a carbon with a lone pair. Step 2: That lone pair sits in an sp orbital, which is held tightly to the nucleus due to the high s-character (50%). It\'s available for forming new bonds. Step 3: When you add an alkyl halide (R\'-X), the acetylide\'s lone pair attacks the C bearing the leaving group via SN2 → new C–C bond forms. Carbon nucleophiles are rare in undergrad orgo (compared to the dozens of N, O, S nucleophiles), which is why acetylide alkylation is so prized — it\'s one of the few ways to build new C–C bonds at this level."},
{q:"In E1, the second step is:",opts:["proton transfer to form the alcohol","the base removes a β-hydrogen","attack on the cation by the leaving group","ring closure"],correct:1,explain:"Step 1: E1 is two-step: ionization of the C-LG bond (slow), then loss of a β-H (fast). Step 2: The first step is the same as SN1 — the leaving group leaves to form a carbocation. Step 3: In the second step, instead of a nucleophile attacking the cation (SN1), a base removes a hydrogen from a carbon ADJACENT (β) to the cation. The electrons from the C-H bond become the new π bond → alkene product. The base in E1 is usually a weak one (often the solvent itself)."},
{q:"Why does benzene undergo substitution instead of addition with Br₂/FeBr₃?",opts:["benzene is too unreactive for addition","addition would destroy aromaticity (~36 kcal/mol of stability), substitution preserves it","Br₂ is too small","FeBr₃ blocks addition"],correct:1,explain:"Step 1: An alkene + Br₂ gives 1,2-dibromide (addition). For benzene, that would mean breaking one of its 'double bonds' — but that destroys the cyclic 6-electron π system that makes benzene aromatic. Step 2: Aromaticity is worth ~36 kcal/mol of stability — losing it costs too much energy. Step 3: Substitution preserves aromaticity: a single H is replaced with Br, and the ring keeps all 6 π electrons. So benzene reluctantly forms an arenium ion intermediate (temporarily non-aromatic), then loses H⁺ to restore the aromatic ring with a new substituent. Net result: H replaced by Br, ring stays aromatic."},
{q:"Why is a tertiary carbocation more stable than a primary one?",opts:["3° has more atoms","hyperconjugation and inductive donation from adjacent C-H/C-C bonds stabilize the cation","3° cations have lone pairs","they are equally stable"],correct:1,explain:"Step 1: A carbocation has an empty p-orbital — electron-deficient. Anything that donates electron density into that p-orbital stabilizes it. Step 2: Hyperconjugation: σ electrons in adjacent C-H (or C-C) bonds can donate into the empty p-orbital (the orbitals overlap when properly aligned). More adjacent C-H bonds = more donations possible. Step 3: A tertiary cation has 3 alkyl groups directly attached, contributing many C-H bonds for hyperconjugation, plus inductive electron donation from those alkyl groups. A primary cation has only 1 alkyl group → much less stabilization. The order: 3° > 2° > 1° > methyl."},
{q:"What\'s the role of AlCl₃ in Friedel-Crafts alkylation?",opts:["a solvent","a Lewis acid that helps generate the alkyl cation electrophile","a base","a reducing agent"],correct:1,explain:"Step 1: AlCl₃ has an empty orbital on Al — it\'s a Lewis acid. Step 2: When R-Cl meets AlCl₃, the Al accepts a lone pair from the Cl, forming an R-Cl-AlCl₃ complex. The C-Cl bond is now very polarized — essentially the chloride leaves with AlCl₃ as AlCl₄⁻, generating R⁺ (the alkyl cation). Step 3: The alkyl cation is the actual electrophile that attacks the benzene ring. Without AlCl₃, R-Cl alone is far too unreactive for benzene to attack. After substitution, AlCl₃ is regenerated → catalytic role."}
]},



midterm:{title:"🎯 Midterm Practice Exam (40 Questions)",lead:"Comprehensive midterm covering Modules 1-9. Each question has a step-by-step worked solution. Designed to mimic real exam difficulty.",
body:`<div class="exam-mode"><b>📋 Exam mode:</b> Try to complete this without looking at notes. Aim for 80%+ before sitting your real midterm. Take your time on each question — read every walkthrough.</div>`,
quiz:[
{q:"What is the hybridization of the central atom in BF₃?",opts:["sp³","sp²","sp","sp³d"],correct:1,explain:"Step 1: Count electron groups on B. BF₃ has 3 single bonds and no lone pairs (boron is electron-deficient with only 6 valence electrons total). Step 2: 3 electron groups → sp² → trigonal planar geometry, 120° angles. Step 3: This makes BF₃ a Lewis acid because boron has an empty p-orbital perpendicular to the plane."},
{q:"Calculate the degree of unsaturation for C₇H₁₂O.",opts:["1","2","3","4"],correct:1,explain:"Step 1: For DoU, oxygen doesn\'t affect the count. DoU = (2C+2−H)/2 = (14+2−12)/2 = 4/2 = 2. Step 2: 2 degrees of unsaturation could be: 2 rings, 2 double bonds, 1 ring + 1 double bond, or 1 triple bond. Step 3: Common matches with O included: cyclohexanone (1 ring + 1 C=O = 2 DoU). ✓"},
{q:"Which molecule has a NET dipole moment?",opts:["CCl₄","BF₃","CH₃Cl","CO₂"],correct:2,explain:"Step 1: Check each for symmetry. CCl₄ tetrahedral, all four C-Cl identical → dipoles cancel. BF₃ trigonal planar → cancel. CO₂ linear (O=C=O) → cancel. Step 2: CH₃Cl is tetrahedral but has 3 H + 1 Cl — not symmetric. Step 3: The C-Cl dipole is strong and not opposed by anything equivalent → net dipole exists. CH₃Cl has a notable dipole moment (~1.9 D)."},
{q:"What is the IUPAC name for (CH₃)₂CHCH₂CH(CH₃)CH₂CH₃?",opts:["2,4-dimethylpentane","2,4-dimethylhexane","3,5-dimethylhexane","2-methyl-4-ethylpentane"],correct:1,explain:"Step 1: Find the longest chain. Drawing it out: 6 carbons in a row → hexane. Step 2: Number from the end giving lowest locants: methyls are on C2 and C4 (from one end) or C3 and C5 (from the other). Lowest set is 2,4. Step 3: Two methyl substituents at positions 2 and 4 → 2,4-dimethylhexane."},
{q:"How many primary, secondary, tertiary, and quaternary carbons are in 2,2,4-trimethylpentane?",opts:["4 primary, 1 secondary, 1 tertiary, 1 quaternary","5 primary, 1 secondary, 1 tertiary, 1 quaternary","5 primary, 2 secondary, 0 tertiary, 1 quaternary","3 primary, 2 secondary, 2 tertiary, 0 quaternary"],correct:1,explain:"Step 1: Draw the structure: (CH₃)₃C-CH₂-CH(CH₃)-CH₃. Step 2: Count terminal CH₃ groups: 3 on C2 + 1 on C4 + 1 (terminal C5) = 5 primary. Step 3: C2 is bonded to 4 carbons → quaternary. C3 is CH₂ bonded to 2 carbons → secondary. C4 has 3 carbons attached + 1 H → tertiary. So: 5 primary, 1 secondary, 1 tertiary, 1 quaternary."},
{q:"In CIP priority rules, which group has the HIGHEST priority?",opts:["–CH₂CH₃","–CH(CH₃)₂","–CH₂Br","–CH₂OH"],correct:2,explain:"Step 1: All start with C, so look at second-shell atoms. Step 2: -CH₂CH₃: (C,H,H). -CH(CH₃)₂: (C,C,H). -CH₂Br: (Br,H,H). -CH₂OH: (O,H,H). Step 3: Compare highest atom of each: Br(35) > O(8) > C(6) > C(6). Br wins immediately. -CH₂Br is the highest."},
{q:"How many stereocenters does 2-methyl-3-bromobutane have?",opts:["0","1","2","3"],correct:1,explain:"Step 1: Draw it: CH₃-CH(CH₃)-CHBr-CH₃. Step 2: Check each carbon. C2: bonded to two CH₃ groups + H + C3 → not 4 different (two methyls are same) → not a stereocenter. C3: bonded to Br, H, CHMe₂ side, and CH₃ → 4 different groups → stereocenter. Step 3: Only one stereocenter (C3)."},
{q:"What is the relationship between (2R,3S)-2,3-dibromobutane and (2S,3R)-2,3-dibromobutane?",opts:["enantiomers","diastereomers","identical (both meso)","constitutional isomers"],correct:2,explain:"Step 1: 2,3-dibromobutane has internal symmetry (the two halves of the molecule are identical CHBrCH₃ groups). Step 2: The (2R,3S) form has an internal mirror plane → meso compound. Step 3: When you draw (2S,3R), it turns out to be the same molecule as (2R,3S) just rotated — both are the same meso form. They are identical, not enantiomers. The other stereoisomers are (2R,3R) and (2S,3S) — those two are enantiomers of each other."},
{q:"In a Newman projection of butane along C2-C3, which conformation is HIGHEST in energy?",opts:["anti","gauche","eclipsed (methyl with H)","fully eclipsed (methyl with methyl, 0°)"],correct:3,explain:"Step 1: Energy ranking: anti < gauche < eclipsed < fully eclipsed. Step 2: At 0° (fully eclipsed/syn-periplanar), the two methyls directly overlap — maximum steric AND torsional strain. Step 3: This is the highest point on the rotational energy graph. Each conformation along the rotation alternates between minima (staggered) and maxima (eclipsed)."},
{q:"In the most stable chair of trans-1,2-dimethylcyclohexane, the methyls are:",opts:["both axial","both equatorial","one axial, one equatorial","they don\'t fit on a chair"],correct:1,explain:"Step 1: Trans-1,2 = substituents on opposite faces of adjacent ring carbons. Step 2: On a chair, trans-1,2 has two possible chairs: BOTH equatorial OR BOTH axial. Step 3: Both equatorial is much more stable (no diaxial strain). So trans-1,2-dimethylcyclohexane lives in the both-equatorial chair. Cis-1,2 would force one of each — different from trans."},
{q:"Cis-4-tert-butyl-1-methylcyclohexane: which substituent is axial?",opts:["t-Bu","methyl","both axial","both equatorial"],correct:1,explain:"Step 1: Tert-butyl is so bulky it ALWAYS occupies equatorial — locks the chair. Step 2: Determine cis-1,4 geometry: substituents on the same face of the ring. On a chair, cis-1,4 forces one axial and one equatorial (unlike trans-1,4 which can have both equatorial). Step 3: With t-Bu equatorial (locked), the cis-1,4 methyl is forced axial. So methyl is axial, t-Bu is equatorial."},
{q:"2-methylpropene + HBr (no peroxides) gives:",opts:["1-bromo-2-methylpropane","2-bromo-2-methylpropane","2-bromobutane","both equally"],correct:1,explain:"Step 1: (CH₃)₂C=CH₂ has a 3° alkene C and a 1° alkene C. Step 2: Markovnikov: H to the C with more H\'s (CH₂), Br to the more substituted C. Mechanistically, this goes through the more stable 3° cation. Step 3: Br ends up on the C with two methyls → (CH₃)₃C-Br = 2-bromo-2-methylpropane (tert-butyl bromide). ✓"},
{q:"Cyclohexene + Br₂ in CH₂Cl₂ gives:",opts:["cis-1,2-dibromocyclohexane","trans-1,2-dibromocyclohexane","1,1-dibromocyclohexane","1,2,3,4-tetrabromocyclohexane"],correct:1,explain:"Step 1: Mechanism: Br₂ forms a bromonium ion across one face of the C=C. Step 2: Br⁻ attacks from the OPPOSITE face (backside) at one of the ring carbons. Step 3: The two Brs end up on opposite faces → trans (anti) addition. Anti addition is the universal stereochemistry for halogenation of alkenes."},
{q:"Which reagent gives anti-Markovnikov hydration of an alkene?",opts:["H₂O/H₂SO₄","Hg(OAc)₂/H₂O then NaBH₄","BH₃·THF then H₂O₂/NaOH","HCl"],correct:2,explain:"Step 1: Hydroboration-oxidation (BH₃ then H₂O₂/OH⁻) puts B (then OH) on the LESS substituted alkene carbon for steric reasons. Step 2: That\'s anti-Markovnikov: OH on the less substituted C, H on the more substituted C. Step 3: Both H₂O/H₂SO₄ and oxymercuration are Markovnikov (OH on more substituted C). HCl adds H and Cl, not OH."},
{q:"Ozonolysis (O₃ then Zn/H₃O⁺) of 2-methyl-2-butene gives:",opts:["acetone + acetaldehyde","acetone + propanal","2 acetones","propanal + acetaldehyde"],correct:0,explain:"Step 1: Identify: 2-methyl-2-butene = (CH₃)₂C=CHCH₃. Step 2: Ozonolysis cleaves C=C and replaces it with two C=O. The (CH₃)₂C= side has no H on the alkene C → ketone (acetone). Step 3: The =CHCH₃ side has an H → aldehyde (acetaldehyde). Two products: acetone + acetaldehyde."},
{q:"OsO₄ then NaHSO₃ on cyclopentene gives:",opts:["cis-1,2-cyclopentanediol","trans-1,2-cyclopentanediol","cyclopentanone","cyclopentanol"],correct:0,explain:"Step 1: OsO₄ does syn dihydroxylation — both OH groups add to the SAME face of the alkene through a cyclic osmate ester intermediate. Step 2: NaHSO₃ hydrolyzes the osmate ester to release the diol. Step 3: Same-face addition means the two OHs are cis to each other → cis-1,2-cyclopentanediol."},
{q:"Hydrogenation of but-2-yne with H₂ over Lindlar catalyst gives:",opts:["butane","cis-2-butene","trans-2-butene","1-butene"],correct:1,explain:"Step 1: Lindlar = Pd poisoned with Pb, on CaCO₃. Reduces alkynes via syn H₂ addition but stops at the alkene. Step 2: Syn addition = both H atoms added to the same face of the alkyne. Step 3: This produces the cis (Z) alkene. So 2-butyne → cis-2-butene. (For trans-2-butene, you would use Na or Li in liquid NH₃ instead.)"},
{q:"To convert 1-butyne to 2-butanone, use:",opts:["BH₃ then H₂O₂","H₂O/H₂SO₄/HgSO₄","Lindlar then H₂O","O₃ then Zn"],correct:1,explain:"Step 1: Markovnikov hydration of a terminal alkyne gives a methyl ketone. Step 2: Mechanism: H₂O adds Markovnikov (OH on the more substituted internal C), giving an enol. The enol tautomerizes to the more stable keto form. Step 3: 1-butyne → enol → 2-butanone (CH₃COCH₂CH₃). Note: BH₃ is anti-Markovnikov and would give an aldehyde instead."},
{q:"NaNH₂ + 1-butyne, then methyl iodide, gives:",opts:["1-pentyne","2-pentyne","2-methyl-1-butyne","ethane"],correct:1,explain:"Step 1: NaNH₂ deprotonates the terminal alkyne (acetylide formation). Step 2: The acetylide CH₃CH₂C≡C⁻ attacks methyl iodide via SN2 (methyl is the perfect substrate for SN2). Step 3: New C-C bond forms: CH₃CH₂C≡C-CH₃ = 2-pentyne. The methyl group adds to the terminal carbon of the original alkyne."},
{q:"Which is more acidic: a terminal alkyne (pKa ~25) or water (pKa ~16)?",opts:["alkyne","water","they are equal","cannot compare"],correct:1,explain:"Step 1: Lower pKa = more acidic. Water pKa is 16. Terminal alkyne pKa is ~25. Step 2: 16 < 25, so water is more acidic. Step 3: This is why NaOH (conjugate base of water) cannot deprotonate terminal alkynes — the equilibrium favors the alkyne, not the acetylide. NaNH₂ (conjugate base of NH₃, pKa 35) is required because 35 > 25."},
