welcome:`<div class="welcome"><h2>Master Organic Chemistry I</h2><p style="color:var(--muted);font-size:1.1em;max-width:600px;margin:0 auto">A complete interactive course built from CHEM 350 materials. Every concept explained intuitively, every topic backed by practice questions, every exam simulated.</p>

m1:{title:"Structure & Bonding",lead:"Atoms, orbitals, hybridization, polarity — the foundation everything else rests on.",
body:`<h3>Why this module matters</h3><p>Every reaction you'll learn comes back to electrons: where they are, where they want to go, and how strongly atoms hold them. If you understand bonding deeply, mechanisms stop being memorization and start feeling inevitable.</p>
<h3>1. Atomic orbitals — the rooms electrons live in</h3><p>Electrons don't orbit the nucleus like planets. They occupy <b>orbitals</b> — 3D regions of probability. The ones that matter for organic chemistry are <b>s</b> (spherical) and <b>p</b> (dumbbell-shaped, three of them: pₓ, pᵧ, p_z).</p><p>Carbon's ground state has 2 electrons in 1s, 2 in 2s, and 2 in 2p (one each in two of the three p orbitals). That would predict carbon makes only 2 bonds. But carbon makes 4. Why? <b>Hybridization.</b></p>
<h3>2. Hybridization — mixing orbitals to make better bonds</h3><div class="concept"><div class="concept-title">The 30-second rule</div>Count electron groups (bonds + lone pairs) on the atom. A double or triple bond counts as ONE group.<ul><li><b>4 groups → sp³</b> (tetrahedral, 109.5°)</li><li><b>3 groups → sp²</b> (trigonal planar, 120°), one unhybridized p orbital left over for π bonding</li><li><b>2 groups → sp</b> (linear, 180°), two unhybridized p orbitals for two π bonds</li></ul></div>
<div class="example"><b>Worked example — methane (CH₄):</b> Carbon has 4 bonds, no lone pairs → 4 groups → sp³ → tetrahedral, 109.5° angles.<br><br><b>Worked example — formaldehyde (H₂C=O):</b> The carbon has 2 single bonds (to H) + 1 double bond (to O) = 3 groups → sp² → trigonal planar. The oxygen has 1 double bond + 2 lone pairs = 3 groups → also sp².<br><br><b>Worked example — HC≡N:</b> The carbon has 1 single bond (to H) + 1 triple bond (to N) = 2 groups → sp → linear, 180°.</div>
<h3>3. Sigma vs pi bonds</h3><p>A <b>sigma (σ) bond</b> is end-on overlap — strong, free to rotate. A <b>pi (π) bond</b> is side-by-side overlap of p orbitals — weaker, locks rotation. A double bond = 1 σ + 1 π. A triple bond = 1 σ + 2 π. This is why alkenes have cis/trans isomers (no rotation) but alkanes don't.</p>
<h3>4. Electronegativity & polarity</h3><p>Electronegativity is how strongly an atom pulls bonding electrons toward itself. Trend: <b>F > O > N > Cl > Br > C ≈ H</b>. When two atoms with different electronegativities bond, the bond is polar — the more electronegative atom gets a partial negative charge (δ⁻), the other gets δ⁺.</p>
<div class="concept"><b>Molecule has a dipole moment if BOTH:</b><br>(a) it has polar bonds, AND<br>(b) those bond dipoles don't cancel by symmetry.</div>
<div class="example"><b>CH₄:</b> Polar C–H bonds, but tetrahedral symmetry → all four dipoles cancel → no net dipole.<br><b>H₂O:</b> Polar O–H bonds, bent shape → dipoles add → strong net dipole.<br><b>CO₂:</b> Polar C=O bonds, but linear → the two dipoles point opposite ways → cancel → no net dipole.<br><b>CH₃Cl:</b> One polar C–Cl bond, no symmetry to cancel it → net dipole.</div>
<h3>5. Degree of unsaturation</h3><div class="concept"><b>DoU = (2C + 2 + N − H − X) / 2</b><br>Each unit = one ring OR one π bond.</div>
<div class="example"><b>C₆H₁₂:</b> (12+2−12)/2 = 1 → one ring or one double bond. Could be cyclohexane OR hexene.<br><b>C₆H₆ (benzene):</b> (12+2−6)/2 = 4 → 1 ring + 3 double bonds. ✓<br><b>C₈H₁₅N:</b> (16+2+1−15)/2 = 2 → two degrees of unsaturation.</div>`,
quiz:[
{q:"What is the hybridization of the carbon in CO₂?",opts:["sp³","sp²","sp","sp³d"],correct:2,explain:"Step 1: Count groups on C. CO₂ is O=C=O, so C has two double bonds = 2 electron groups. Step 2: 2 groups → sp hybridization → linear, 180°. Each C=O is 1σ + 1π, so C uses 2 sp orbitals for the σ bonds and its 2 leftover p orbitals for the two π bonds."},
{q:"In allene, CH₂=C=CH₂, the central carbon is:",opts:["sp³","sp²","sp","not hybridized"],correct:2,explain:"The central C has two double bonds and nothing else = 2 electron groups → sp. Cool consequence: the two CH₂ groups end up in perpendicular planes because the central sp carbon's two p orbitals are perpendicular to each other."},
{q:"How many σ and π bonds are in HC≡C–CH=CH₂?",opts:["7 σ, 2 π","8 σ, 3 π","9 σ, 2 π","7 σ, 3 π"],correct:3,explain:"Count every single bond as 1σ. The triple bond = 1σ+2π. The double bond = 1σ+1π. Single bonds: 4 C–H + 1 C–C (between alkyne and alkene) = 5σ. Triple bond: 1σ+2π. Double bond: 1σ+1π. Total: 5+1+1=7σ and 2+1=3π."},
{q:"Which has NO net dipole moment?",opts:["H₂O","NH₃","CCl₄","CH₂Cl₂"],correct:2,explain:"CCl₄ is tetrahedral with 4 identical C–Cl bonds — perfectly symmetric, dipoles cancel. H₂O is bent (dipole). NH₃ is pyramidal (dipole). CH₂Cl₂ is tetrahedral but the substituents aren't all the same, so dipoles don't cancel."},
{q:"Calculate the degree of unsaturation for C₅H₈.",opts:["1","2","3","4"],correct:1,explain:"DoU = (2(5)+2−8)/2 = (10+2−8)/2 = 4/2 = 2. Could be: 2 double bonds (pentadiene), 1 triple bond (pentyne), 1 ring + 1 double bond (cyclopentene), or 2 rings."},
{q:"In the molecule CH₃–CH=CH–C≡N, what is the hybridization of carbons 1, 2, 3, 4 (left to right)?",opts:["sp³, sp², sp², sp","sp³, sp³, sp², sp","sp², sp², sp, sp","sp³, sp², sp², sp²"],correct:0,explain:"C1 (CH₃): 4 single bonds → sp³. C2 (CH=): part of double bond, 3 groups → sp². C3 (=CH): part of double bond, 3 groups → sp². C4 (≡N): part of triple bond, 2 groups → sp."},
{q:"Which bond is most polar?",opts:["C–H","C–N","C–O","C–F"],correct:3,explain:"Electronegativity difference is the key. F is the most electronegative element, so C–F has the largest electronegativity gap → most polar bond."},
{q:"A π bond is formed by:",opts:["end-on overlap of s orbitals","end-on overlap of sp orbitals","side-by-side overlap of p orbitals","overlap of d orbitals"],correct:2,explain:"σ bonds form by direct head-on overlap (strong, allows rotation). π bonds form by side-by-side (parallel) overlap of unhybridized p orbitals — weaker, and they lock the bond from rotating. This is why alkenes have cis/trans isomers."},
{q:"How many lone pairs does the nitrogen in NH₃ have, and what's its hybridization?",opts:["0 lone pairs, sp²","1 lone pair, sp³","2 lone pairs, sp","1 lone pair, sp²"],correct:1,explain:"Nitrogen has 5 valence electrons. 3 form bonds to H, leaving 2 = 1 lone pair. Total electron groups: 3 bonds + 1 lone pair = 4 → sp³. The lone pair occupies one sp³ orbital, giving NH₃ its pyramidal shape (not flat)."},
{q:"What is the molecular formula of a hydrocarbon with 8 carbons, 2 rings, and 1 triple bond?",opts:["C₈H₁₂","C₈H₁₀","C₈H₁₄","C₈H₈"],correct:1,explain:"Saturated C₈ alkane = C₈H₁₈ (formula 2n+2). Each ring removes 2H, each π bond removes 2H. 2 rings = −4H, 1 triple bond = 2 π bonds = −4H. Total: 18−4−4 = 10H. Answer: C₈H₁₀. Verify with DoU: (16+2−10)/2 = 4 = 2 rings + 2 π. ✓"}
]},

m2:{title:"Functional Groups",lead:"The vocabulary of organic chemistry. Recognize these on sight — they tell you what a molecule will DO.",
body:`<h3>Why functional groups are everything</h3><p>A 30-carbon molecule with one –OH behaves chemically almost identically to a 5-carbon molecule with one –OH. The carbon skeleton is mostly inert; the <b>functional group</b> is where the action happens. Learn these and you can predict reactivity for thousands of molecules from a handful of patterns.</p>
<h3>The hydrocarbon families</h3><table><tr><th>Family</th><th>Feature</th><th>Example</th></tr>
<tr><td>Alkane</td><td>only C–C and C–H single bonds</td><td>ethane, CH₃CH₃</td></tr>
<tr><td>Alkene</td><td>C=C double bond</td><td>ethylene, CH₂=CH₂</td></tr>
<tr><td>Alkyne</td><td>C≡C triple bond</td><td>acetylene, HC≡CH</td></tr>
<tr><td>Aromatic (arene)</td><td>benzene ring</td><td>toluene, C₆H₅CH₃</td></tr></table>
<h3>Oxygen-containing groups</h3><table><tr><th>Group</th><th>Pattern</th><th>Key feature</th></tr>
<tr><td>Alcohol</td><td>R–OH</td><td>OH on sp³ carbon</td></tr>
<tr><td>Phenol</td><td>Ar–OH</td><td>OH directly on benzene ring</td></tr>
<tr><td>Ether</td><td>R–O–R</td><td>O between two carbons</td></tr>
<tr><td>Aldehyde</td><td>R–CHO</td><td>C=O at END of chain (always has H on C=O)</td></tr>
<tr><td>Ketone</td><td>R–CO–R</td><td>C=O in MIDDLE of chain</td></tr>
<tr><td>Carboxylic acid</td><td>R–COOH</td><td>C=O and OH on same carbon</td></tr>
<tr><td>Ester</td><td>R–COO–R</td><td>like acid but OH replaced by OR</td></tr></table>
<div class="tip">⭐ <b>Aldehyde vs ketone trick:</b> Aldehyde always has at least one H on the carbonyl carbon. Ketone has zero H's on the carbonyl carbon (only carbons). That's the only difference.</div>
<h3>Nitrogen-containing groups</h3><table><tr><th>Group</th><th>Pattern</th><th>Example</th></tr>
<tr><td>Amine (1°)</td><td>R–NH₂</td><td>methylamine</td></tr>
<tr><td>Amine (2°)</td><td>R₂NH</td><td>dimethylamine</td></tr>
<tr><td>Amine (3°)</td><td>R₃N</td><td>trimethylamine</td></tr>
<tr><td>Amide</td><td>R–CO–NR₂</td><td>like ester but N instead of O</td></tr>
<tr><td>Nitrile</td><td>R–C≡N</td><td>acetonitrile, CH₃CN</td></tr>
<tr><td>Nitro</td><td>R–NO₂</td><td>nitromethane</td></tr></table>
<h3>How to identify groups in complex molecules</h3><div class="example"><b>Example:</b> Aspirin contains a benzene ring (aromatic), a –COOH (carboxylic acid), and an –O–CO–CH₃ (ester). Three functional groups, one molecule. When you see a complex structure, scan for each pattern separately — don't try to take it in all at once.</div>
<div class="example"><b>Example:</b> The amino acid alanine, CH₃–CH(NH₂)–COOH, contains an amine (–NH₂) AND a carboxylic acid (–COOH). The combination is what makes it an amino acid.</div>
<h3>Why C=O is the most important functional group</h3><p>The carbonyl group (C=O) shows up in aldehydes, ketones, carboxylic acids, esters, and amides. The oxygen pulls electrons toward itself, making the carbon δ⁺ (electrophilic) and the oxygen δ⁻ (nucleophilic). Roughly half of all the reactions you'll learn in Orgo II involve carbonyls.</p>`,
quiz:[
{q:"Which functional group is in CH₃CH₂CHO?",opts:["ketone","aldehyde","carboxylic acid","ester"],correct:1,explain:"The 'CHO' notation means C=O with an H on the carbonyl carbon. C=O at the end of the chain + H on it = aldehyde (specifically, propanal). If it were CH₃COCH₃, that would be a ketone."},
{q:"How many functional groups are in acetic acid (CH₃COOH)?",opts:["1 (carboxylic acid)","2 (ketone + alcohol)","2 (aldehyde + alcohol)","3"],correct:0,explain:"Trick question. The –COOH looks like C=O + OH separately, but together on the SAME carbon they form ONE functional group: a carboxylic acid. The two parts behave as one unit chemically."},
{q:"What functional groups are in acetaminophen (paracetamol)? It contains a benzene ring with –OH and –NH–CO–CH₃.",opts:["aromatic, alcohol, ketone","aromatic, phenol, amide","aromatic, ether, amine","aromatic, alcohol, amine"],correct:1,explain:"Benzene ring = aromatic. OH directly on the ring = phenol (not a regular alcohol — they behave differently). The –NH–C(=O)–CH₃ piece is an amide (C=O bonded to N). So: aromatic + phenol + amide."},
{q:"Which compound is a tertiary (3°) amine?",opts:["CH₃NH₂","(CH₃)₂NH","(CH₃)₃N","CH₃CONH₂"],correct:2,explain:"Amine classification = count carbons attached to N. (CH₃)₃N has 3 carbons on N → 3° amine. (CH₃)₂NH = 2°. CH₃NH₂ = 1°. CH₃CONH₂ is an amide, not an amine (the C=O changes its chemistry)."},
{q:"A molecule has the structure CH₃–CH₂–O–CH₂–CH₃. It is a(n):",opts:["alcohol","ether","ester","ketone"],correct:1,explain:"Pattern R–O–R (oxygen between two alkyl groups) = ether. This is diethyl ether, the classic anesthetic. No OH means it's not an alcohol. No C=O means it's not an ester or ketone."},
{q:"Which functional group is responsible for the C≡N triple bond in CH₃CN?",opts:["amine","amide","nitrile","nitro"],correct:2,explain:"C≡N (carbon triple-bonded to nitrogen) = nitrile. Don't confuse with: amine (C–N single bond, no C=O), amide (C=O bonded to N), or nitro (N bonded to two O's, –NO₂)."},
{q:"Methyl benzoate, C₆H₅–CO–O–CH₃, contains which functional groups?",opts:["aromatic and aldehyde","aromatic and ester","aromatic and ether","aromatic and ketone"],correct:1,explain:"C₆H₅ = benzene ring (aromatic). The –CO–O–CH₃ piece is the giveaway: C=O bonded to O bonded to C is the definition of an ester. If it were C=O bonded to C on both sides, it'd be a ketone."},
{q:"Which of these can hydrogen-bond as a DONOR (has H on O or N)?",opts:["CH₃OCH₃","CH₃COCH₃","CH₃CH₂OH","CH₃CN"],correct:2,explain:"H-bond donor = a molecule with H attached to O, N, or F. Ethanol (CH₃CH₂OH) has H–O. Dimethyl ether has no O–H. Acetone has no O–H. Acetonitrile has no N–H. Only ethanol can donate. (All of them except CH₃CN can ACCEPT H-bonds, but only ethanol can donate.)"},
{q:"What's the difference between an aldehyde and a ketone?",opts:["Aldehydes have OH; ketones don't","Aldehydes have C=O at the chain end with at least one H on it; ketones have C=O between two carbons","Aldehydes contain N; ketones don't","Aldehydes are aromatic; ketones aren't"],correct:1,explain:"The ONLY structural difference: in an aldehyde, the carbonyl carbon has at least one H attached (R–CHO). In a ketone, the carbonyl carbon is bonded to two other carbons and zero H's (R–CO–R'). Same C=O, different position in the molecule."},
{q:"The compound HOCH₂CH₂CH₂COOH contains:",opts:["two alcohols","one alcohol and one ester","one alcohol and one carboxylic acid","one ether and one carboxylic acid"],correct:2,explain:"Walk through the structure. HO–CH₂– is an alcohol (OH on a regular sp³ C). The other end, –COOH, is a carboxylic acid (C=O and OH on same C). So one alcohol + one carboxylic acid. This is 4-hydroxybutanoic acid."}
]},

m3:{title:"Alkanes & Nomenclature",lead:"Naming molecules systematically. Once you know the algorithm, every molecule has exactly one correct name.",
body:`<h3>Why nomenclature matters</h3><p>IUPAC names are the universal language of chemistry. A name tells you the structure unambiguously and vice versa. Every exam will test it, and once you internalize the algorithm it becomes automatic.</p>
<h3>The IUPAC algorithm (memorize this)</h3><div class="concept"><ol><li><b>Find the longest continuous carbon chain</b> containing the principal functional group. This is your parent name.</li><li><b>Number the chain</b> from the end that gives the principal functional group the lowest possible locant. If no functional group, give substituents the lowest locants.</li><li><b>Identify substituents</b> (branches) and their positions.</li><li><b>Name substituents alphabetically</b> as prefixes (ignore di-, tri-, tetra- when alphabetizing).</li><li><b>Combine</b>: locants-prefixes-parent-suffix.</li></ol></div>
<h3>Parent chain names</h3><table><tr><th>Carbons</th><th>Name</th></tr><tr><td>1</td><td>methane</td></tr><tr><td>2</td><td>ethane</td></tr><tr><td>3</td><td>propane</td></tr><tr><td>4</td><td>butane</td></tr><tr><td>5</td><td>pentane</td></tr><tr><td>6</td><td>hexane</td></tr><tr><td>7</td><td>heptane</td></tr><tr><td>8</td><td>octane</td></tr><tr><td>9</td><td>nonane</td></tr><tr><td>10</td><td>decane</td></tr></table>
<h3>Common substituents</h3><ul><li>methyl (–CH₃), ethyl (–C₂H₅), propyl (–C₃H₇)</li><li>isopropyl = (CH₃)₂CH– (3 carbons, branched)</li><li>tert-butyl = (CH₃)₃C– (4 carbons, fully branched)</li><li>halogens: fluoro, chloro, bromo, iodo</li></ul>
<div class="example"><b>Worked example 1:</b> Name CH₃CH(CH₃)CH₂CH₂CH₃.<br>Step 1: Longest chain = 5 carbons (pentane).<br>Step 2: Number from the end closer to the methyl branch → methyl on C2.<br>Step 3: Name = <b>2-methylpentane</b>.</div>
<div class="example"><b>Worked example 2:</b> Name (CH₃)₃CCH₂CH₃.<br>Longest chain = 4 carbons (butane). The C with three methyls is C2 of the butane chain (not the parent — it's branched off). Two methyls on C2. Name = <b>2,2-dimethylbutane</b>.</div>
<div class="example"><b>Worked example 3:</b> Name CH₃CH₂CH(Br)CH(CH₃)CH₂CH₃.<br>Longest chain = 6 (hexane). Number from the end giving lowest locants: from the right gives Br on C4, methyl on C3 (locants 3,4); from the left gives Br on C3, methyl on C4 (locants 3,4). Tie! Use alphabetical first point of difference: bromo comes before methyl, so bromo gets the lower number → number from the left. Name = <b>3-bromo-4-methylhexane</b>.</div>
<h3>Cycloalkanes</h3><p>Add "cyclo-" prefix. Number to give substituents the lowest locants. With one substituent, no number needed. With two or more, number to give the lowest set, alphabetizing for ties.</p>
<div class="example"><b>Example:</b> A cyclohexane with methyl on C1 and chloro on C3 = <b>1-chloro-3-methylcyclohexane</b> (alphabetical: chloro before methyl, and chloro gets C1 because it's first alphabetically when locants are tied).</div>
<h3>Carbon classification</h3><div class="concept">Count how many OTHER carbons each carbon is bonded to:<ul><li><b>Primary (1°):</b> bonded to 1 other C</li><li><b>Secondary (2°):</b> bonded to 2 other C's</li><li><b>Tertiary (3°):</b> bonded to 3 other C's</li><li><b>Quaternary (4°):</b> bonded to 4 other C's</li></ul>This matters because reactions often happen preferentially at one type — e.g., SN1 favors 3°, SN2 favors 1°.</div>`,
quiz:[
{q:"What is the IUPAC name for (CH₃)₂CHCH₂CH₂CH₃?",opts:["2-methylpentane","3-methylpentane","2-methylbutane","isohexane"],correct:0,explain:"Step 1: Find longest chain. Including the branched carbon: CH₃-CH(CH₃)-CH₂-CH₂-CH₃ → 5 carbons (pentane). Step 2: Number from the end closer to the methyl branch. The methyl is on C2. Step 3: Name = 2-methylpentane. 'Isohexane' is a common name, not IUPAC."},
{q:"Name CH₃CH₂C(CH₃)₂CH₂CH₃.",opts:["2,2-dimethylpentane","3,3-dimethylpentane","2,3-dimethylbutane","3-ethyl-3-methylbutane"],correct:1,explain:"Step 1: Longest chain = 5 carbons (pentane). The middle C has two methyls. Step 2: That central C is C3 whether you number from left or right (symmetric). Step 3: Two methyls on C3 → 3,3-dimethylpentane."},
{q:"How many primary carbons are in 2,2,4-trimethylpentane?",opts:["3","4","5","6"],correct:2,explain:"Draw it: (CH₃)₃C-CH₂-CH(CH₃)-CH₃. Count terminal CH₃ groups (each is primary): three on C2 + one at C5 + one branch off C4 = 5 primary carbons."},
{q:"Number the chain to get the lowest locants for: CH₃CH(Cl)CH₂CH(CH₃)CH₃.",opts:["2-chloro-4-methylpentane","4-chloro-2-methylpentane","2-chloro-2-methylbutane","both end numberings give same result"],correct:0,explain:"Longest chain = 5 carbons. Numbering from the chloro end: Cl on C2, methyl on C4 (locants 2,4). From the methyl end: methyl on C2, Cl on C4 (locants 2,4). Tie! At first point of difference (the lower locant), alphabetical wins: chloro comes before methyl, so chloro gets C2. Name = 2-chloro-4-methylpentane."},
{q:"Which of these is a quaternary carbon? In (CH₃)₃C-CH₂-CH₃, the central C of C(CH₃)₃ is bonded to:",opts:["1 other carbon (primary)","2 other carbons (secondary)","3 other carbons (tertiary)","4 other carbons (quaternary)"],correct:3,explain:"The central carbon of (CH₃)₃C- is bonded to three CH₃ groups + one CH₂ group = 4 other carbons total. By definition that's quaternary. Quaternary carbons have NO hydrogens attached."},
{q:"What's the IUPAC name for cyclohexane with one ethyl group?",opts:["1-ethylcyclohexane","ethylcyclohexane","cyclohexylethane","ethanocyclohexane"],correct:1,explain:"With only ONE substituent on a ring, no locant number is needed (it's understood to be C1). Just 'ethylcyclohexane'. The '1-' is redundant. (Unlike a chain, where you do need locants for unambiguity.)"},
{q:"Name a cyclopentane with chloro on C1 and methyl on C2 (cis or trans not asked).",opts:["1-chloro-2-methylcyclopentane","2-chloro-1-methylcyclopentane","1-methyl-2-chlorocyclopentane","methylchlorocyclopentane"],correct:0,explain:"Two rules: alphabetical order in the name (chloro before methyl), AND lowest locants. Both substituents are adjacent, so locants will be (1,2) either way. Alphabetical wins for which gets C1: chloro gets C1, methyl gets C2. Name written alphabetically: 1-chloro-2-methylcyclopentane."},
{q:"How many secondary carbons are in heptane (CH₃CH₂CH₂CH₂CH₂CH₂CH₃)?",opts:["3","4","5","7"],correct:2,explain:"In a straight chain CnH(2n+2), the two end carbons are primary and the middle ones are secondary. Heptane = 7 carbons total, 2 are primary (the ends), so 7 - 2 = 5 are secondary."},
{q:"What's wrong with the name '3-methylpentane' if the actual longest chain is 6 carbons?",opts:["nothing — it's correct","the parent should be hexane, not pentane","the locant should be 4","methyl should be ethyl"],correct:1,explain:"The cardinal sin of nomenclature: failing to identify the LONGEST continuous chain. If a 6-carbon chain exists, you must use hexane as the parent — not pentane with an extra branch. Always look for ALL possible chains and pick the longest one, even if it means going through a 'branch'."},
{q:"Name (CH₃)₂CHCH(CH₃)CH₂CH₃.",opts:["2,3-dimethylpentane","2,3-dimethylbutane","2-methyl-3-ethylbutane","3-methylpentane"],correct:0,explain:"Don't be fooled. The longest chain isn't obvious — you have to trace through. Start from one CH₃ of (CH₃)₂CH, go through both CH carbons, then through CH₂, then to the terminal CH₃. That's 5 carbons (pentane), with methyls on C2 and C3. Name: 2,3-dimethylpentane."}
]},

m4:{title:"Stereochemistry",lead:"R/S, enantiomers, diastereomers — the 3D part of organic chemistry. This is the heart of MCAT-level orgo.",
body:`<h3>Why stereochemistry matters</h3><p>Two molecules with identical connectivity can have completely different biological effects. (S)-thalidomide cures morning sickness; (R)-thalidomide causes birth defects. Same atoms, same bonds, mirror-image arrangement. Stereochemistry isn't a footnote — it's life and death.</p>

<h3>1. Stereocenters (chirality centers)</h3><div class="concept">A <b>stereocenter</b> is a sp³ carbon bonded to <b>4 different groups</b>. Such a carbon can be arranged two ways in 3D, giving two non-superimposable mirror images.</div>
<div class="example"><b>Quick test:</b> CHFClBr has 4 different groups (H, F, Cl, Br) → stereocenter. CH₂FCl has only 3 different groups (two H's count as the same) → not a stereocenter.
<svg viewBox="0 0 580 220" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:16px auto;max-width:580px">
<text x="145" y="20" fill="#5eead4" font-size="13" font-weight="700" text-anchor="middle">STEREOCENTER ✓</text>
<text x="435" y="20" fill="#ef4444" font-size="13" font-weight="700" text-anchor="middle">NOT A STEREOCENTER ✗</text>
<!-- Left: CHFClBr stereocenter -->
<text x="145" y="110" fill="#e2e8f0" font-size="16" font-weight="700" text-anchor="middle">C</text>
<line x1="145" y1="95" x2="145" y2="45" stroke="#94a3b8" stroke-width="2"/>
<text x="145" y="40" fill="#60a5fa" font-size="14" font-weight="600" text-anchor="middle">H</text>
<text x="145" y="53" fill="#94a3b8" font-size="9" text-anchor="middle">(4)</text>
<line x1="130" y1="115" x2="70" y2="150" stroke="#94a3b8" stroke-width="2"/>
<text x="57" y="158" fill="#f472b6" font-size="14" font-weight="600" text-anchor="middle">F</text>
<text x="57" y="171" fill="#94a3b8" font-size="9" text-anchor="middle">(3)</text>
<line x1="160" y1="115" x2="220" y2="150" stroke="#94a3b8" stroke-width="2"/>
<text x="233" y="158" fill="#fbbf24" font-size="14" font-weight="600" text-anchor="middle">Cl</text>
<text x="233" y="171" fill="#94a3b8" font-size="9" text-anchor="middle">(2)</text>
<!-- Wedge bond for Br -->
<polygon points="145,118 175,175 185,175" fill="#94a3b8" opacity="0.6"/>
<text x="183" y="195" fill="#ef4444" font-size="14" font-weight="600" text-anchor="middle">Br</text>
<text x="183" y="208" fill="#94a3b8" font-size="9" text-anchor="middle">(1)</text>
<text x="145" y="215" fill="#5eead4" font-size="11" text-anchor="middle">4 different groups → chiral</text>
<!-- Right: CH₂FCl — NOT a stereocenter -->
<text x="435" y="110" fill="#e2e8f0" font-size="16" font-weight="700" text-anchor="middle">C</text>
<line x1="435" y1="95" x2="415" y2="50" stroke="#94a3b8" stroke-width="2"/>
<text x="408" y="43" fill="#60a5fa" font-size="14" font-weight="600" text-anchor="middle">H</text>
<line x1="435" y1="95" x2="455" y2="50" stroke="#94a3b8" stroke-width="2"/>
<text x="462" y="43" fill="#60a5fa" font-size="14" font-weight="600" text-anchor="middle">H</text>
<rect x="397" y="30" width="72" height="20" rx="4" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="433" y="65" fill="#ef4444" font-size="9" text-anchor="middle">SAME!</text>
<line x1="420" y1="115" x2="360" y2="150" stroke="#94a3b8" stroke-width="2"/>
<text x="347" y="158" fill="#f472b6" font-size="14" font-weight="600" text-anchor="middle">F</text>
<line x1="450" y1="115" x2="510" y2="150" stroke="#94a3b8" stroke-width="2"/>
<text x="523" y="158" fill="#fbbf24" font-size="14" font-weight="600" text-anchor="middle">Cl</text>
<text x="435" y="215" fill="#ef4444" font-size="11" text-anchor="middle">only 3 different groups → not chiral</text>
</svg></div>

<h3>2. Cahn-Ingold-Prelog (CIP) priority rules</h3><div class="concept"><b>Rule 1:</b> Higher atomic number = higher priority. So I > Br > Cl > S > P > F > O > N > C > H.<br><b>Rule 2:</b> If tied at the first atom, look at the next shell. Compare atom-by-atom in order of decreasing atomic number until you find a difference.<br><b>Rule 3:</b> Double/triple bonds count as duplicate atoms. C=O is treated as C bonded to (O,O) and O bonded to (C,C). C≡N is treated as C(N,N,N) and N(C,C,C).</div>
<div class="example"><b>Worked example:</b> Rank these by CIP: –CH₃, –CH₂OH, –CHO, –COOH.<br>All start with C, so look at the second shell:<br>–CH₃: (H,H,H)<br>–CH₂OH: (O,H,H)<br>–CHO: (O,O,H) — the C=O counts as 2 O's<br>–COOH: (O,O,O) — C=O is (O,O), plus the OH adds another O<br>Priority high→low: COOH > CHO > CH₂OH > CH₃.</div>

<h3>3. Assigning R or S</h3><div class="concept"><ol><li>Rank the 4 groups by CIP priority (1=highest, 4=lowest).</li><li>Orient the molecule so that <b>the lowest-priority group (#4) points AWAY from you</b>.</li><li>Trace 1→2→3 with your eyes. <b>Clockwise = R</b> (rectus, right). <b>Counter-clockwise = S</b> (sinister, left).</li><li><b>Shortcut:</b> If #4 happens to point TOWARD you instead of away, just trace 1→2→3 normally and then SWAP your answer (R becomes S, S becomes R).</li></ol>
<svg viewBox="0 0 560 240" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:16px auto;max-width:560px">
<text x="140" y="22" fill="#5eead4" font-size="15" font-weight="700" text-anchor="middle">R (Clockwise)</text>
<text x="420" y="22" fill="#a78bfa" font-size="15" font-weight="700" text-anchor="middle">S (Counter-clockwise)</text>
<!-- R config -->
<circle cx="140" cy="130" r="55" fill="none" stroke="#5eead4" stroke-width="2" stroke-dasharray="6 3"/>
<text x="140" y="60" fill="#e2e8f0" font-size="15" font-weight="700" text-anchor="middle">①</text>
<text x="200" y="175" fill="#e2e8f0" font-size="15" font-weight="700" text-anchor="middle">②</text>
<text x="80" y="175" fill="#e2e8f0" font-size="15" font-weight="700" text-anchor="middle">③</text>
<text x="140" y="138" fill="#94a3b8" font-size="11" text-anchor="middle">④ behind</text>
<!-- Clockwise arrow -->
<path d="M155,78 A50,50 0 0,1 190,155" fill="none" stroke="#5eead4" stroke-width="2.5"/>
<polygon points="190,155 195,143 183,148" fill="#5eead4"/>
<text x="140" y="215" fill="#5eead4" font-size="12" text-anchor="middle">1→2→3 clockwise = R</text>
<!-- S config -->
<circle cx="420" cy="130" r="55" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 3"/>
<text x="420" y="60" fill="#e2e8f0" font-size="15" font-weight="700" text-anchor="middle">①</text>
<text x="360" y="175" fill="#e2e8f0" font-size="15" font-weight="700" text-anchor="middle">②</text>
<text x="480" y="175" fill="#e2e8f0" font-size="15" font-weight="700" text-anchor="middle">③</text>
<text x="420" y="138" fill="#94a3b8" font-size="11" text-anchor="middle">④ behind</text>
<!-- Counter-clockwise arrow -->
<path d="M405,78 A50,50 0 0,0 370,155" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
<polygon points="370,155 365,143 377,148" fill="#a78bfa"/>
<text x="420" y="215" fill="#a78bfa" font-size="12" text-anchor="middle">1→2→3 counter-clockwise = S</text>
</svg></div>

<h3>4. Relationships between stereoisomers</h3><div class="concept"><b>Enantiomers:</b> non-superimposable mirror images. Identical physical properties (mp, bp, density) EXCEPT they rotate plane-polarized light in equal but opposite directions. Identical chemical reactions with achiral reagents; different reactions with chiral reagents (e.g., enzymes).<br><br><b>Diastereomers:</b> stereoisomers that are NOT mirror images. They have DIFFERENT physical and chemical properties. Cis/trans alkene isomers count as diastereomers.<br><br><b>Meso compound:</b> contains stereocenters but is achiral overall due to an internal mirror plane. Optically inactive.<br><br><b>Identical (homomers):</b> two drawings that look different but are actually the same molecule, just rotated.
<svg viewBox="0 0 600 310" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:16px auto;max-width:600px">
<text x="300" y="20" fill="#5eead4" font-size="14" font-weight="700" text-anchor="middle">Enantiomers: Mirror Images (2,3-dibromobutane)</text>
<!-- Mirror line -->
<line x1="300" y1="30" x2="300" y2="220" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="300" y="238" fill="#94a3b8" font-size="11" text-anchor="middle">MIRROR</text>
<!-- Left: (2R,3R) -->
<text x="150" y="50" fill="#a78bfa" font-size="12" font-weight="600" text-anchor="middle">(2R,3R)</text>
<text x="150" y="75" fill="#e2e8f0" font-size="13" text-anchor="middle">CH₃</text>
<line x1="150" y1="80" x2="150" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
<text x="150" y="113" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">C</text>
<line x1="135" y1="108" x2="90" y2="108" stroke="#94a3b8" stroke-width="1.5"/>
<text x="78" y="113" fill="#ef4444" font-size="13" font-weight="600" text-anchor="middle">Br</text>
<line x1="165" y1="108" x2="210" y2="108" stroke="#94a3b8" stroke-width="1.5"/>
<text x="220" y="113" fill="#60a5fa" font-size="13" font-weight="600" text-anchor="middle">H</text>
<line x1="150" y1="120" x2="150" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
<text x="150" y="158" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">C</text>
<line x1="135" y1="153" x2="90" y2="153" stroke="#94a3b8" stroke-width="1.5"/>
<text x="78" y="158" fill="#ef4444" font-size="13" font-weight="600" text-anchor="middle">Br</text>
<line x1="165" y1="153" x2="210" y2="153" stroke="#94a3b8" stroke-width="1.5"/>
<text x="220" y="158" fill="#60a5fa" font-size="13" font-weight="600" text-anchor="middle">H</text>
<line x1="150" y1="165" x2="150" y2="185" stroke="#94a3b8" stroke-width="1.5"/>
<text x="150" y="200" fill="#e2e8f0" font-size="13" text-anchor="middle">CH₃</text>
<!-- Right: (2S,3S) — mirrored -->
<text x="450" y="50" fill="#a78bfa" font-size="12" font-weight="600" text-anchor="middle">(2S,3S)</text>
<text x="450" y="75" fill="#e2e8f0" font-size="13" text-anchor="middle">CH₃</text>
<line x1="450" y1="80" x2="450" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
<text x="450" y="113" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">C</text>
<line x1="465" y1="108" x2="510" y2="108" stroke="#94a3b8" stroke-width="1.5"/>
<text x="522" y="113" fill="#ef4444" font-size="13" font-weight="600" text-anchor="middle">Br</text>
<line x1="435" y1="108" x2="390" y2="108" stroke="#94a3b8" stroke-width="1.5"/>
<text x="380" y="113" fill="#60a5fa" font-size="13" font-weight="600" text-anchor="middle">H</text>
<line x1="450" y1="120" x2="450" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
<text x="450" y="158" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">C</text>
<line x1="465" y1="153" x2="510" y2="153" stroke="#94a3b8" stroke-width="1.5"/>
<text x="522" y="158" fill="#ef4444" font-size="13" font-weight="600" text-anchor="middle">Br</text>
<line x1="435" y1="153" x2="390" y2="153" stroke="#94a3b8" stroke-width="1.5"/>
<text x="380" y="158" fill="#60a5fa" font-size="13" font-weight="600" text-anchor="middle">H</text>
<line x1="450" y1="165" x2="450" y2="185" stroke="#94a3b8" stroke-width="1.5"/>
<text x="450" y="200" fill="#e2e8f0" font-size="13" text-anchor="middle">CH₃</text>
<!-- Label -->
<rect x="150" y="252" width="300" height="36" rx="6" fill="rgba(94,234,212,0.1)" stroke="#5eead4" stroke-width="1"/>
<text x="300" y="268" fill="#5eead4" font-size="12" font-weight="600" text-anchor="middle">ALL centers flipped (R→S) = ENANTIOMERS</text>
<text x="300" y="282" fill="#94a3b8" font-size="10" text-anchor="middle">Non-superimposable mirror images — like left and right hands</text>
</svg>

<svg viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:16px auto;max-width:600px">
<text x="300" y="20" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">Meso Compound: Internal Mirror (2R,3S)-2,3-dichlorobutane</text>
<!-- Single molecule with internal mirror -->
<text x="300" y="55" fill="#e2e8f0" font-size="13" text-anchor="middle">CH₃</text>
<line x1="300" y1="60" x2="300" y2="80" stroke="#94a3b8" stroke-width="1.5"/>
<text x="300" y="95" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">C</text>
<text x="318" y="88" fill="#a78bfa" font-size="10" font-weight="600">R</text>
<line x1="285" y1="90" x2="235" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
<text x="222" y="95" fill="#fbbf24" font-size="13" font-weight="600" text-anchor="middle">Cl</text>
<line x1="315" y1="90" x2="365" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
<text x="378" y="95" fill="#60a5fa" font-size="13" font-weight="600" text-anchor="middle">H</text>
<line x1="300" y1="102" x2="300" y2="128" stroke="#94a3b8" stroke-width="1.5"/>
<!-- Internal mirror plane -->
<line x1="200" y1="130" x2="400" y2="130" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 4"/>
<text x="430" y="134" fill="#fbbf24" font-size="11" font-weight="600">← internal mirror</text>
<line x1="300" y1="132" x2="300" y2="155" stroke="#94a3b8" stroke-width="1.5"/>
<text x="300" y="170" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">C</text>
<text x="318" y="163" fill="#a78bfa" font-size="10" font-weight="600">S</text>
<line x1="315" y1="165" x2="365" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
<text x="378" y="170" fill="#fbbf24" font-size="13" font-weight="600" text-anchor="middle">Cl</text>
<line x1="285" y1="165" x2="235" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
<text x="222" y="170" fill="#60a5fa" font-size="13" font-weight="600" text-anchor="middle">H</text>

<text x="300" y="258" fill="#94a3b8" font-size="10" text-anchor="middle">Has stereocenters but is optically inactive (rotations cancel)</text>

<h3>5. Counting stereoisomers</h3><p>A molecule with <b>n</b> stereocenters has <b>up to 2ⁿ</b> stereoisomers. (Fewer if there's meso symmetry.) Two stereocenters → up to 4 stereoisomers (2 pairs of enantiomers, each pair being diastereomers of the other pair).</p>
<div class="example"><b>Example:</b> 2,3-dichlorobutane has 2 stereocenters (C2 and C3). Maximum 2² = 4 stereoisomers. But (2R,3S) and (2S,3R) are actually the SAME molecule (meso, has internal mirror plane). So only 3 stereoisomers exist: (2R,3R), (2S,3S) — these are enantiomers — and the meso form, which is a diastereomer of both.
<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:16px auto;max-width:600px">
<text x="300" y="20" fill="#5eead4" font-size="13" font-weight="700" text-anchor="middle">Stereoisomer Map: 2,3-dichlorobutane (2 stereocenters, expect 4 — get 3)</text>
<!-- Three boxes -->
<rect x="20" y="40" width="150" height="60" rx="8" fill="rgba(167,139,250,0.1)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="95" y="63" fill="#a78bfa" font-size="13" font-weight="600" text-anchor="middle">(2R,3R)</text>
<text x="95" y="80" fill="#94a3b8" font-size="10" text-anchor="middle">chiral, [α] = +</text>
<rect x="225" y="40" width="150" height="60" rx="8" fill="rgba(167,139,250,0.1)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="300" y="63" fill="#a78bfa" font-size="13" font-weight="600" text-anchor="middle">(2S,3S)</text>
<text x="300" y="80" fill="#94a3b8" font-size="10" text-anchor="middle">chiral, [α] = −</text>
<rect x="430" y="40" width="150" height="60" rx="8" fill="rgba(251,191,36,0.1)" stroke="#fbbf24" stroke-width="1.5"/>
<text x="505" y="63" fill="#fbbf24" font-size="13" font-weight="600" text-anchor="middle">(2R,3S) = meso</text>
<text x="505" y="80" fill="#94a3b8" font-size="10" text-anchor="middle">achiral, [α] = 0</text>
<!-- Arrows between them -->
<line x1="170" y1="70" x2="225" y2="70" stroke="#5eead4" stroke-width="1.5"/>
<text x="197" y="65" fill="#5eead4" font-size="9" text-anchor="middle">enantiomers</text>
<line x1="170" y1="100" x2="505" y2="130" stroke="#f472b6" stroke-width="1" stroke-dasharray="4 2"/>
<line x1="375" y1="100" x2="505" y2="130" stroke="#f472b6" stroke-width="1" stroke-dasharray="4 2"/>
<text x="300" y="145" fill="#f472b6" font-size="10" text-anchor="middle">diastereomers of each other</text>
<!-- Crossed out 4th -->
<rect x="200" y="160" width="200" height="28" rx="6" fill="rgba(239,68,68,0.1)" stroke="#ef4444" stroke-width="1"/>
<text x="300" y="179" fill="#ef4444" font-size="11" text-anchor="middle">(2S,3R) is NOT new — it IS the meso form</text>
</svg></div>`,
quiz:[
{q:'How many stereocenters does 2-bromobutane have?<br><svg viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:10px auto;max-width:380px"><text x="40" y="50" fill="#e2e8f0" font-size="13" text-anchor="middle">CH₃</text><line x1="60" y1="45" x2="100" y2="45" stroke="#94a3b8" stroke-width="2"/><text x="120" y="50" fill="#5eead4" font-size="14" font-weight="700" text-anchor="middle">C</text><line x1="120" y1="30" x2="120" y2="14" stroke="#94a3b8" stroke-width="2"/><text x="120" y="10" fill="#60a5fa" font-size="12" text-anchor="middle">H</text><line x1="120" y1="58" x2="120" y2="78" stroke="#94a3b8" stroke-width="2"/><text x="120" y="92" fill="#ef4444" font-size="13" font-weight="600" text-anchor="middle">Br</text><line x1="140" y1="45" x2="180" y2="45" stroke="#94a3b8" stroke-width="2"/><text x="200" y="50" fill="#e2e8f0" font-size="13" text-anchor="middle">CH₂</text><line x1="220" y1="45" x2="260" y2="45" stroke="#94a3b8" stroke-width="2"/><text x="280" y="50" fill="#e2e8f0" font-size="13" text-anchor="middle">CH₃</text><rect x="105" y="22" width="30" height="50" rx="4" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-dasharray="4 2"/><text x="120" y="75" fill="#5eead4" font-size="9" text-anchor="middle">stereocenter?</text></svg>',opts:["0","1","2","3"],correct:1,explain:'Check C2: its four groups are CH₃, H, Br, and CH₂CH₃. All four are different → 1 stereocenter. C1, C3, C4 don\'t have 4 different groups. <svg viewBox="0 0 350 80" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:8px auto;max-width:340px"><text x="50" y="40" fill="#e2e8f0" font-size="12" text-anchor="middle">CH₃</text><text x="50" y="55" fill="#94a3b8" font-size="9" text-anchor="middle">(4)</text><line x1="72" y1="38" x2="110" y2="38" stroke="#94a3b8" stroke-width="1.5"/><text x="130" y="42" fill="#5eead4" font-size="13" font-weight="700" text-anchor="middle">C★</text><line x1="130" y1="20" x2="130" y2="8" stroke="#94a3b8" stroke-width="1.5"/><text x="130" y="6" fill="#60a5fa" font-size="11" text-anchor="middle">H</text><line x1="130" y1="50" x2="130" y2="68" stroke="#94a3b8" stroke-width="1.5"/><text x="130" y="78" fill="#ef4444" font-size="11" font-weight="600" text-anchor="middle">Br (1)</text><line x1="150" y1="38" x2="190" y2="38" stroke="#94a3b8" stroke-width="1.5"/><text x="220" y="42" fill="#e2e8f0" font-size="12" text-anchor="middle">CH₂CH₃</text><text x="220" y="55" fill="#94a3b8" font-size="9" text-anchor="middle">(2)</text><text x="295" y="42" fill="#5eead4" font-size="11" text-anchor="middle">4 diff → ★</text></svg>'},
{q:"Rank these groups from highest to lowest CIP priority: –OH, –NH₂, –CH₃, –Cl.",opts:["Cl > OH > NH₂ > CH₃","OH > Cl > NH₂ > CH₃","Cl > NH₂ > OH > CH₃","OH > NH₂ > CH₃ > Cl"],correct:0,explain:'Compare by atomic number of the first atom: Cl(17) > O(8) > N(7) > C(6). So Cl > OH > NH₂ > CH₃. Higher atomic number always wins at the first point of comparison. <svg viewBox="0 0 400 55" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:8px auto;max-width:390px"><rect x="10" y="8" width="60" height="35" rx="6" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="1.5"/><text x="40" y="23" fill="#ef4444" font-size="12" font-weight="700" text-anchor="middle">Cl</text><text x="40" y="37" fill="#94a3b8" font-size="10" text-anchor="middle">Z = 17</text><text x="85" y="28" fill="#94a3b8" font-size="14" text-anchor="middle">&gt;</text><rect x="100" y="8" width="60" height="35" rx="6" fill="rgba(96,165,250,0.15)" stroke="#60a5fa" stroke-width="1.5"/><text x="130" y="23" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">OH</text><text x="130" y="37" fill="#94a3b8" font-size="10" text-anchor="middle">Z = 8</text><text x="175" y="28" fill="#94a3b8" font-size="14" text-anchor="middle">&gt;</text><rect x="190" y="8" width="60" height="35" rx="6" fill="rgba(167,139,250,0.15)" stroke="#a78bfa" stroke-width="1.5"/><text x="220" y="23" fill="#a78bfa" font-size="12" font-weight="700" text-anchor="middle">NH₂</text><text x="220" y="37" fill="#94a3b8" font-size="10" text-anchor="middle">Z = 7</text><text x="265" y="28" fill="#94a3b8" font-size="14" text-anchor="middle">&gt;</text><rect x="280" y="8" width="60" height="35" rx="6" fill="rgba(251,191,36,0.15)" stroke="#fbbf24" stroke-width="1.5"/><text x="310" y="23" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">CH₃</text><text x="310" y="37" fill="#94a3b8" font-size="10" text-anchor="middle">Z = 6</text></svg>'},
{q:'In this molecule, priorities 1→2→3 trace clockwise. But priority 4 (H) is pointing TOWARD you (wedge). What is the configuration?<br><svg viewBox="0 0 280 170" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:10px auto;max-width:260px"><text x="140" y="55" fill="#e2e8f0" font-size="15" font-weight="700" text-anchor="middle">C</text><line x1="140" y1="40" x2="140" y2="15" stroke="#94a3b8" stroke-width="2"/><text x="140" y="10" fill="#ef4444" font-size="13" font-weight="600" text-anchor="middle">Br ①</text><line x1="120" y1="62" x2="75" y2="85" stroke="#94a3b8" stroke-width="2"/><text x="58" y="92" fill="#fbbf24" font-size="13" font-weight="600" text-anchor="middle">Cl ②</text><line x1="160" y1="62" x2="205" y2="85" stroke="#94a3b8" stroke-width="2"/><text x="222" y="92" fill="#f472b6" font-size="13" font-weight="600" text-anchor="middle">F ③</text><polygon points="133,62 120,115 150,115" fill="#94a3b8" opacity="0.5"/><text x="140" y="135" fill="#60a5fa" font-size="13" font-weight="600" text-anchor="middle">H ④</text><text x="140" y="155" fill="#fbbf24" font-size="10" text-anchor="middle">← wedge = toward you!</text></svg>',opts:["R","S","cannot be determined","meso"],correct:1,explain:'What you see is 1→2→3 going clockwise, which looks like R. But H (priority 4) is on a wedge = pointing toward you, not away. When #4 faces you, you swap your answer. Clockwise + swap = S. <svg viewBox="0 0 350 50" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:8px auto;max-width:340px"><rect x="10" y="5" width="100" height="35" rx="6" fill="rgba(94,234,212,0.1)" stroke="#5eead4" stroke-width="1.5"/><text x="60" y="27" fill="#5eead4" font-size="12" font-weight="600" text-anchor="middle">CW → "R"</text><text x="130" y="27" fill="#94a3b8" font-size="14" text-anchor="middle">+</text><rect x="145" y="5" width="100" height="35" rx="6" fill="rgba(251,191,36,0.1)" stroke="#fbbf24" stroke-width="1.5"/><text x="195" y="27" fill="#fbbf24" font-size="12" font-weight="600" text-anchor="middle">#4 toward</text><text x="265" y="27" fill="#94a3b8" font-size="14" text-anchor="middle">=</text><rect x="280" y="5" width="60" height="35" rx="6" fill="rgba(167,139,250,0.15)" stroke="#a78bfa" stroke-width="1.5"/><text x="310" y="27" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="middle">S</text></svg>'},
{q:'What is the relationship between these two molecules?<br><svg viewBox="0 0 500 175" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:10px auto;max-width:480px"><text x="120" y="18" fill="#a78bfa" font-size="12" font-weight="600" text-anchor="middle">(2R,3R)</text><text x="120" y="40" fill="#e2e8f0" font-size="12" text-anchor="middle">CH₃</text><line x1="120" y1="45" x2="120" y2="60" stroke="#94a3b8" stroke-width="1.5"/><text x="120" y="73" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">C</text><line x1="105" y1="68" x2="70" y2="68" stroke="#94a3b8" stroke-width="1.5"/><text x="58" y="73" fill="#ef4444" font-size="12" font-weight="600" text-anchor="middle">Br</text><line x1="135" y1="68" x2="170" y2="68" stroke="#94a3b8" stroke-width="1.5"/><text x="180" y="73" fill="#60a5fa" font-size="12" text-anchor="middle">H</text><line x1="120" y1="80" x2="120" y2="95" stroke="#94a3b8" stroke-width="1.5"/><text x="120" y="108" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">C</text><line x1="105" y1="103" x2="70" y2="103" stroke="#94a3b8" stroke-width="1.5"/><text x="58" y="108" fill="#ef4444" font-size="12" font-weight="600" text-anchor="middle">Br</text><line x1="135" y1="103" x2="170" y2="103" stroke="#94a3b8" stroke-width="1.5"/><text x="180" y="108" fill="#60a5fa" font-size="12" text-anchor="middle">H</text><line x1="120" y1="115" x2="120" y2="130" stroke="#94a3b8" stroke-width="1.5"/><text x="120" y="145" fill="#e2e8f0" font-size="12" text-anchor="middle">CH₃</text><line x1="250" y1="30" x2="250" y2="145" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 3"/><text x="250" y="165" fill="#94a3b8" font-size="10" text-anchor="middle">mirror</text><text x="380" y="18" fill="#a78bfa" font-size="12" font-weight="600" text-anchor="middle">(2S,3S)</text><text x="380" y="40" fill="#e2e8f0" font-size="12" text-anchor="middle">CH₃</text><line x1="380" y1="45" x2="380" y2="60" stroke="#94a3b8" stroke-width="1.5"/><text x="380" y="73" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">C</text><line x1="395" y1="68" x2="430" y2="68" stroke="#94a3b8" stroke-width="1.5"/><text x="442" y="73" fill="#ef4444" font-size="12" font-weight="600" text-anchor="middle">Br</text><line x1="365" y1="68" x2="330" y2="68" stroke="#94a3b8" stroke-width="1.5"/><text x="320" y="73" fill="#60a5fa" font-size="12" text-anchor="middle">H</text><line x1="380" y1="80" x2="380" y2="95" stroke="#94a3b8" stroke-width="1.5"/><text x="380" y="108" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">C</text><line x1="395" y1="103" x2="430" y2="103" stroke="#94a3b8" stroke-width="1.5"/><text x="442" y="108" fill="#ef4444" font-size="12" font-weight="600" text-anchor="middle">Br</text><line x1="365" y1="103" x2="330" y2="103" stroke="#94a3b8" stroke-width="1.5"/><text x="320" y="108" fill="#60a5fa" font-size="12" text-anchor="middle">H</text><line x1="380" y1="115" x2="380" y2="130" stroke="#94a3b8" stroke-width="1.5"/><text x="380" y="145" fill="#e2e8f0" font-size="12" text-anchor="middle">CH₃</text></svg>',opts:["identical","enantiomers","diastereomers","constitutional isomers"],correct:1,explain:"Both stereocenters are inverted (R→S at C2 AND C3). When ALL stereocenters flip, you get the non-superimposable mirror image = enantiomers. Quick rule: all flip → enantiomers. Some flip → diastereomers. None flip → identical."},

"middle">CH₃</text><line x1="380" y1="45" x2="380" y2="60" stroke="#94a3b8" stroke-width="1.5"/><text x="380" y="73" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">C</text><text x="397" y="66" fill="#5eead4" font-size="9" font-weight="700">R</text><line x1="365" y1="68" x2="330" y2="68" stroke="#94a3b8" stroke-width="1.5"/><text x="318" y="73" fill="#ef4444" font-size="12" font-weight="600" text-anchor="middle">Br</text><line x1="395" y1="68" x2="430" y2="68" stroke="#94a3b8" stroke-width="1.5"/><text x="440" y="73" fill="#60a5fa" font-size="12" text-anchor="middle">H</text><line x1="380" y1="80" x2="380" y2="95" stroke="#94a3b8" stroke-width="1.5"/><text x="380" y="108" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">C</text><text x="397" y="101" fill="#fbbf24" font-size="9" font-weight="700">S</text><line x1="395" y1="103" x2="430" y2="103" stroke="#94a3b8" stroke-width="1.5"/><text x="442" y="108" fill="#ef4444" font-size="12" font-weight="600" text-anchor="middle">Br</text><line x1="365" y1="103" x2="330" y2="103" stroke="#94a3b8" stroke-width="1.5"/><text x="320" y="108" fill="#60a5fa" font-size="12" text-anchor="middle">H</text><line x1="380" y1="115" x2="380" y2="130" stroke="#94a3b8" stroke-width="1.5"/><text x="380" y="145" fill="#e2e8f0" font-size="12" text-anchor="middle">CH₃</text><text x="250" y="160" fill="#f472b6" font-size="10" text-anchor="middle">C2 same, C3 flipped</text></svg>',opts:["identical","enantiomers","diastereomers","constitutional isomers"],correct:2,explain:"Only ONE stereocenter is inverted (C3: R→S) while C2 stays R. Stereoisomers that are NOT complete mirror images = diastereomers. Quick rule: some centers flip but not all → diastereomers. They have different physical properties (mp, bp, solubility)."},
{q:'Meso-tartaric acid contains 2 stereocenters but is optically inactive. Why?<br><svg viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:10px auto;max-width:340px"><text x="175" y="18" fill="#fbbf24" font-size="12" font-weight="600" text-anchor="middle">meso-tartaric acid</text><text x="175" y="42" fill="#e2e8f0" font-size="12" text-anchor="middle">COOH</text><line x1="175" y1="48" x2="175" y2="63" stroke="#94a3b8" stroke-width="1.5"/><text x="175" y="76" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">C</text><text x="192" y="69" fill="#5eead4" font-size="9" font-weight="700">R</text><line x1="160" y1="71" x2="115" y2="71" stroke="#94a3b8" stroke-width="1.5"/><text x="100" y="76" fill="#60a5fa" font-size="12" text-anchor="middle">OH</text><line x1="190" y1="71" x2="235" y2="71" stroke="#94a3b8" stroke-width="1.5"/><text x="245" y="76" fill="#94a3b8" font-size="12" text-anchor="middle">H</text><line x1="175" y1="83" x2="175" y2="98" stroke="#94a3b8" stroke-width="1.5"/><line x1="100" y1="100" x2="250" y2="100" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 3"/><text x="280" y="104" fill="#fbbf24" font-size="9" font-weight="600">mirror</text><line x1="175" y1="102" x2="175" y2="118" stroke="#94a3b8" stroke-width="1.5"/><text x="175" y="131" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">C</text><text x="192" y="124" fill="#a78bfa" font-size="9" font-weight="700">S</text><line x1="190" y1="126" x2="235" y2="126" stroke="#94a3b8" stroke-width="1.5"/><text x="250" y="131" fill="#60a5fa" font-size="12" text-anchor="middle">OH</text><line x1="160" y1="126" x2="115" y2="126" stroke="#94a3b8" stroke-width="1.5"/><text x="105" y="131" fill="#94a3b8" font-size="12" text-anchor="middle">H</text><line x1="175" y1="138" x2="175" y2="153" stroke="#94a3b8" stroke-width="1.5"/><text x="175" y="168" fill="#e2e8f0" font-size="12" text-anchor="middle">COOH</text><text x="175" y="192" fill="#fbbf24" font-size="10" text-anchor="middle">top R + bottom S → rotations cancel → [α] = 0°</text></svg>',opts:["it has no stereocenters","the rotations from the two stereocenters cancel due to internal mirror symmetry","tartaric acid never rotates light","it racemizes spontaneously"],correct:1,explain:"The diagram shows it: the top half (R) is the mirror image of the bottom half (S) within the same molecule. One center rotates light clockwise, the other rotates it counter-clockwise by exactly the same amount. Net rotation = 0. Stereocenters are present but the molecule is achiral overall."},
{q:"How many stereoisomers does 2,3,4-trichloropentane have? (Hint: check for symmetry — C2 and C4 carry identical substituent sets)",opts:["8","6","4","3"],correct:1,explain:'3 stereocenters → max 2³ = 8 possibilities. But the molecule is symmetric end-to-end (CH₃ on both ends, Cl at C2 and C4). So some "different" combinations are actually the same molecule read backwards. List all 8 and cross out duplicates: (RRR), (SSS), (RRS)=(SRR), (RSS)=(SSR), (RSR), (SRS). That gives 6 unique stereoisomers. <svg viewBox="0 0 420 70" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:8px auto;max-width:400px"><text x="30" y="20" fill="#5eead4" font-size="10" text-anchor="middle">RRR</text><text x="90" y="20" fill="#5eead4" font-size="10" text-anchor="middle">SSS</text><text x="155" y="20" fill="#a78bfa" font-size="10" text-anchor="middle">RRS</text><text x="220" y="20" fill="#a78bfa" font-size="10" text-anchor="middle">RSS</text><text x="285" y="20" fill="#fbbf24" font-size="10" text-anchor="middle">RSR</text><text x="350" y="20" fill="#fbbf24" font-size="10" text-anchor="middle">SRS</text><text x="155" y="40" fill="#94a3b8" font-size="9" text-anchor="middle">=SRR</text><text x="220" y="40" fill="#94a3b8" font-size="9" text-anchor="middle">=SSR</text><text x="210" y="62" fill="#5eead4" font-size="11" text-anchor="middle">8 combos − 2 duplicates = 6 unique</text></svg>'},
{q:'Which compound below is NOT chiral (has no stereocenter)?<br><svg viewBox="0 0 450 120" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:10px auto;max-width:440px"><text x="10" y="15" fill="#a78bfa" font-size="11" font-weight="600">A. 2-bromobutane</text><text x="50" y="50" fill="#e2e8f0" font-size="11" text-anchor="middle">CH₃</text><line x1="68" y1="47" x2="95" y2="47" stroke="#94a3b8" stroke-width="1.5"/><text x="110" y="51" fill="#e2e8f0" font-size="11" text-anchor="middle">CHBr</text><line x1="130" y1="47" x2="155" y2="47" stroke="#94a3b8" stroke-width="1.5"/><text x="180" y="51" fill="#e2e8f0" font-size="11" text-anchor="middle">CH₂CH₃</text><text x="240" y="15" fill="#a78bfa" font-size="11" font-weight="600">B. 3-bromopentane</text><text x="265" y="50" fill="#e2e8f0" font-size="11" text-anchor="middle">CH₂CH₃</text><line x1="295" y1="47" x2="320" y2="47" stroke="#94a3b8" stroke-width="1.5"/><text x="340" y="51" fill="#e2e8f0" font-size="11" text-anchor="middle">CHBr</text><line x1="358" y1="47" x2="383" y2="47" stroke="#94a3b8" stroke-width="1.5"/><text x="415" y="51" fill="#e2e8f0" font-size="11" text-anchor="middle">CH₂CH₃</text><rect x="253" y="37" width="175" height="22" rx="4" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2"/><text x="340" y="80" fill="#ef4444" font-size="9" text-anchor="middle">two identical CH₂CH₃ groups!</text><text x="10" y="100" fill="#a78bfa" font-size="11" font-weight="600">C. 2-chlorobutane</text><text x="240" y="100" fill="#a78bfa" font-size="11" font-weight="600">D. 2-bromopentane</text></svg>',opts:["2-bromobutane","3-bromopentane","2-chlorobutane","2-bromopentane"],correct:1,explain:"3-bromopentane: C3 has H, Br, CH₂CH₃, and CH₂CH₃. The two ethyl groups are identical — only 3 different groups, not 4 → no stereocenter → not chiral. All other options have 4 different groups at the halogen-bearing carbon."},
{q:"A pure sample of one enantiomer rotates light +25°. The other enantiomer rotates it:",opts:["+25°","0°","−25°","cannot predict"],correct:2,explain:'Enantiomers rotate plane-polarized light by equal amounts in opposite directions. If one is +25° (dextrorotatory), its mirror image is −25° (levorotatory). A 50:50 racemic mixture would give 0° (rotations cancel). <svg viewBox="0 0 380 50" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:8px auto;max-width:370px"><rect x="5" y="5" width="110" height="35" rx="6" fill="rgba(94,234,212,0.1)" stroke="#5eead4" stroke-width="1.5"/><text x="60" y="27" fill="#5eead4" font-size="12" font-weight="600" text-anchor="middle">(R): +25°</text><text x="140" y="27" fill="#94a3b8" font-size="16" text-anchor="middle">↔</text><rect x="160" y="5" width="110" height="35" rx="6" fill="rgba(167,139,250,0.1)" stroke="#a78bfa" stroke-width="1.5"/><text x="215" y="27" fill="#a78bfa" font-size="12" font-weight="600" text-anchor="middle">(S): −25°</text><text x="310" y="20" fill="#94a3b8" font-size="10" text-anchor="middle">50:50 mix</text><text x="310" y="35" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">= 0°</text></svg>'},
{q:'What is the configuration at the starred carbon of (R)-2-chlorobutane?<br><svg viewBox="0 0 350 140" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:10px auto;max-width:340px"><text x="175" y="20" fill="#e2e8f0" font-size="11" text-anchor="middle">view with H pointing away (dashed bond = behind page)</text><text x="175" y="55" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">Cl ①</text><line x1="175" y1="60" x2="175" y2="78" stroke="#94a3b8" stroke-width="2"/><text x="175" y="92" fill="#5eead4" font-size="14" font-weight="700" text-anchor="middle">C★</text><line x1="155" y1="98" x2="110" y2="118" stroke="#94a3b8" stroke-width="2"/><text x="90" y="128" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">CH₃ ③</text><line x1="195" y1="98" x2="240" y2="118" stroke="#94a3b8" stroke-width="2"/><text x="272" y="128" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">CH₂CH₃ ②</text><line x1="175" y1="92" x2="175" y2="92" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/><text x="175" y="140" fill="#94a3b8" font-size="10" text-anchor="middle">H ④ (behind page)</text><path d="M195,62 A35,35 0 0,1 215,105" fill="none" stroke="#5eead4" stroke-width="2"/><polygon points="215,105 220,93 208,98" fill="#5eead4"/><text x="240" y="80" fill="#5eead4" font-size="11" font-weight="600">CW = R</text></svg>',opts:["The Cl points up","Priorities 1,2,3 (Cl, ethyl, methyl) go clockwise when H is behind","Priorities go counter-clockwise","R means the molecule is right-handed in a literal sense"],correct:1,explain:"At C2: Cl (priority 1, Z=17), CH₂CH₃ (priority 2, second-shell has C), CH₃ (priority 3, second-shell has H), H (priority 4). Orient H away from you. Trace 1→2→3: it goes clockwise → R. The letter R just tells you the rotation direction at that one center, not anything about the whole molecule being 'right-handed'."}
]},

m5:{title:"Conformations & Chair Cyclohexane",lead:"How molecules wiggle in 3D space, and why bulky groups demand the equatorial seat.",
body:`<h3>Why conformations matter</h3><p>A single bond can rotate freely. As it rotates, the molecule passes through different shapes called <b>conformations</b> — same molecule, same connectivity, just different 3D arrangements at any instant. Some conformations are more stable than others. Reactions happen from specific conformations, so understanding which ones a molecule prefers tells you which products will form.</p>
<h3>1. Newman projections</h3><p>A Newman projection is a way of looking at a molecule down a specific C–C bond. The front carbon is shown as a dot (or small circle), and the back carbon as a larger circle. The three bonds from each carbon stick out at 120° angles.</p>
<div class="concept"><b>Stability ranking for ethane and butane:</b><br><b>Anti (180°)</b> — most stable. Bulky groups on opposite sides, no steric clash.<br><b>Gauche (60°)</b> — staggered but bulky groups closer together. Slight steric strain.<br><b>Eclipsed (120°, 240°)</b> — bonds line up. Torsional strain from electrons in overlapping bonds repelling each other.<br><b>Fully eclipsed (0°, 360°)</b> — bulky groups directly overlap. Maximum strain.
<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:16px auto;max-width:620px">
<text x="310" y="18" fill="#5eead4" font-size="14" font-weight="700" text-anchor="middle">Butane Energy Diagram (rotation about C2–C3)</text>
<!-- Axes -->
<line x1="60" y1="280" x2="580" y2="280" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="60" y1="280" x2="60" y2="40" stroke="#94a3b8" stroke-width="1.5"/>
<text x="30" y="160" fill="#94a3b8" font-size="11" text-anchor="middle" transform="rotate(-90,30,160)">Potential Energy →</text>
<text x="310" y="300" fill="#94a3b8" font-size="11" text-anchor="middle">Dihedral Angle (°)</text>
<!-- X-axis labels -->
<text x="80" y="295" fill="#94a3b8" font-size="10" text-anchor="middle">0°</text>
<text x="163" y="295" fill="#94a3b8" font-size="10" text-anchor="middle">60°</text>
<text x="247" y="295" fill="#94a3b8" font-size="10" text-anchor="middle">120°</text>
<text x="330" y="295" fill="#94a3b8" font-size="10" text-anchor="middle">180°</text>
<text x="413" y="295" fill="#94a3b8" font-size="10" text-anchor="middle">240°</text>
<text x="497" y="295" fill="#94a3b8" font-size="10" text-anchor="middle">300°</text>
<text x="560" y="295" fill="#94a3b8" font-size="10" text-anchor="middle">360°</text>
<!-- Energy curve - smooth butane profile -->
<path d="M80,60 C100,60 130,230 163,210 C190,195 210,82 247,82 C280,82 300,265 330,270 C360,265 380,82 413,82 C445,82 465,195 497,210 C525,230 545,60 560,60" fill="none" stroke="#5eead4" stroke-width="2.5"/>
<!-- Peak labels -->
<text x="80" y="50" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">fully</text>
<text x="80" y="60" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">eclipsed</text>
<line x1="80" y1="62" x2="80" y2="60" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 2"/>
<text x="247" y="72" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">eclipsed</text>
<text x="413" y="72" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">eclipsed</text>
<text x="560" y="50" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">fully</text>
<text x="560" y="60" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">eclipsed</text>
<!-- Trough labels -->
<text x="163" y="228" fill="#a78bfa" font-size="10" font-weight="600" text-anchor="middle">gauche</text>
<text x="330" y="268" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">ANTI</text>
<text x="330" y="255" fill="#10b981" font-size="9" text-anchor="middle">most stable</text>
<text x="497" y="228" fill="#a78bfa" font-size="10" font-weight="600" text-anchor="middle">gauche</text>
<!-- Energy annotations -->
<line x1="68" y1="270" x2="68" y2="210" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3 2"/>
<text x="50" y="242" fill="#a78bfa" font-size="9" text-anchor="middle">3.8</text>
<text x="50" y="252" fill="#a78bfa" font-size="8" text-anchor="middle">kJ/mol</text>
<line x1="68" y1="270" x2="68" y2="60" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 2"/>
<text x="50" y="170" fill="#ef4444" font-size="9" text-anchor="middle">19</text>
<text x="50" y="180" fill="#ef4444" font-size="8" text-anchor="middle">kJ/mol</text>
<!-- Newman projection mini-diagrams at key points -->
<!-- Anti at 180° -->
<circle cx="330" cy="320" r="8" fill="none" stroke="#10b981" stroke-width="1"/>
<line x1="330" y1="312" x2="330" y2="305" stroke="#10b981" stroke-width="1.5"/>
<text x="330" y="303" fill="#10b981" font-size="7" text-anchor="middle">CH₃</text>
<line x1="330" y1="328" x2="330" y2="335" stroke="#10b981" stroke-width="1"/>
<text x="330" y="340" fill="#10b981" font-size="7" text-anchor="middle">CH₃</text>
<!-- Fully eclipsed at 0° -->
<circle cx="80" cy="320" r="8" fill="none" stroke="#ef4444" stroke-width="1"/>
<line x1="80" y1="312" x2="80" y2="305" stroke="#ef4444" stroke-width="1.5"/>
<text x="80" y="303" fill="#ef4444" font-size="7" text-anchor="middle">CH₃+CH₃</text>
</svg></div>
<div class="example"><b>Butane along C2–C3:</b> The energy graph above shows 3 minima (anti at 180°, gauche at 60° and 300°) and 3 maxima (fully eclipsed at 0°/360°, partially eclipsed at 120° and 240°). The anti minimum is the deepest — methyls are as far apart as possible (180°). The fully eclipsed peaks are the highest — methyls are directly on top of each other (0°).</div>
<h3>2. Cyclohexane: the chair</h3><p>Cyclohexane is the most important ring in organic chemistry — found in steroids, sugars, terpenes, drugs. It's NOT flat. Flat cyclohexane would have 120° bond angles (sp³ wants 109.5°) and all H's eclipsed. Instead, it puckers into a <b>chair conformation</b>: every bond angle is exactly 109.5°, every adjacent H pair is staggered. Zero strain.</p>
<div class="concept"><b>Axial vs equatorial bonds:</b><br><b>Axial bonds</b> point straight up or straight down, perpendicular to the average ring plane. They alternate up-down-up-down around the ring.<br><b>Equatorial bonds</b> point outward, slightly above or below horizontal. They alternate too.<br>Each ring carbon has exactly one axial bond and one equatorial bond.
<svg viewBox="0 0 560 220" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:16px auto;max-width:560px">
<text x="280" y="18" fill="#5eead4" font-size="13" font-weight="700" text-anchor="middle">Chair Conformation: Axial vs Equatorial</text>
<!-- Chair skeleton -->
<polygon points="170,120 230,80 340,80 400,120 340,160 230,160" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
<!-- Carbon labels -->
<text x="160" y="124" fill="#94a3b8" font-size="10" text-anchor="end">C4</text>
<text x="224" y="74" fill="#94a3b8" font-size="10" text-anchor="end">C5</text>
<text x="348" y="74" fill="#94a3b8" font-size="10">C6</text>
<text x="410" y="124" fill="#94a3b8" font-size="10">C1</text>
<text x="348" y="170" fill="#94a3b8" font-size="10">C2</text>
<text x="224" y="170" fill="#94a3b8" font-size="10" text-anchor="end">C3</text>
<!-- Axial bonds (up/down alternating) -->
<line x1="400" y1="120" x2="400" y2="78" stroke="#ef4444" stroke-width="2"/>
<text x="400" y="72" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">ax↑</text>
<line x1="340" y1="80" x2="340" y2="42" stroke="#ef4444" stroke-width="2"/>
<text x="340" y="36" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">ax↑</text>
<line x1="230" y1="80" x2="230" y2="42" stroke="#ef4444" stroke-width="2"/>
<text x="230" y="36" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">ax↑</text>
<line x1="170" y1="120" x2="170" y2="162" stroke="#ef4444" stroke-width="2"/>
<text x="170" y="176" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">ax↓</text>
<line x1="230" y1="160" x2="230" y2="198" stroke="#ef4444" stroke-width="2"/>
<text x="230" y="212" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">ax↓</text>
<line x1="340" y1="160" x2="340" y2="198" stroke="#ef4444" stroke-width="2"/>
<text x="340" y="212" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">ax↓</text>
<!-- Equatorial bonds -->
<line x1="400" y1="120" x2="440" y2="140" stroke="#5eead4" stroke-width="2"/>
<text x="452" y="144" fill="#5eead4" font-size="10" font-weight="600">eq</text>
<line x1="340" y1="80" x2="380" y2="62" stroke="#5eead4" stroke-width="2"/>
<text x="392" y="60" fill="#5eead4" font-size="10" font-weight="600">eq</text>
<line x1="230" y1="80" x2="190" y2="62" stroke="#5eead4" stroke-width="2"/>
<text x="178" y="60" fill="#5eead4" font-size="10" font-weight="600" text-anchor="end">eq</text>
<line x1="170" y1="120" x2="130" y2="100" stroke="#5eead4" stroke-width="2"/>
<text x="118" y="98" fill="#5eead4" font-size="10" font-weight="600" text-anchor="end">eq</text>
<line x1="230" y1="160" x2="190" y2="180" stroke="#5eead4" stroke-width="2"/>
<text x="178" y="186" fill="#5eead4" font-size="10" font-weight="600" text-anchor="end">eq</text>
<line x1="340" y1="160" x2="380" y2="180" stroke="#5eead4" stroke-width="2"/>
<text x="392" y="184" fill="#5eead4" font-size="10" font-weight="600">eq</text>
<!-- Legend -->
<line x1="440" y1="18" x2="470" y2="18" stroke="#ef4444" stroke-width="2.5"/>
<text x="478" y="22" fill="#ef4444" font-size="10">axial (up/down)</text>
<line x1="440" y1="32" x2="470" y2="32" stroke="#5eead4" stroke-width="2.5"/>
<text x="478" y="36" fill="#5eead4" font-size="10">equatorial (outward)</text>
</svg></div>
<h3>3. Ring flipping</h3><div class="concept"><b>The ring flip:</b> A chair can interconvert with another chair through a higher-energy boat-like intermediate. When it flips, every axial bond becomes equatorial, and every equatorial bond becomes axial. Up groups stay up, down groups stay down — but their axial/equatorial label switches.</div>
<div class="tip">⭐ <b>Golden rule:</b> Bulky substituents prefer the EQUATORIAL position. Why? In the axial position, a bulky group bumps into the two other axial groups on the same face (1,3-diaxial interactions). Equatorial avoids that crowding. The bigger the substituent, the stronger the preference.</div>
<h3>4. Predicting the more stable chair</h3><p>For a multi-substituted cyclohexane:</p><ol><li>Draw both chair conformations.</li><li>Count how many substituents are equatorial vs axial in each.</li><li>The chair with MORE bulky groups equatorial is more stable.</li><li>If a tert-butyl group is present, it ALWAYS goes equatorial — it's so bulky it locks the ring in that conformation.</li></ol>
<div class="example"><b>Worked example:</b> cis-1-tert-butyl-2-methylcyclohexane. The tert-butyl MUST be equatorial (it's locked there). In cis substitution, the methyl is on the same face as t-Bu. With t-Bu equatorial, the cis methyl on the adjacent carbon is forced AXIAL. So this molecule lives almost exclusively in the chair where t-Bu is equatorial and methyl is axial — no ring-flipping happens.</div>
<div class="example"><b>Worked example 2:</b> all-cis 1,2,4-trimethylcyclohexane. In one chair: 2 methyls equatorial, 1 axial. In the other chair (after flipping): 2 methyls axial, 1 equatorial. The first chair (2 eq, 1 ax) is more stable.</div>
<h3>5. Cis/trans on rings</h3><p><b>Cis</b> = both substituents on the same face of the ring (both up, or both down). <b>Trans</b> = on opposite faces. On a cyclohexane chair, cis-1,2 means one axial + one equatorial; trans-1,2 means both axial OR both equatorial. After a ring flip, the relationship stays the same (still cis or still trans) — only the axial/equatorial labels swap.</p>`,
quiz:[
{q:"In butane, the most stable conformation about the C2-C3 bond is:",opts:["fully eclipsed","gauche","anti","totally eclipsed (syn-periplanar)"],correct:2,explain:"Step 1: Identify the bulky groups on C2 and C3. Each has one CH₃ group. Step 2: 'Most stable' means lowest energy. Eclipsed conformations have torsional + steric strain. Step 3: Among staggered (60°, 180°, 300°), the anti (180°) places the two methyls as far apart as possible — minimum steric strain. Gauche (60°) is also staggered but methyls are closer. Anti wins."},
{q:"In a cyclohexane chair, axial bonds:",opts:["point outward, slanted","point straight up or straight down","alternate randomly","all point in the same direction"],correct:1,explain:"Axial bonds are perpendicular to the average ring plane — they point straight up or straight down. They alternate around the ring: up, down, up, down, up, down. The other bond on each ring carbon is equatorial (slanted outward, roughly horizontal)."},
{q:"What does a ring flip do to substituents on cyclohexane?",opts:["converts cis to trans","converts axial to equatorial and vice versa","moves substituents to different carbons","does nothing chemically"],correct:1,explain:"A ring flip is the chair-to-other-chair conformational change. It swaps the axial/equatorial labels of every position. An axial group becomes equatorial; an equatorial group becomes axial. BUT cis stays cis, trans stays trans — the up/down relationship doesn't change."},
{q:"In cis-1-tert-butyl-3-methylcyclohexane, the most stable chair has:",opts:["both groups axial","both groups equatorial","t-Bu axial, methyl equatorial","t-Bu equatorial, methyl axial"],correct:1,explain:"Step 1: t-Bu is huge — it must be equatorial. Step 2: Determine cis-1,3 geometry. On cyclohexane, cis-1,3 substituents can BOTH be equatorial OR BOTH axial (unlike cis-1,2 which forces one axial, one equatorial). Step 3: With t-Bu equatorial, the cis-1,3 methyl is also equatorial. Best of both worlds — no strain."},
{q:"Why is the chair conformation of cyclohexane essentially strain-free?",opts:["all bonds are 90°","all bond angles are 109.5° and all H's are staggered","it's flat, like benzene","the H's all point outward"],correct:1,explain:"The chair achieves perfect sp³ geometry: every C–C–C angle is 109.5° (no angle strain), and every adjacent C–H pair is staggered like in ethane (no torsional strain). A flat hexagon would have 120° angles and eclipsed H's — much higher energy. The chair is nature's solution to fitting six sp³ carbons into a ring."},
{q:"In the most stable chair of trans-1,4-dimethylcyclohexane, the two methyls are:",opts:["both axial","both equatorial","one axial, one equatorial","they can't both be on the same chair"],correct:1,explain:"Trans-1,4: substituents on opposite faces of the ring. On a chair, trans-1,4 means one is up and one is down — both axial OR both equatorial (the two equivalent options). Both equatorial is more stable (no 1,3-diaxial strain). So the molecule sits comfortably with both methyls equatorial. The other chair (both axial) is much higher energy."},
{q:"In an axial position, a substituent experiences strain from:",opts:["the equatorial groups next to it","the two other axial groups on the same face of the ring (1,3-diaxial)","the ring oxygens","torsional eclipsing"],correct:1,explain:"This is THE key insight about why equatorial is preferred. An axial substituent on C1 sticks straight up (or down), and on the same face two carbons away are axial bonds at C3 and C5. If those C3 and C5 axial bonds carry H's, the strain is mild. If they carry bulky groups, the strain is severe. These '1,3-diaxial interactions' are why bulky groups always prefer equatorial."},
{q:"How many degrees apart are the substituents in a gauche conformation?",opts:["0°","60°","120°","180°"],correct:1,explain:"Gauche = staggered but adjacent (the two groups are on adjacent staggered positions, 60° apart). Anti = staggered and opposite, 180° apart. Gauche is slightly higher in energy than anti due to mild steric strain between the closer groups."},
{q:"For cis-1,2-dimethylcyclohexane in its chair conformations:",opts:["one chair has both methyls equatorial, the other has both axial","both chairs are identical","one has one equatorial + one axial; the other also has one equatorial + one axial","both chairs have both methyls equatorial"],correct:2,explain:"Cis-1,2 substituents are on the SAME face of the ring (both up or both down). On a chair, cis-1,2 ALWAYS means one is axial and one is equatorial — never both equatorial. After a ring flip, the methyls swap which one is axial vs equatorial, but it's always one of each. Both chairs of cis-1,2-dimethylcyclohexane are equally stable (degenerate)."},
{q:"A bulky tert-butyl group on cyclohexane essentially 'locks' the ring because:",opts:["it bonds to the ring covalently in a special way","its strong preference for equatorial means the ring rarely flips","it changes the hybridization","it forms hydrogen bonds"],correct:1,explain:"Tert-butyl (C(CH₃)₃) is so bulky that the energy difference between axial and equatorial is huge (about 5 kcal/mol). At room temperature, essentially 100% of molecules sit with t-Bu equatorial. The other chair (t-Bu axial) is so unstable that the ring effectively never visits it. This makes t-Bu a useful 'anchor' to control the conformation of the rest of the molecule — a common strategy in synthesis."}
]},

m6:{title:"Alkenes & Their Reactions",lead:"Electrophilic addition is the heart of alkene chemistry. Master the reagent-product table and Markovnikov's logic.",
body:`<h3>Why alkenes react</h3><p>The C=C double bond has TWO components: a strong σ bond (end-on overlap) and a weaker π bond (side-by-side overlap). The π electrons sit ABOVE and BELOW the plane of the molecule, exposed and loosely held. That makes them an easy target for any electron-hungry species (electrophile). Alkenes are nucleophiles by nature.</p>
<h3>1. The reagent table (memorize)</h3><table><tr><th>Reagent</th><th>Product</th><th>Stereochem</th><th>Regiochem</th></tr>
<tr><td>HX (HCl, HBr, HI)</td><td>alkyl halide</td><td>—</td><td>Markovnikov</td></tr>
<tr><td>HBr + ROOR (peroxides)</td><td>alkyl bromide</td><td>—</td><td>Anti-Markovnikov (radical)</td></tr>
<tr><td>H₂O / H₂SO₄</td><td>alcohol</td><td>—</td><td>Markovnikov; rearranges</td></tr>
<tr><td>Hg(OAc)₂/H₂O then NaBH₄</td><td>alcohol</td><td>—</td><td>Markovnikov; NO rearrangement</td></tr>
<tr><td>BH₃·THF then H₂O₂/NaOH</td><td>alcohol</td><td>syn</td><td>Anti-Markovnikov</td></tr>
<tr><td>X₂ (Br₂, Cl₂) in CH₂Cl₂</td><td>1,2-dihalide</td><td>anti (trans)</td><td>—</td></tr>
<tr><td>X₂ in H₂O</td><td>halohydrin</td><td>anti</td><td>Markovnikov (X to less subst.)</td></tr>
<tr><td>OsO₄ then NaHSO₃</td><td>1,2-diol</td><td>syn (cis)</td><td>—</td></tr>
<tr><td>O₃ then Zn/H₃O⁺</td><td>two carbonyls</td><td>cleaves C=C</td><td>—</td></tr>
<tr><td>H₂ / Pd-C (or Pt, Ni)</td><td>alkane</td><td>syn</td><td>—</td></tr>
<tr><td>RCO₃H (mCPBA)</td><td>epoxide</td><td>syn</td><td>—</td></tr></table>
<h3>2. Markovnikov's rule — the intuitive version</h3><div class="concept"><b>"The H goes to the carbon that already has more H's."</b> Equivalently: <b>"The rich get richer."</b><br>The deeper reason: when H⁺ adds first, it forms a carbocation on the OTHER carbon. That carbocation is more stable when it's MORE substituted (3° &gt; 2° &gt; 1° &gt; methyl). The reaction goes through the lower-energy intermediate. So the H ends up where it leaves the better-stabilized cation behind.</div>
<div class="example"><b>Worked example:</b> 2-methylpropene (isobutylene) + HBr.<br>Structure: (CH₃)₂C=CH₂. The two alkene carbons are: a tertiary carbon (bonded to 2 CH₃ groups) and a primary carbon (CH₂).<br>Step 1: H⁺ adds to one alkene carbon, forming a cation on the other. Adding H to the CH₂ end gives a 3° cation on the C(CH₃)₂ (stable). Adding H to the C(CH₃)₂ end would give a 1° cation on the CH₂ (unstable).<br>Step 2: Reaction goes through the 3° cation.<br>Step 3: Br⁻ attacks the 3° carbon → product is (CH₃)₂CBr–CH₃ = 2-bromo-2-methylpropane (tert-butyl bromide).<br>The H went to the CH₂ (more H's), Br went to the more substituted C. ✓ Markovnikov.</div>
<h3>3. Anti-Markovnikov: when the rule flips</h3><p>Two reactions reverse the regiochemistry: <b>HBr with peroxides</b> (radical mechanism, no carbocation) and <b>hydroboration (BH₃)</b>. In both cases, the H ends up on the MORE substituted carbon, and the Br/OH on the less substituted one. Useful when you need the "wrong" regiochemistry.</p>
<h3>4. Stereochemistry: syn vs anti addition</h3><div class="concept"><b>Syn addition</b> = both new bonds form on the SAME face of the alkene. Examples: H₂/Pd, OsO₄, BH₃, mCPBA.<br><b>Anti addition</b> = new bonds form on OPPOSITE faces. Example: Br₂ (goes through bromonium ion that blocks one face).</div>
