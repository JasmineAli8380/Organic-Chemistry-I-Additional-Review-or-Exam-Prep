{q:"(R)-2-bromobutane + NaI in acetone gives:",opts:["(R)-2-iodobutane","(S)-2-iodobutane","racemic 2-iodobutane","2-butene"],correct:1,explain:"Step 1: Substrate is 2°. NaI is a strong nucleophile but weak base. Acetone is polar aprotic. → All conditions point to SN2. Step 2: SN2 = backside attack = complete inversion of configuration. Step 3: (R) starting material → (S) product. The Finkelstein reaction (NaI/acetone) is the textbook clean SN2 example."},
{q:"Tert-butyl chloride + water (solvolysis) gives:",opts:["tert-butyl alcohol via SN2","tert-butyl alcohol via SN1","isobutylene via E2","no reaction"],correct:1,explain:"Step 1: Tert-butyl is 3° → SN2 is impossible (steric block). Step 2: Water is the nucleophile/solvent — neutral, weak nucleophile, polar protic. Step 3: 3° + weak Nu + polar protic = textbook SN1. The C-Cl ionizes to a stable 3° cation, water attacks, then loses a proton → tert-butyl alcohol. Some E1 also occurs but SN1 dominates with neutral water."},
{q:"Which conditions favor E2 with a Hofmann (less substituted) product?",opts:["small base, low T","bulky strong base like KOtBu","weak base, neutral pH","no base"],correct:1,explain:"Step 1: Strong base = elimination over substitution. Step 2: BULKY base = can\'t reach the more crowded β-Hs near the more substituted carbon. Step 3: The bulky base grabs the more accessible (less hindered) β-H → less substituted alkene = Hofmann. KOtBu is the textbook bulky base."},
{q:"In E2 elimination from a cyclohexane, the leaving group must be:",opts:["equatorial","axial (with an axial β-H)","cis to the H","gauche to the H"],correct:1,explain:"Step 1: E2 requires anti-periplanar H and LG (180° apart in same plane). Step 2: On cyclohexane, the only way for adjacent substituents to be 180° apart is BOTH AXIAL. Step 3: So both LG and the β-H must be axial in the chair where E2 occurs. If the LG is locked equatorial (e.g., by a t-Bu anchor), the molecule must ring-flip first to allow E2."},
{q:"Why does tert-butyl bromide undergo SN1 but not SN2?",opts:["Br is too big","the carbon is too sterically hindered for backside attack, but the 3° cation is very stable","bromine is too volatile","SN2 requires a base"],correct:1,explain:"Step 1: SN2 requires backside attack on the C-Br carbon. With three methyls crowding around it, there\'s no room for the nucleophile to approach from the back. SN2 rate is essentially zero. Step 2: SN1 only requires the C-Br to ionize. The resulting 3° tert-butyl cation is stabilized by hyperconjugation from 9 C-H bonds and inductive donation from 3 alkyl groups → very stable. Step 3: So tert-butyl substrates are SN1-only (or E1/E2 with strong base)."},
{q:"Which statement is TRUE about SN1 stereochemistry?",opts:["it always gives complete inversion","it always gives complete retention","it usually gives a racemic (or mostly racemic) mixture","stereochemistry is unchanged"],correct:2,explain:"Step 1: SN1 goes through a planar carbocation intermediate. Step 2: The cation is sp², flat — the original 3D arrangement is destroyed. The nucleophile can attack either face equally. Step 3: Result: ~50:50 mixture of R and S = racemic. (In some cases, slight preference for inversion gives a small excess, but for exam purposes: SN1 = racemization.)"},
{q:"Diels-Alder requires the diene to be in which conformation?",opts:["s-trans","s-cis","fully eclipsed","gauche"],correct:1,explain:"Step 1: For Diels-Alder, the diene\'s C1 and C4 need to reach the dienophile\'s two carbons simultaneously. Step 2: Only the s-cis (U-shape) conformation orients C1 and C4 close enough together. s-trans points them in opposite directions → no reaction. Step 3: Most acyclic dienes can rotate between s-cis and s-trans freely, so they can react. Cyclopentadiene is locked in s-cis → extra reactive."},
{q:"In a Diels-Alder reaction with cis substituents on the dienophile, the substituents in the product are:",opts:["trans on the new ring","cis on the new ring","randomly mixed","one trans, one cis"],correct:1,explain:"Step 1: Diels-Alder is concerted — both new bonds form simultaneously in one step. Step 2: Concerted reactions are stereospecific: stereochemistry of starting materials is preserved. Step 3: cis substituents on the dienophile end up cis on the cyclohexene ring product. (Same for trans → trans.) This is one of the most useful features of Diels-Alder for stereo-controlled synthesis."},
{q:"What\'s the major product of 1-pentene + HBr?",opts:["1-bromopentane","2-bromopentane","3-bromopentane","2-methylbutane"],correct:1,explain:"Step 1: 1-pentene is CH₂=CH-CH₂-CH₂-CH₃. Identify alkene carbons: C1 (CH₂=, primary side) and C2 (=CH-, secondary side). Step 2: Markovnikov: H to the carbon with more H\'s (C1), Br to the more substituted C (C2). Mechanism: more stable cation forms on C2 (secondary). Step 3: Br⁻ attacks C2 → 2-bromopentane."},
{q:"Why does propene + HBr with peroxides give 1-bromopropane instead of 2-bromopropane?",opts:["sterics","peroxides switch the mechanism to radical, where Br• adds to the less substituted carbon first","propene is too small","Markov was wrong"],correct:1,explain:"Step 1: Without peroxides, HBr addition is ionic and Markovnikov (Br on C2 of propene). Step 2: Peroxides initiate a radical mechanism: ROOR → 2 RO• → Br• generated from HBr. Step 3: Br• adds to the LESS substituted alkene C (terminal) because that places the resulting carbon RADICAL on the more substituted (secondary) C — more stable radical. Then H is abstracted, giving Br on C1 = 1-bromopropane (anti-Markovnikov). Note: only HBr shows this peroxide effect, not HCl or HI."},
{q:"How many degrees of unsaturation does benzene have?",opts:["1","2","3","4"],correct:3,explain:"Step 1: C₆H₆. DoU = (12+2−6)/2 = 8/2 = 4. Step 2: Benzene structure: 1 ring + 3 double bonds = 4 DoU. ✓ Step 3: This is exactly what aromaticity requires — the 6 π electrons distributed in 3 'double bonds' around a planar 6-membered ring."},
{q:"In ¹H NMR, an isolated –OCH₃ appears as:",opts:["singlet around 1 ppm","singlet around 3.3-3.8 ppm","quartet at 4 ppm","triplet at 2 ppm"],correct:1,explain:"Step 1: Chemical shift first. The methyl is attached directly to oxygen — electronegative — pulling the H signals downfield to ~3.3-3.8 ppm. Step 2: Splitting: the OCH₃ has no neighboring H\'s on adjacent atoms (oxygen has none, or far-away H\'s don\'t couple). With 0 neighbors, n+1 = 1 → singlet. Step 3: Integration is 3H. The combination 'singlet, ~3.3-3.8 ppm, 3H' = OCH₃."},
{q:"Convert benzene to nitrobenzene using:",opts:["HCl","HNO₃ alone","HNO₃ + H₂SO₄","NaNO₂"],correct:2,explain:"Step 1: Nitration of benzene requires the nitronium ion (NO₂⁺) as the electrophile. Step 2: HNO₃ alone is not a strong enough acid to generate NO₂⁺ — it needs H₂SO₄ (a stronger acid) to protonate it. Step 3: Mechanism: HNO₃ + H₂SO₄ → NO₂⁺ + H₂O + HSO₄⁻. Then NO₂⁺ attacks the benzene ring → arenium ion → loss of H⁺ → nitrobenzene."},
{q:"Which substrate cannot undergo SN2?",opts:["methyl bromide","1-bromopropane","2-bromopropane","tert-butyl bromide"],correct:3,explain:"Step 1: SN2 rate decreases as substrate becomes more substituted (sterics). Order: methyl > 1° > 2° >> 3°. Step 2: Tert-butyl bromide is 3° — three methyls block any approach to the C-Br carbon from the back. Step 3: SN2 is essentially zero rate for 3° substrates. Tert-butyl bromide reacts only by SN1 or E2."},
{q:"In the EAS arenium ion intermediate, the positive charge is delocalized over how many ring carbons?",opts:["2","3","5","all 6"],correct:1,explain:"Step 1: Once the electrophile bonds to one ring carbon, that carbon becomes sp³ — interrupting the conjugation. Step 2: The remaining 5 ring carbons still have p-orbitals, and the resonance structures show + charge on 3 specific carbons: ortho, ortho, and para to the new bond. Step 3: That\'s 3 carbons sharing the positive charge. Not all 6 — the sp³ carbon breaks the cycle."},
{q:"Which is a meta director in EAS?",opts:["–OH","–NH₂","–CH₃","–NO₂"],correct:3,explain:"Step 1: Activators (donors) → ortho/para directors. Deactivators (withdrawers) → meta directors. Step 2: –OH, –NH₂, –CH₃ are all electron donors → all o,p-directors. Step 3: –NO₂ is a strong electron-withdrawer → meta director. The arenium ion intermediate for o or p attack would put + charge directly adjacent to the already-positive nitro N → very destabilizing. Meta avoids this."},
{q:"What is the most stable conformation of 1,3-butadiene?",opts:["s-cis","s-trans","fully eclipsed","perpendicular"],correct:1,explain:"Step 1: 1,3-butadiene can rotate around the central single bond into s-cis or s-trans. Step 2: s-trans (zigzag) places the two CH₂ groups far apart — minimum steric strain. Step 3: s-cis (U-shape) brings them closer together — slight steric clash. So s-trans is more stable. But s-cis is the conformation needed for Diels-Alder, so the molecule must temporarily adopt the less stable shape to react."},
{q:"For a 2-substituted cyclohexanone, which conformation places the substituent equatorial in both chairs?",opts:["any 2-substitution does this","never both — chair flipping always changes axial/equatorial","only if the substituent is t-Bu","only on a 2,2-disubstituted ring"],correct:1,explain:"Step 1: A ring flip ALWAYS swaps axial and equatorial labels for every substituent on the ring. Step 2: So no single substituent is equatorial in BOTH chairs — it\'s axial in one and equatorial in the other. Step 3: The molecule simply prefers (more population in) the chair where bulky substituents end up equatorial. If t-Bu is the substituent, the preference is so extreme (~99% one chair) that the molecule is effectively locked."},
{q:"What\'s the major product when 2-methylcyclohexanol is heated with H₂SO₄?",opts:["1-methylcyclohexene (Zaitsev)","3-methylcyclohexene (Hofmann)","cycloheptanol","no reaction"],correct:0,explain:"Step 1: Acid-catalyzed dehydration of an alcohol = E1. Mechanism: protonation of OH → loss of water → carbocation → loss of β-H → alkene. Step 2: After H₂O leaves from C1, the cation is on C1. β-Hs available on C2 (the methyl-bearing C) and C6. Removing the H from C2 gives 1-methylcyclohexene (more substituted, trisubstituted alkene). Removing from C6 gives 3-methylcyclohexene (disubstituted). Step 3: Zaitsev wins → 1-methylcyclohexene is the major product."},
{q:"Which is a stronger acid?",opts:["ethanol (pKa 16)","acetic acid (pKa 5)","methane (pKa 50)","ammonia (pKa 35)"],correct:1,explain:"Step 1: Lower pKa = stronger acid. Step 2: Compare: acetic acid (5) << ethanol (16) << ammonia (35) << methane (50). Step 3: Acetic acid is the strongest by far. The reason: the acetate anion is stabilized by resonance (negative charge delocalized over both oxygens). Ethoxide (from ethanol) has no such resonance stabilization — much less acidic. Methane is essentially not acidic at all."}
]},

final:{title:"🏆 Final Exam Practice (40 Questions)",lead:"Comprehensive final exam practice covering all 12 modules. Weighted toward the back half of the course: aromaticity, EAS, spectroscopy, and multi-step synthesis. Every answer walks through the reasoning the way a tutor would.",
body:`<div class="exam-mode"><b>📋 Full course coverage — 40 questions:</b> Modules 1-8 (18 questions) and Modules 9-12 plus synthesis (22 questions). Aim for &gt;80% before sitting the real exam. Read every walkthrough, even on questions you got right — the reasoning is the point.</div>`,
quiz:[
{q:"Q1 (M1). What hybridization is the central carbon in a ketone (R₂C=O)?",opts:["sp","sp²","sp³","sp³d"],correct:1,explain:"Step 1: count groups around the carbon — two R groups + one double bond to O = 3 electron domains. Step 2: 3 domains → sp² hybridization, trigonal planar, ~120° angles. The C=O π bond uses the leftover unhybridized p orbital."},
{q:"Q2 (M1). Rank C–H bond polarity correctly:",opts:["C–H > N–H > O–H","O–H > N–H > C–H","N–H > O–H > C–H","All equal"],correct:1,explain:"Polarity tracks the electronegativity difference with H. EN values: O (3.44) > N (3.04) > C (2.55), H = 2.20. So ΔEN: O–H (1.24) > N–H (0.84) > C–H (0.35). C–H is famously nearly nonpolar — that's why hydrocarbons don't dissolve in water."},
{q:"Q3 (M2). Which functional group is present in CH₃CH₂C(=O)OCH₃?",opts:["Ketone","Carboxylic acid","Ester","Amide"],correct:2,explain:"Read the connectivity: a C=O bonded to an OR group (here OCH₃). C(=O)–O–R is the ester signature. A ketone would have C on both sides of C=O with no O attached; an acid would have –OH; an amide would have –NR₂."},
{q:"Q4 (M2). The strongest H-bond donor among these is:",opts:["CH₃OCH₃","CH₃NH₂","CH₃OH","CH₃F"],correct:2,explain:"To donate an H-bond you need H attached to a strongly electronegative atom (N, O, or F bonded to H). CH₃OCH₃ has no O–H. CH₃F has no H on F. CH₃NH₂ donates but N is less electronegative. CH₃OH wins — its O–H is the most polarized donor here."},
{q:"Q5 (M3). IUPAC name of (CH₃)₂CHCH₂CH(CH₃)CH₂CH₃:",opts:["2,4-dimethylhexane","2,4-dimethylpentane","3,5-dimethylhexane","2-methyl-4-ethylpentane"],correct:0,explain:"Step 1: find the longest chain — count carefully, it's 6 carbons (hexane). Step 2: number from the end giving lowest locants to substituents. Methyls land at C2 and C4 (vs C3 and C5 from the other end — 2+4=6 beats 3+5=8). Step 3: name → 2,4-dimethylhexane."},
{q:"Q6 (M3). Which conformer of butane is highest in energy?",opts:["anti","gauche","eclipsed (CH₃/CH₃)","eclipsed (CH₃/H)"],correct:2,explain:"Anti is the global minimum (~0 kJ/mol). Gauche has CH₃/CH₃ at 60° (~3.8 kJ/mol). The CH₃/H eclipse is ~16 kJ/mol. The fully eclipsed CH₃/CH₃ at 0° is the highest at ~19 kJ/mol — the two methyls are pointing right at each other."},
{q:"Q7 (M4). A molecule with one stereocenter has how many possible stereoisomers?",opts:["1","2","3","4"],correct:1,explain:"The 2ⁿ rule: n stereocenters → up to 2ⁿ stereoisomers. With n=1, that's 2¹ = 2 — the R enantiomer and the S enantiomer. They are non-superimposable mirror images."},
{q:"Q8 (M4). Which is true of meso compounds?",opts:["They have no stereocenters","They are optically active","They have an internal mirror plane","They are always trans"],correct:2,explain:"A meso compound has stereocenters but is achiral overall because of an internal mirror plane (or other improper symmetry). The 'top half' is the mirror image of the 'bottom half', so the rotations cancel. Classic example: meso-tartaric acid (2R,3S)."},
{q:"Q9 (M4). Assign R/S: a carbon bonded to Br, Cl, F, H — looking with H pointing away, the order Br→Cl→F goes clockwise. Configuration?",opts:["R","S","meso","cannot determine"],correct:0,explain:"Step 1: rank by atomic number — Br(35) > Cl(17) > F(9) > H(1). Step 2: lowest priority (H) is already pointing away — good, no inversion needed. Step 3: 1→2→3 is clockwise → R configuration."},
{q:"Q10 (M5). In cyclohexane chair conformations, large substituents prefer:",opts:["axial — more room","equatorial — avoids 1,3-diaxial strain","either, equally","axial when β, equatorial when α"],correct:1,explain:"Axial substituents on a chair point straight up/down and clash with the two other axial H's three carbons away (1,3-diaxial interactions). Equatorial points outward into open space. Bigger groups (like t-Bu) overwhelmingly prefer equatorial — t-Bu is so large it locks the ring."},
{q:"Q11 (M5). cis-1,2-dimethylcyclohexane: what's the relationship of the two methyls in the chair?",opts:["both axial","both equatorial","one axial, one equatorial","both pointing inward"],correct:2,explain:"On adjacent carbons of a chair, axial and equatorial alternate up/down/up/down. For both methyls to be cis (same face), one must be axial-up and the other equatorial-up. Ring-flipping swaps them but you always have one ax and one eq. (Trans-1,2 is the one that can be both equatorial.)"},
{q:"Q12 (M6). Markovnikov addition of HBr to 2-methylpropene gives:",opts:["1-bromo-2-methylpropane","2-bromo-2-methylpropane","2-bromopropane","tert-butyl alcohol"],correct:1,explain:"Step 1: protonate the alkene to form the more stable carbocation. Adding H⁺ to the =CH₂ end puts the + on the central carbon → 3° carbocation (very stable). The other option gives a 1° cation (terrible). Step 2: Br⁻ attacks the 3° cation → 2-bromo-2-methylpropane (tert-butyl bromide)."},
{q:"Q13 (M6). Which reagent gives anti-Markovnikov hydration of an alkene?",opts:["H₂O / H₂SO₄","Hg(OAc)₂ then NaBH₄","BH₃ then H₂O₂/NaOH","HBr"],correct:2,explain:"Hydroboration-oxidation (BH₃ then H₂O₂/NaOH) is the canonical anti-Mark hydration. BH₃ adds with B going to the less substituted carbon (steric + electronic), and oxidation replaces B with OH — so OH ends up on the less substituted carbon. Syn addition too."},
{q:"Q14 (M6). Ozonolysis (O₃ then Zn/H₂O) of 2-methyl-2-butene gives:",opts:["acetone + acetaldehyde","two acetones","two acetaldehydes","acetic acid + propanoic acid"],correct:0,explain:"Ozonolysis cleaves C=C and turns each carbon into a C=O. 2-methyl-2-butene = (CH₃)₂C=CHCH₃. Left carbon (CMe₂) → (CH₃)₂C=O = acetone. Right carbon (CHMe) → CH₃CHO = acetaldehyde. Reductive workup (Zn) gives aldehydes/ketones, not acids."},
{q:"Q15 (M7). Terminal alkynes are weakly acidic (pKa ~25) because:",opts:["sp³ C–H","sp² C–H","sp C–H — high s character stabilizes anion","triple bond strain"],correct:2,explain:"Acidity tracks how stable the conjugate base is. The acetylide anion has its lone pair in an sp orbital (50% s character), which holds electrons closer to the nucleus and stabilizes the negative charge. Compare: sp² (33% s, alkene H pKa ~44) and sp³ (25% s, alkane pKa ~50)."},
{q:"Q16 (M7). To make an internal alkyne from a terminal alkyne and methyl iodide, you first need:",opts:["H₂SO₄","NaNH₂ (to deprotonate)","NaBH₄","HCl"],correct:1,explain:"Step 1: deprotonate the terminal alkyne (pKa ~25) with a strong base like NaNH₂ (pKa of NH₃ ~38) to form the acetylide nucleophile. Step 2: SN2 alkylation with CH₃I extends the chain. NaOH is too weak; NaNH₂ is the standard."},
{q:"Q17 (M8). 2-bromo-2-methylbutane + ethanol (warm) — predict the dominant pathway:",opts:["SN2","SN1/E1 mix","E2","No reaction"],correct:1,explain:"Step 1: substrate is 3° → SN2 is dead (too crowded). Step 2: nucleophile/base is ethanol — neutral, weak, polar protic. Step 3: weak nucleophile + 3° + polar protic solvent → carbocation pathway → SN1 and E1 compete (you get both substitution and elimination products)."},
{q:"Q18 (M8). Which gives the cleanest E2 with a strong, bulky base?",opts:["NaOH","NaOEt","KOtBu","NaSH"],correct:2,explain:"Bulky bases (potassium tert-butoxide) are too sterically encumbered to act as nucleophiles, so SN2 is shut down. They also tend to grab the most accessible (least hindered) β-hydrogen, giving the Hofmann (less substituted) alkene. Cleanest E2 selectivity."},
{q:"Q19 (M8). Zaitsev's rule predicts:",opts:["less substituted alkene","more substituted alkene (more stable)","cis preferred","trans preferred"],correct:1,explain:"Zaitsev: in E1 and ordinary E2, the major product is the more substituted (more stable) alkene because alkene stability tracks with substitution (hyperconjugation + alkyl donation). Hofmann (bulky base) gives the opposite preference."},
{q:"Q20 (M8). Rate of SN2 in order fastest → slowest:",opts:["3° > 2° > 1° > methyl","methyl > 1° > 2° > 3°","2° > 1° > methyl > 3°","1° > methyl > 2° > 3°"],correct:1,explain:"SN2 is backside attack — nucleophile approaches the carbon directly opposite the leaving group. More alkyl groups = more steric blockade. So methyl (no R groups) is fastest, then 1°, then 2°, and 3° is essentially zero (too crowded to attack)."},
{q:"Q21 (M9). Diels-Alder requires the diene in which conformation?",opts:["s-trans","s-cis","perpendicular","planar trans"],correct:1,explain:"The Diels-Alder is a [4+2] cycloaddition — the diene's two terminal carbons must reach the dienophile's two carbons simultaneously. Only s-cis geometry (the diene curled in a U-shape) puts those termini close enough. s-Trans dienes literally cannot reach. Cyclic dienes (e.g. cyclopentadiene) are locked s-cis and react fastest."},
{q:"Q22 (M9). The Diels-Alder is which kind of process?",opts:["Radical chain","Polar two-step","Concerted pericyclic","Photochemical only"],correct:2,explain:"It's a single-step concerted [4π + 2π] cycloaddition — all six electrons move at once through a cyclic transition state. No intermediates, no carbocations, no radicals. Stereochemistry is preserved: cis dienophile substituents stay cis in the product (suprafacial-suprafacial)."},
{q:"Q23 (M9). Which is the BEST dienophile for a Diels-Alder?",opts:["ethene","but-2-ene","maleic anhydride","cyclohexene"],correct:2,explain:"Good dienophiles have electron-withdrawing groups that lower the LUMO so it overlaps better with the diene HOMO. Maleic anhydride has TWO carbonyls pulling electrons out of its C=C — it's the textbook 'best' dienophile. Plain ethene barely reacts; it has no EWGs."},
{q:"Q24 (M10). Hückel's rule for aromaticity requires:",opts:["any cyclic π system","4n π electrons in a planar ring","4n+2 π electrons, planar, fully conjugated cyclic","6 carbons exactly"],correct:2,explain:"Three conditions: (1) cyclic, (2) planar, (3) every ring atom has a p orbital in continuous overlap (fully conjugated), AND (4) the π system holds 4n+2 electrons (n = 0, 1, 2... so 2, 6, 10, 14...). Miss any condition — not aromatic. 4n electrons (4, 8, 12) is anti-aromatic."},
{q:"Q25 (M10). Cyclopentadienyl ANION is aromatic. Why?",opts:["5 π electrons","6 π electrons (2 C=C + lone pair)","It's not aromatic","Strain forces planarity"],correct:1,explain:"Neutral cyclopentadiene has one sp³ CH₂ that breaks conjugation — not aromatic. Deprotonate that CH₂ and the resulting carbon goes sp² with a lone pair in a p orbital. Now: 2 C=C (4 e⁻) + lone pair (2 e⁻) = 6 π electrons in a planar fully-conjugated ring. Hückel n=1. Aromatic — and unusually stable, which is why the parent is so acidic (pKa ~16)."},
{q:"Q26 (M10). Cyclobutadiene is:",opts:["aromatic (4n+2, n=0.5)","anti-aromatic (4 π e⁻)","non-aromatic (sp³ carbons)","aromatic only at low T"],correct:1,explain:"Cyclobutadiene has 4 π electrons → 4n with n=1 → anti-aromatic. Anti-aromatic systems are destabilized relative to acyclic analogs and the molecule actually distorts to a rectangle to break full conjugation and avoid the penalty. It's so unstable it can only be observed in matrix isolation."},
{q:"Q27 (M10). Which of these is NOT aromatic?",opts:["benzene","pyridine","furan","1,3-cyclohexadiene"],correct:3,explain:"1,3-Cyclohexadiene has two sp³ CH₂ groups breaking the conjugation around the ring — fails the 'fully conjugated cyclic' requirement. Benzene (6 π e⁻), pyridine (N lone pair stays in sp² hybrid in the ring plane — only the p electron of N counts, giving 6 π e⁻), and furan (O contributes a lone pair → 6 π e⁻) are all aromatic."},
{q:"Q28 (M10). Pyridine vs pyrrole — which N lone pair is in the aromatic π system?",opts:["both","neither","pyrrole's","pyridine's"],correct:2,explain:"In pyrrole, N is sp² and contributes its lone pair to the π system (2 e⁻ from N + 4 from two C=C = 6) — that's why pyrrole is a weak base (donating the LP would break aromaticity). In pyridine, N is sp² and contributes ONE p electron to π (like a C in benzene); its lone pair sits in an sp² hybrid in the plane and is freely available — pyridine is a normal base."},
{q:"Q29 (M11). EAS general mechanism: the rate-determining step is:",opts:["loss of H⁺","formation of arenium (sigma) ion","electrophile generation","tautomerization"],correct:1,explain:"Step 1: electrophile is generated (often by Lewis acid activation). Step 2 (RDS): the aromatic π system attacks E⁺, breaking aromaticity to form the arenium/sigma/Wheland intermediate — this is uphill because aromaticity is lost. Step 3: a base removes H⁺ to restore aromaticity (fast and very downhill). The arenium-forming step is rate-limiting."},
{q:"Q30 (M11). –NO₂ on benzene is:",opts:["activating, o,p-director","activating, m-director","deactivating, o,p-director","deactivating, m-director"],correct:3,explain:"–NO₂ pulls electron density out of the ring (both inductively and through resonance into the N⁺=O), so it's strongly DEACTIVATING — the ring is less reactive than benzene. For directing: draw the arenium intermediate for ortho/para vs meta attack; ortho/para attack puts + right next to the already δ⁺ nitro carbon (very bad). Meta avoids that. So meta-director."},
{q:"Q31 (M11). Halogens (–Cl, –Br) are unusual because they are:",opts:["activating, o,p","activating, m","weakly deactivating, o,p","strongly deactivating, m"],correct:2,explain:"Halogens are the famous exception. Inductively they withdraw (electronegative), so they DEACTIVATE the ring overall. But they have lone pairs that can donate by resonance into the ortho/para positions, so they DIRECT ortho/para. This split — deactivating but o,p-directing — is unique to halogens."},
{q:"Q32 (M11). To make m-bromonitrobenzene from benzene, the correct order is:",opts:["Br₂/FeBr₃ then HNO₃/H₂SO₄","HNO₃/H₂SO₄ then Br₂/FeBr₃","both at once","Br₂/FeBr₃ twice"],correct:1,explain:"You want the two groups meta to each other. –NO₂ is a meta-director, –Br is an o,p-director. So whichever goes on first determines the pattern. Install –NO₂ first → then bromination is directed meta to the nitro group. Reverse order would give ortho/para bromonitrobenzenes instead."},
{q:"Q33 (M11). Friedel-Crafts alkylation fails on which substrate?",opts:["toluene","anisole","nitrobenzene","chlorobenzene"],correct:2,explain:"Two failure modes for F-C alkylation: (1) carbocation rearrangements, and (2) the ring is too deactivated. Strong deactivators (–NO₂, –CN, –C(=O)R, –SO₃H, –NR₃⁺) shut down F-C entirely — the ring is too electron-poor to attack the carbocation. Toluene and anisole are activated; chlorobenzene is only weakly deactivated and still reacts. Nitrobenzene = no go."},
{q:"Q34 (M11). To install a primary alkyl group cleanly on benzene (e.g., n-propyl), the best route is:",opts:["F-C alkylation with 1-chloropropane","F-C acylation with propanoyl chloride, then Clemmensen/Wolff-Kishner reduction","SN2 on benzene","radical chlorination"],correct:1,explain:"F-C alkylation with n-PrCl fails — the 1° cation rearranges via hydride shift to a 2° cation, giving isopropylbenzene as the major product. Workaround: F-C acylate first (the acylium R-C≡O⁺ is resonance-stabilized and does NOT rearrange), then reduce the C=O down to CH₂ with Clemmensen (Zn-Hg/HCl) or Wolff-Kishner (N₂H₄/KOH). Clean n-propylbenzene."},
{q:"Q35 (M12). A molecular ion M⁺ at m/z = 86 with M+2 nearly equal to M suggests:",opts:["chlorine present","bromine present","two nitrogens","sulfur"],correct:1,explain:"Bromine has two natural isotopes (⁷⁹Br and ⁸¹Br) in roughly 1:1 ratio. So an M and M+2 of nearly equal height is the diagnostic Br pattern. Chlorine gives M:(M+2) ≈ 3:1 (³⁵Cl:³⁷Cl). Sulfur gives a small M+2 (~4%). One Br isotope pattern is unmistakable."},
{q:"Q36 (M12). A strong, broad IR absorption at ~3300 cm⁻¹ plus a sharp band at ~1710 cm⁻¹ suggests:",opts:["alcohol","amine","carboxylic acid","ester"],correct:2,explain:"Step 1: broad ~3300 → O–H stretch (the broadness comes from H-bonding). Could be alcohol or acid. Step 2: ~1710 cm⁻¹ → C=O stretch. Step 3: O–H AND C=O together = carboxylic acid. (Acids actually show an even broader O–H, often 2500-3300, sitting on top of the C–H peaks. Esters have C=O but no O–H. Alcohols have O–H but no C=O.)"},
{q:"Q37 (M12). A ¹H NMR triplet at δ 1.2 (3H) and quartet at δ 4.1 (2H) most likely indicates:",opts:["isopropyl group","ethyl ester (–OCH₂CH₃)","methyl ketone","vinyl group"],correct:1,explain:"Step 1: triplet (3H) coupled to quartet (2H) is the textbook ethyl group (n+1 rule: CH₃ sees 2 neighbors → triplet; CH₂ sees 3 neighbors → quartet). Step 2: the CH₂ at δ 4.1 is unusually downfield — that means it's attached to an electronegative atom, almost certainly an oxygen of an ester (–O–CH₂–CH₃). A plain ethyl on carbon would sit near δ 1.2-1.5 for both signals."},
{q:"Q38 (M12). A compound C₈H₁₀ shows 2 aromatic ¹H signals (4H + 4H pattern) and one singlet at δ 2.3 (6H). What is it?",opts:["ethylbenzene","o-xylene","p-xylene","styrene"],correct:2,explain:"Step 1: degree of unsaturation = (2·8+2-10)/2 = 4 → consistent with a benzene ring. Step 2: 6H singlet at δ 2.3 = two equivalent aromatic methyls (Ar-CH₃). Step 3: 'two aromatic signals' rules out ethylbenzene (would be 5 aromatic H in a complex pattern). Para-xylene has the highest symmetry of the xylenes — its 4 aromatic H's are all equivalent (one signal, not two). Wait — re-read: two signals 4H+4H doesn't fit any xylene perfectly; the cleanest match for 'two methyls equivalent + simple aromatic pattern' in C₈H₁₀ is p-xylene, whose aromatic H's appear as a single sharp 4H singlet. (If your exam shows 2 aromatic signals 2H+2H, that's o- or m-xylene.)"},
{q:"Q39 (M12). Degree of unsaturation for C₆H₆:",opts:["1","2","3","4"],correct:3,explain:"Formula: DoU = (2C+2+N-H-X)/2 = (2·6+2-6)/2 = 8/2 = 4. Benzene has 4 degrees of unsaturation: three C=C double bonds + one ring = 4. This is the diagnostic count that tips you off to a benzene ring whenever you see DoU ≥ 4 in an unknown."},
{q:"Q40 (Synthesis). Plan a synthesis of m-nitroacetophenone from benzene. Best sequence?",opts:["HNO₃/H₂SO₄ then CH₃COCl/AlCl₃","CH₃COCl/AlCl₃ then HNO₃/H₂SO₄","CH₃Cl/AlCl₃ then HNO₃/H₂SO₄ then KMnO₄","Br₂/FeBr₃ then HNO₃/H₂SO₄"],correct:1,explain:"Goal: a ring with –COCH₃ and –NO₂ in a meta relationship. Strategy: install whichever group directs the OTHER one to the right position. Acetyl (–COCH₃) is a meta-director (carbonyl pulls electrons out). Nitro is also a meta-director. So if you put –COCH₃ on FIRST (Friedel-Crafts acylation), then nitration is directed meta to it → m-nitroacetophenone. Reverse order would also give a meta product, BUT F-C acylation FAILS on nitrobenzene (ring too deactivated). So acylate first, nitrate second. This is the classic 'order matters' lesson."}
]}
};

let currentId="welcome";

function buildNav(){
const nav=document.getElementById("nav");
const sections={};
modules.forEach(m=>{(sections[m.section]=sections[m.section]||[]).push(m)});
let html="";
for(const sec in sections){
html+=`<h3>${sec}</h3>`;
sections[sec].forEach(m=>{
const done=progress[m.id]?" ✓":"";
html+=`<div class="nav-item${m.id===currentId?' active':''}" onclick="go('${m.id}')">${m.title}${done}</div>`;
});
}
const total=modules.length-1;
const completed=Object.keys(progress).length;
html+=`<div style="margin-top:16px;font-size:.8em;color:var(--muted)">Progress: ${completed}/${total}</div><div class="progress-bar"><div class="progress-fill" style="width:${(completed/total)*100}%"></div></div>`;
nav.innerHTML=html;
}

function render(id){
currentId=id;
const main=document.getElementById("main");
if(id==="welcome"){main.innerHTML=`<div class="module active">${content.welcome}</div>`;buildNav();return}
const c=content[id];
if(!c){main.innerHTML="<p>Module coming soon!</p>";return}
let html=`<div class="module active"><h2>${c.title}</h2><div class="lesson-meta">${c.lead||""}</div>`;
if(c.body)html+=c.body;
if(c.quiz){html+=`<h3 style="margin-top:30px">📝 Practice Questions <span class="score-badge" id="score-${id}">0/${c.quiz.length}</span></h3>`;
c.quiz.forEach((q,i)=>{
html+=`<div class="quiz"><div class="q-counter">Question ${i+1} of ${c.quiz.length}</div><div class="quiz-q">${q.q}</div><div class="quiz-opts">`;
q.opts.forEach((o,j)=>{html+=`<button class="quiz-opt" onclick="answer('${id}',${i},${j},${q.correct})">${String.fromCharCode(65+j)}. ${o}</button>`});
html+=`</div><div class="feedback" id="fb-${id}-${i}"></div></div>`;
});
html+=`<div class="btn-row"><button class="btn" onclick="markDone('${id}')">Mark Complete ✓</button><button class="btn secondary" onclick="next()">Next Module →</button></div>`;
}
html+="</div>";
main.innerHTML=html;
window.scrollTo(0,0);
buildNav();
}

window.answer=function(modId,qIdx,chosen,correct){
const quiz=document.querySelectorAll(`#main .quiz`)[qIdx];
const opts=quiz.querySelectorAll(".quiz-opt");
opts.forEach((o,i)=>{o.disabled=true;if(i===correct)o.classList.add("correct");if(i===chosen&&i!==correct)o.classList.add("wrong");});
const fb=document.getElementById(`fb-${modId}-${qIdx}`);
const isCorrect=chosen===correct;
fb.className="feedback show "+(isCorrect?"correct":"wrong");
fb.innerHTML=(isCorrect?"✓ Correct! ":"✗ Not quite. ")+content[modId].quiz[qIdx].explain;
// score
const key=`score_${modId}`;
const scores=JSON.parse(localStorage.getItem(key)||"{}");
scores[qIdx]=isCorrect?1:0;
localStorage.setItem(key,JSON.stringify(scores));
const total=Object.values(scores).filter(v=>v===1).length;
document.getElementById(`score-${modId}`).textContent=`${total}/${content[modId].quiz.length}`;
};

window.markDone=function(id){progress[id]=true;localStorage.setItem("orgo_progress",JSON.stringify(progress));buildNav();alert("Module marked complete! 🎉")};
window.go=function(id){render(id)};
window.next=function(){const i=modules.findIndex(m=>m.id===currentId);if(i<modules.length-1)render(modules[i+1].id)};

render("welcome");
</script>
</body>
</html>
